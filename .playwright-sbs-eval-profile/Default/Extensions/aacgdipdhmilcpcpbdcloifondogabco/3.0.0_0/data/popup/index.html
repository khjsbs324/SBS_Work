<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/data/mdl/material.min.css"/>
    <link rel="stylesheet" href="/data/css/common.css"/>
    <link rel="stylesheet" href="/data/css/fa.all.css"/>
    <link rel="stylesheet" href="/data/mdl/material.yellow-orange.min.css"/>
    <link rel="stylesheet" href="/data/css/popup.css"/>
</head>
<body>

    <div id="ui-wrapper" class="container"  style="width:400px;height:600px;">

        <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
            <header class="mdl-layout__header">
                <div class="mdl-layout__header-row">
                    <span class="mdl-layout-logo">
                        <a href="https://url-shortener.freebusinessapps.com" target="_blank">
                            <div id="img-logo"
                                title="Url Shortener for Google Chrome™"></div> 
                        </a>

                    </span>
                    <div class="mdl-layout-spacer" width="125px"></div>
                    &nbsp;&nbsp;
                    <span class="mdl-chip" style="width:111px;">
                        <label id="mdl-switch-1" class="mdl-switch mdl-js-switch mdl-js-ripple-effect" for="switch-1">
                            <input type="checkbox" id="switch-1" class="mdl-switch__input">
                            <span id="switch-1-lbl" class="typo-styles__demo mdl-typography--title mdl-switch__label" data-i18n="msg_1">
                                Day
                            </span>
                        </label>      
                    </span>
                </div>
            </header>
            <main id="main-content" class="mdl-layout__content">
                <section class="mdl-layout__tab-panel is-active" id="scroll-tab-1">
                    <div class="page-content">
                        <div class="mdl-typography--title note-area" data-i18n="msg_4">
                            Please notice, you can copy&paste any url in this textbox.
                        </div>
                        <div class="source-url">
                            <div class="mdl-textfield mdl-js-textfield" style="width:100%">
                                <textarea class="mdl-textfield__input" type="text" rows= "3" id="source-url" ></textarea>
                                <label class="mdl-textfield__label" for="source-url" data-i18n="msg_5">
                                    PASTE LONG URL
                                </label>
                           </div>
                        </div>
                        <div class="main-url">
                            <div class="mdl-textfield mdl-js-textfield">
                                <input class="mdl-textfield__input" id="main-link" type="text" data-ctarget="#link-copy" readonly value="loading...">
                                <a href="#" id="link-copy" class="mdl-textfield__label__icon" title="Copy to clipboard">
                                    <img id="file-copy" src="/data/images/file_copy-yellow-18dp.svg" data-ctarget="#link-copy">
                                    
                                </a>
                            </div>                        
                        </div>     
                        <div class="qu_code">
                            <img class="qr_code_img" src="/data/assets/qr_code.png" height="200" alt="">
                            <img class="waiting" alt="">
                        </div>
                    </div>
            
                </section>
            </main>
                            
        </div>
        
    </div>
    <div class="preview">
        <div class="mdl-card__actions">
            <a href='#' target='_blank' class="teaser">
                <div style="text-align: center;">
                  <span data-i18n="msg_6">Please Rate Us!</span>
                  <br>
                  <span class="five-stars">⭑⭑⭑⭑⭑</span>
                </div>
              </a>
        </div>
    </div>


<script src="/data/libs/jquery.js"></script>
<script src="/data/mdl/material.min.js"></script>
<script src="/data/libs/Localize.js"></script>
<script src="/data/js/popup.js"></script>
<script src="/data/js/rate.js"></script>

</body>
</html>
