<!-- Reference template. Runtime rendering lives in renderer/js/presentation.js. -->
<section class="detail-section section--hero" data-section-id="{{id}}">
  <nav class="hero-nav">BRUME / FORMULA 01</nav>
  <header class="hero-copy">
    <p class="section-eyebrow">{{eyebrow}}</p>
    <h1 class="hero-title">{{heading}}</h1>
    <p class="section-body">{{body}}</p>
  </header>
  <figure class="media-frame hero-media"><img src="{{media.src}}" alt="{{media.alt}}"></figure>
  <div class="hero-offer">{{productName}} / {{price}} / {{ctaLabel}}</div>
</section>
