<!-- Reference template. Runtime rendering lives in renderer/js/presentation.js. -->
<section class="detail-section section--cta" data-section-id="{{id}}">
  <header class="section-lead">{{heading}} / {{body}}</header>
  <div class="cta-product">
    <img src="{{media.src}}" alt="{{media.alt}}">
    <div>{{productName}} / {{price}} / {{ctaLabel}}</div>
  </div>
  <p class="micro-note">{{legal}}</p>
</section>
