                - textbox "이곳에 피드백을 입력하세요." [ref=f23e101]: 강민경 학생은 DAMORI(다모리)의 기록·아카이브 앱을 대상으로 서비스 기획 PDF 23쪽과 Markdown 원본을 제출했습니다. 두 파일을 함께 확인한 결과, PDF에서 비어 있던 대표 사용자 프로필, 기본·성능·매력 요구 분류, 관찰 대상·범위, 문제 우선순위와 재확인 기록이 Markdown에는 작성되어 있었습니다. 이 내용도 평가에 반영했습니다. 서비스가 해결하려는 문제와 브랜드 방향, 사용자 여정, AI 제안을 판단하고 기획을 수정한 과정이 구체적으로 드러나는 결과물입니다. 서비스 설명에서는 일정·필기·사진·메모가 여러 앱에 흩어져 다시 찾기 어렵다는 문제를 분명하게 제시했습니다. 태블릿에서는 집중해서 작성하고 이동 중에는 모바일로 확인한다는 이용 상황을 기록책·날짜·Archive 구조와 연결한 점이 적절합니다. ‘기록을 내 방식대로, 삶을 나답게’라는 브랜드 가치도 기록책 중심 홈과 수정 가능한 기본 템플릿으로 이어집니다. 핵심 기능과 커뮤니티·스토어 같은 이후 확장 기능을 구분하고 외부 연동 가능성이 아직 확인되지 않았다고 밝힌 점도 서비스의 현재 범위를 이해하는 데 도움이 됩니다. 사용자 경험에서는 이용 전·중·후의 행동과 감정, 가입 과정의 부담, 저장·동기화에 대한 불안, 기록을 쉬었다가 돌아올 때의 압박을 살펴본 점이 좋습니다. 이를 짧은 진입 흐름, 편집 기능의 단계적 노출, 최근 기록과 이어쓰기 지원으로 연결해 기능적·감성적 경험을 기획에 반영했습니다. 다만 사회적 경험을 어떤 방식으로 다룰지는 더 설명할 수 있습니다. 커뮤니티 기능을 추가하기보다, 예를 들어 공동 학습 공간에서 개인 기록이 보이지 않기를 원하는 상황이나 기록을 다른 사람에게 보여줄 때의 선택권처럼 이 서비스에 맞는 관계·상황을 검토하고, 왜 해당 전략이 필요한지 적어 보세요. 사용자 분류에서는 대학생·취업준비생, 직장인·가끔 기록하는 사용자, 비사용자와 운영자를 나누고 생활 상황·동기·요구 차이를 함께 적었습니다. Markdown의 대표 사용자 프로필도 목표와 이탈 기준을 이해하는 데 도움이 됩니다. 다만 ‘집중 작성 빈도’와 ‘빠른 확인 필요성’처럼 유형을 가르는 기준을 명시하고, 왜 대학생·취업준비생의 상황을 먼저 해결하는지 보조 사용자와 비교해 한 문장 더 설명하면 우선 대상이 명확해집니다. 조사 근거에서는 Goodnotes와 다욜의 출처, 확인한 기능과 본인의 사용 경험을 제시하고 DAMORI에 적용할 점을 구분했습니다. 두 서비스의 장점을 조합하는 데서 그치지 않고 쉬운 시작과 편집 자유도 사이의 긴장을 발견한 점이 좋습니다. 그러나 이 자료들은 주로 앱 기능을 설명하므로, 20대 대학생·직장인의 생활방식·기기 이용·기록 동기를 뒷받침하는 자료는 아직 부족합니다. 실제로 확인한 사용자 관련 자료나 기존 프로젝트의 조사 기록에서 자료명·위치·확인 내용을 적고, 그 내용이 어떤 특성에 해당하는지 연결해 주세요. 지금처럼 가설임을 표시하는 태도는 유지하면 됩니다. 자료에서 요구를 도출하는 과정에서는 다욜의 직관적인 흐름을 쉬운 기록 시작으로, 고정된 속지에서 느낀 불편을 수정 가능한 레이아웃으로 연결한 부분을 확인했습니다. 다음에는 요구마다 ‘자료에서 확인한 내용 → 본인의 해석 → 예상 요구’를 짧게 나누면 설득력이 높아집니다. 특히 앱 소개에서 확인한 사실과 본인이 사용하며 느낀 불편을 구분하고, 개인 경험을 다른 사용자에게 적용한 부분은 가설로 남겨 주세요. 기본·성능·매력 요구 분류는 Markdown에 실제로 작성되어 있습니다. 기록 저장·보호를 기본 요구로, 속도·검색·동기화의 편의성을 성능 요구로 나눈 점은 적절합니다. 다만 Page Builder를 주요 사용자가 명시적으로 원하는 기능으로 설명하면서 매력 요구로 분류한 이유는 보완이 필요합니다. 어떤 사용자에게는 꼭 필요한 조건이고 어떤 사용자에게는 예상하지 못한 추가 가치인지 구분한 뒤, 그에 따라 먼저 제공할 기능을 정해 보세요. 분류 명칭보다 자신의 사용자에게 적용한 이유가 중요합니다. 관찰 설계에서는 기록책 생성, 템플릿 편집, 다른 기기에서 기록 찾기라는 세 과업과 예상 문제를 구체적으로 제시했습니다. Markdown에 대상, 학습 공간, 태블릿·모바일 사용, 약 15~20분의 범위, 기록할 행동과 제외할 내용을 보완한 점도 인정했습니다. 다만 ‘큰 도움 없이 수행’이라는 기준은 검토자마다 다르게 판단할 수 있습니다. 예를 들어 추가 설명 없이 진입점을 찾았는지, 편집 후 기록 모드로 돌아왔는지, 잘못 선택했을 때 스스로 복구했는지처럼 관찰 가능한 조건으로 정리해 주세요. 실제 조사로 이어갈 때 사용할 기록의 익명화·보관·삭제 방법도 짧게 정해 두면 계획을 실행하기 쉬워집니다. 서비스 디자인 요소는 사용자 요구와 여정에 맞춰 화면, 기기 역할, 안내, 시간, 개인정보와 회복 과정을 폭넓게 살폈습니다. 특히 기록책 중심 Home, 기본 템플릿과 추가 편집의 구분, 상태 안내를 선정한 이유가 잘 드러납니다. 이후에는 ‘동기화가 안 될 때 어디에서 상태를 확인하고 어떤 순서로 다시 시도하는지’와 같이 중요한 실패 상황 한 가지의 안내·도움 경로를 설명해 주세요. 코드를 구현할 필요 없이 사용자가 읽을 문구와 다음 행동을 문서로 정리하면 됩니다. 잠재 요구는 가장 우선해서 보완할 부분입니다. 현재 ‘기기와 파일이 달라도 이어지고 다시 찾기 쉬웠으면 한다’는 항목에는 명시적 요구와 잠재 요구가 섞여 있고, 자동 분류·다시 찾기 같은 기능 표현이 중심입니다. 여정에 적은 저장 불안이나 시나리오의 반복 탐색을 출발점으로, 그 행동 뒤에 어떤 요구가 있을지 해석해 보세요. 예를 들어 ‘기록을 잃지 않았다는 확신이 필요한가’와 ‘단지 메뉴 위치를 몰라 헤매는가’는 서로 다른 가설입니다. 두 해석 중 무엇에 가까운지 구별할 후속 질문을 적으면 개선 방향도 달라집니다. 이 예시는 추가로 검토할 가설이며 실제 사용자 반응으로 기록하면 안 됩니다. AI 제안에서는 메인을 기록책 중심으로 정리하고, 완전 자유 편집 대신 기본 틀을 유지하며, 기기별 역할과 확장 기능을 나눈 이유가 분명합니다. 수정 전·후가 세 건으로 기록되고 본문 기획에도 반영되어, 제안을 그대로 옮기지 않고 선택·조정한 과정을 확인할 수 있습니다. Markdown의 재확인 표에는 확인 조건과 미확인 상태, 다음 조치가 있으며 문서 구조를 수정했다는 기록도 있습니다. 다음에는 실제 사용자 테스트 계획과 별도로, 수정한 문서 자체를 점검한 결과를 적어 주세요. 예를 들어 ‘서비스 설명과 이용 과정에서 기록책 선택이 먼저 나오는지 두 위치를 대조했고 표현이 일치했다’처럼 확인 위치·관찰 내용·판정을 남기면 됩니다. 기능을 줄이며 생길 수 있는 발견의 어려움 등 부작용도 같은 방식으로 확인할 수 있습니다. PDF는 한글과 표를 읽을 수 있지만, 8쪽 대표 프로필, 9쪽 요구 분류, 11~12쪽 관찰 범위, 16~18쪽 일부 기획·문제 기록, 21쪽 재확인과 23쪽 최종 정리에는 Markdown과 달리 빈 부분이 남아 있습니다. 최종 내용을 한 원본에 모은 뒤 PDF로 다시 출력하고 두 파일의 해당 절을 대조해 주세요. 긴 표는 핵심 문장을 줄이거나 나누어 배치하고, 불필요한 작성 안내와 빈 양식을 정리하면 처음 읽는 사람이 기획의 흐름을 더 쉽게 따라갈 수 있습니다. Markdown에서 확인한 내용을 다시 누락으로 감점하지는 않았습니다. 전체적으로 서비스의 문제 정의, 브랜드와 이용 흐름의 연결, 경쟁 서비스에서 얻은 시사점과 AI 제안을 판단한 과정이 강점입니다. 사용자 특성의 조사 근거와 잠재 요구의 해석, 수정 문서의 재확인 기록은 더 보완할 여지가 있어 최종점수는 90점으로 산정했습니다. 먼저 사용자 특성마다 확인한 자료를 연결하고, 잠재 요구 한 건을 ‘행동 단서 → 해석과 대안 → 확인 질문 → 개선 내용’으로 정리해 보세요. 그다음 정리한 내용을 PDF에도 동일하게 반영하면 제안서의 설득력과 완성도를 높일 수 있습니다. 고생하셨습니다^^
