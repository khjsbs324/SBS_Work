              - 'cell "수강생 수준 : 중상 수업 의지 : 상중 수업 태도 : 상중 라포 형성 : 상하 기존 상담에서는 하루에 여러 내용을 동시에 다루면서 현재 어느 단계인지 헷갈리고, 브랜딩 작업과 코딩 작업을 전환할 때 학습 흐름을 놓치거나 복습 시 알고 있는 부분과 부족한 부분을 구분하는 데 어려움이 있다고 했으나, 현재는 DAMORI 프로젝트를 진행하며 스타일가이드와 웹 화면의 관계를 스스로 정리하고 제목·본문 위계, 카드 간격, 정보구조, Analog·Digital 구분과 선택 상태를 초안보다 구체적으로 개선하는 등 작업의 흐름을 이해하고 수정 근거를 설명하는 부분이 많이 좋아졌음. 특히 문제가 생겼을 때 단순히 결과만 고치는 데 그치지 않고 오류 20개를 현상·원인·수정 방법·기대 결과로 나누어 확인하며 반응형 화면과 접근성까지 점검한 점에서 문제 해결 태도와 제작 완성도가 향상된 모습이 확인됨. 다만 면담 과정에서 결과물 제작에는 집중도가 높지만 정기 모니터링, 작업 범위와 일정 조율, 사용자·클라이언트 피드백 정리, 사후리뷰, 산출물 인덱스와 백업·복구 기록처럼 작업 이후의 관리 문서를 빠뜨리는 경향이 있어 프로젝트 전체 과정을 체계적으로 마무리하는 습관은 보충이 필요하다고 안내함. 이에 강사는 완성된 화면만 확인하지 말고 제출 전 체크리스트를 만들어 필수 서식과 파일명, 최종 해시값을 순서대로 검토하도록 피드백했으며, 다음 작업부터는 피드백의 출처·우선순위·반영 또는 보류 사유를 기록하고 백업본을 실제로 복원해 본 결과까지 남기면서 제작과 사후관리를 함께 마무리하도록 지도함." [ref=f28e195]'
