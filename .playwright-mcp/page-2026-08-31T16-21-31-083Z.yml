              - 'cell "수강생 수준 : 중상 수업 의지 : 상중 수업 태도 : 중상 라포 형성 : 중상 기존 상담에서는 원리를 정확히 이해하지 못한 채 과제를 따라가는 느낌이 들고 코딩 응용이 느리며 디자인 방향도 맞는지 확신하기 어렵다고 했으나, 현재는 네 명의 사용자 유형과 여러 의견을 중요도, 영향, 사용 흐름과 개선 일정으로 연결하고 검색, 찜, 알림, 리뷰 화면과 문의 기능을 실제로 구현하는 등 사용자 근거를 바탕으로 문제를 분석하고 기능으로 보완하는 부분이 많이 좋아졌음. 면담에서 작업 과정을 함께 확인하며 예전보다 큰 문제를 작은 단위로 나누고 레퍼런스와 AI를 활용해 해결 방향을 설명하는 힘이 생긴 점을 긍정적으로 피드백했고, 이에 수강생 수준을 이전보다 향상된 중상으로 판단함. 다만 모바일 화면이 고정 폭으로 남아 잘리는 부분과 실제 결과를 정상으로 기록한 부분이 있어 최종 검수의 정확성과 버전 정리는 보충이 필요함. 이에 강사는 고정 폭과 최소 너비를 제거한 뒤 모바일 한 열 구조로 다시 배치하고 화면 너비를 수치로 비교해 확인하도록 안내했으며, 다음 작업부터는 문서와 최종 파일명을 일치시키고 작업 범위 조율, 의견 반영, 사후리뷰, 내부 공유, 산출물 인덱스와 백업·복구 기록까지 이어서 진행하도록 지도함." [ref=f54e195]'
