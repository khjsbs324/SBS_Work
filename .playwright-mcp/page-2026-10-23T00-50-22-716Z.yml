                      - paragraph [ref=f17e332]: "- 9~10점: 프로젝트 목적에 필요한 데이터와 다양한 레퍼런스를 출처·이용 조건과 함께 체계적으로 수집하고 공통 기준으로 장단점과 적용 판단을 도출했다."
                      - paragraph [ref=f17e333]: "- 6~8점: 필요한 자료와 장단점 분석은 있으나 일부 출처, 권리 상태, 비교 기준 또는 적용 판단이 부족하다."
                      - paragraph [ref=f17e334]: "- 3~5점: 자료를 모았지만 프로젝트 연결과 비교 기준이 약하고 장단점이 일반적인 인상에 머문다."
                      - paragraph [ref=f17e335]: "- 0~2점: 기초데이터·레퍼런스 수집 또는 장단점 분석을 확인하기 어렵다."
                      - paragraph [ref=f17e336]
                      - paragraph [ref=f17e337]: 02. 디자인 기획 기반 스케치 — 10점
                      - paragraph [ref=f17e338]: "- 9~10점: 디자인 기획의 사용자·목표·콘셉트·정보 우선순위를 각 스케치의 화면 목적과 구성으로 일관되게 전환했다."
                      - paragraph [ref=f17e339]: "- 6~8점: 기획과 스케치의 전반적 연결은 타당하지만 일부 화면 목적·콘텐츠 위계 또는 선택 근거가 부족하다."
                      - paragraph [ref=f17e340]: "- 3~5점: 스케치는 있으나 기획 결과와 연결이 약하거나 화면 구성이 취향 중심이다."
                      - paragraph [ref=f17e341]: "- 0~2점: 디자인 기획을 바탕으로 한 스케치를 확인할 수 없다."
                      - paragraph [ref=f17e342]
                      - paragraph [ref=f17e343]: 03. 스케치 결과의 구현 가능성 설명 — 10점
                      - paragraph [ref=f17e344]: "- 9~10점: 모든 핵심 스케치에 화면·요소·기능·상태·전환과 제약을 명확히 주석 처리하여 다른 제작자가 구현 방향을 이해할 수 있다."
                      - paragraph [ref=f17e345]: "- 6~8점: 주요 기능과 전환 설명은 가능하지만 일부 상태, 콘텐츠 규칙, 제약 또는 미결정 사항이 빠졌다."
                      - paragraph [ref=f17e346]: "- 3~5점: 화면 설명은 있으나 요소의 동작과 연결이 모호하여 추가 질의 없이는 구현하기 어렵다."
                      - paragraph [ref=f17e347]: "- 0~2점: 스케치의 구현 가능성을 설명하는 주석이나 설명이 없다."
                      - paragraph [ref=f17e348]
                      - paragraph [ref=f17e349]: 04. 스토리보드와 인터렉션·모션 표현 — 10점
                      - paragraph [ref=f17e350]: "- 9~10점: 핵심 과업의 시작·진행·완료를 화면 순서로 구성하고 조작·전환·피드백·상태와 필요한 모션을 빠짐없이 표현했다."
                      - paragraph [ref=f17e351]: "- 6~8점: 전체 흐름과 주요 인터렉션은 이해되지만 일부 분기, 상태, 피드백 또는 모션 설명이 부족하다."
                      - paragraph [ref=f17e352]: "- 3~5점: 화면 나열은 있으나 전환 조건과 상호작용 결과가 모호하거나 흐름이 일부 끊긴다."
