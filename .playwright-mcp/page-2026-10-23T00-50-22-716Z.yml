                      - paragraph [ref=f17e253]:
                        - strong [ref=f17e254]: 평가 조건
                      - paragraph [ref=f17e255]: "- 평가 방식: 개인 포트폴리오"
                      - paragraph [ref=f17e256]: "- 입력자료: 강사 제공 또는 이전 단계에서 확정한 서비스 브리프"
