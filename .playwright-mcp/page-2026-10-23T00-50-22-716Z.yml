                      - paragraph [ref=f17e251]: 서비스 브리프를 바탕으로 프로토타입 제작에 필요한 기초데이터와 레퍼런스를 수집·분석합니다. 핵심 과업을 스토리보드로 구성하고 여러 썸네일 스케치에서 대안을 비교한 뒤 저충실도 시안으로 구체화합니다. 간단한 사용성 점검으로 문제를 찾아 스케치를 수정하고, 다음 제작자가 이해할 수 있도록 결과를 정리합니다.
