                      - paragraph [ref=f17e261]: "1. `이름_프로토타입_기초데이터_스케치.pdf`"
                      - paragraph [ref=f17e262]: 2. 편집 가능한 디자인·스토리보드 원본 또는 평가자가 열 수 있는 공유 링크
                      - paragraph [ref=f17e263]
                      - paragraph [ref=f17e264]: 보고서에는 기초데이터와 출처, 레퍼런스 비교, 스토리보드, 다안 스케치, 저충실도 시안, 사용성 점검과 수정 전후가 모두 포함되어야 합니다. 손 스케치는 화면 번호와 내용이 선명한 스캔·사진으로 제출할 수 있습니다.
                      - paragraph [ref=f17e265]
                      - paragraph [ref=f17e266]:
                        - strong [ref=f17e267]: 작업 순서
                      - paragraph [ref=f17e268]: 1. 브리프에서 사용자, 문제, 목표, 콘셉트, 핵심 기능과 대상 매체를 정리합니다.
                      - paragraph [ref=f17e269]: 2. 필요한 텍스트·이미지·영상·음성·통계 등의 기초데이터를 정의합니다.
                      - paragraph [ref=f17e270]: 3. 자료마다 출처, 확인일, 제작자, 이용 조건 또는 권리 상태와 사용 목적을 기록합니다.
                      - paragraph [ref=f17e271]: 4. 유사 서비스와 다른 분야의 레퍼런스를 같은 기준으로 비교합니다.
                      - paragraph [ref=f17e272]: 5. 장점·단점과 우리 프로젝트에 적용·변형·제외할 원리를 결정합니다.
                      - paragraph [ref=f17e273]: 6. 핵심 과업의 시작·진행·완료를 스토리보드로 구성합니다.
                      - paragraph [ref=f17e274]: 7. 화면별로 구조·위계·조작 방식이 다른 썸네일 대안을 만듭니다.
                      - paragraph [ref=f17e275]: 8. 비교 기준에 따라 대안을 선택·조합하고 저충실도 세부 시안을 제작합니다.
                      - paragraph [ref=f17e276]: 9. 화면 번호, 요소, 기능, 상태, 전환과 미결정 사항을 주석으로 설명합니다.
                      - paragraph [ref=f17e277]: 10. 동료 또는 강사가 지정한 점검자에게 핵심 과업을 수행하게 하고 관찰 사실을 기록합니다.
                      - paragraph [ref=f17e278]: 11. 사용성 문제의 영향과 우선순위를 정해 스케치를 수정하고 전후를 비교합니다.
                      - paragraph [ref=f17e279]: 12. 보고서·원본·링크 권한과 파일명을 최종 확인합니다.
