                      - paragraph [ref=f17e357]: "- 6~8점: 점검을 수행하고 기록했으나 일부 성공 조건, 진행 절차, 관찰 항목 또는 원자료가 부족하다."
                      - paragraph [ref=f17e358]: "- 3~5점: 의견을 받았지만 과업 기반 절차와 관찰 기준이 약해 방법론 적용을 판단하기 어렵다."
