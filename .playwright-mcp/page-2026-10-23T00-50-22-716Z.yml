                      - paragraph [ref=f17e363]: "- 6~8점: 주요 문제와 근거는 타당하지만 일부 사용성 기준, 영향 범위, 원인 또는 우선순위가 부족하다."
                      - paragraph [ref=f17e364]: "- 3~5점: 불편 의견을 나열했으나 관찰 근거와 문제 정의가 모호하거나 해결안과 혼재한다."
