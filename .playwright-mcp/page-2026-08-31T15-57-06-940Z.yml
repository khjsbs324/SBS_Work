              - cell "자차 15M 거리 자취 중. 약 1년 간 본원에서 일반과정 수업 웹 6까지 다 수강함. 코드 짜는 것이 처음이라 힘들어서 낯설고 어려웠는데 하다보니 익숙해진 상태임. 4년 동안 법학 전공을 하였고 법 관련 경험도 많이 했으나 적성에 안 맞다는 생각이 들었고 학생회 일을 하면서 디자인했던 경험이 좋았어서 본원에 왔던 것임. 취업은 빨리 할 수 있을만큼의 실력이 있었으면 좋겠고 얼만큼 얻어가는지가 중요할 것 같다는 생각이 듦. 그러나 조기취업을 생각하고 있는만큼 취업은 하고 싶고 올해 안에 취업하는 것을 목표로 잡아둠. 취업 희망 지역은 대전에 계속 살아서 대전을 희망하고 있고 바라는 회사라면 타지도 고려는 해볼 예정임. 지각 관련해서 현재 쉬는 날에도 6시에 일어나는 계획을 세워놨고 잘 실천 중이라 지각할 일은 없을 것 같음. 졸업하고 사무직으로 2년 일한 적이 있어 생계는 큰 문제가 없고 오직 이 과정에만 몰두할 생각임." [ref=f22e195]
