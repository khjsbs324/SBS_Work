              - 'cell "수강생 수준 : 중상 수업 의지 : 상중 수업 태도 : 상중 라포 형성 : 상중 기존 상담에서는 영어 타자 속도와 수업 진행 속도에 부담을 느끼고 프레임, Auto Layout과 Flex 개념이 부족해 다른 학생보다 느리다고 생각하는 경향이 있었으며, 이후에도 코딩은 정해진 공식을 상황에 맞게 적용해야 하는 것처럼 느껴 어렵다고 했으나, 현재는 디자인과 리서치 강점을 바탕으로 실제 웹 화면에서 리추얼 탭, 성적서 화면, 상품 필터, 장바구니와 이미지 확대 기능을 구현하고 모바일 화면까지 구성하는 부분이 많이 좋아졌음. 면담에서 작업물을 함께 확인하며 예전보다 기능의 목적과 사용 흐름을 이해하고 결과물로 연결하는 힘이 생긴 점을 긍정적으로 피드백함. 다만 태블릿 크기에서는 메뉴가 겹치고 일부 이미지가 외부 주소에 의존하며 실제 결과와 재검증 기록이 다른 부분이 있어 화면별 확인과 제출 자료의 완결성은 보충이 필요함. 이에 강사는 사용 이미지를 로컬 파일로 정리하고 태블릿 구간에서 메뉴를 축약하거나 모바일 메뉴로 전환하도록 안내했으며, 다음 작업부터는 화면 크기별 검증 결과와 요청별 반영 여부, 사후리뷰, 산출물 인덱스와 백업·복구 기록을 실제 결과에 맞게 작성하면서 진행하도록 지도함." [ref=f62e195]'
