              - 'cell "박찬미(*2026. 06. 10 기준) 수강생 수준 : 중상 수업 의지 : 상중 수업 태도 : 상중 라포 형성 : 상하 면담 내용 전반적으로 수업 시간과 학습 환경에 매우 잘 적응하고 있으며 과정에 대한 흥미도 안정적으로 유지되고 있음. 초반과 비교했을 때 VS Code 사용과 Figma 활용이 이전보다 자유로워졌으며, 과제나 실습도 스스로 해결하려고 노력하는 태도가 좋음. Figma 기본 개념과 Auto Layout 적용은 잘 이해하고 있으나 Fixed, Hug contents, Fill container의 사용 상황은 아직 확실하게 정리되지 않은 부분이 있어 반복적인 예제 연습이 필요함. 현재 가장 어려움을 느끼는 부분은 코딩이므로 원하는 결과물을 만들기 위해 어떤 코드를 사용해야 하는지 판단하는 과정에서 지도가 필요함." [ref=f42e213]'
