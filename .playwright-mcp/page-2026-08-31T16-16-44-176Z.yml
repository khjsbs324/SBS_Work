              - 'cell "수강생 수준 : 중상 수업 의지 : 상하 수업 태도 : 상하 라포 형성 : 상하 기존 상담에서는 반응형 웹을 배우며 이전 개념과 새로운 내용이 섞여 혼란스럽고, 피그마 화면을 코드로 옮길 때 어떤 구조와 단위를 사용해야 하는지 감을 잡기 어렵다고 했으나, 현재는 화면의 문제를 헤더와 CTA, 모바일 상품 목록, 카드 정보 위계, 장바구니 동선으로 구분하고 각 원인과 수정 방법을 연결해 필터, 상세 화면, 장바구니 기능과 모바일 사용 흐름을 개선하는 부분이 많이 좋아졌음. 작업물을 함께 확인하면서 예전보다 문제를 작은 단위로 나누어 해결하고 결과를 기능으로 연결하는 힘이 생긴 점을 긍정적으로 피드백함. 다만 기획 문서와 리서치 적용 근거, 수정 전후의 테스트 기록이 충분하지 않고 작은 모바일 화면의 가로 넘침 여부를 끝까지 확인하는 습관은 보충이 필요해, 이에 강사는 질문하기 어려운 부분도 화면과 오류 상황을 캡처해 구체적으로 설명해 보도록 안내했으며, 다음 작업부터는 320px을 포함한 동일 조건의 전후 화면과 테스트 결과를 남기고 작업 범위, 의견의 우선순위, 승인 여부, 버전별 변경 내용과 복구 결과를 정리한 뒤 제출 링크와 파일 경로까지 최종 확인하도록 지도함." [ref=f38e195]'
