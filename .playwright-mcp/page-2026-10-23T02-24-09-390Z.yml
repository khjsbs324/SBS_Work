            - cell [ref=f9e208]:
              - textbox [ref=f9e209]: "*평가결과 분석내용 회의 참석자 : 김봉섭 부원장, 김혜지 강사, 김지수 사원 1. 주제 : ‘시각디자인 리서치 조사’ 평가결과에 대한 분석 및 의견 2. 목적 : ‘시각디자인 리서치 조사’ 평가결과에서 부족한 부분과 잘 되는 부분을 확인하여 앞으로 수업하는 데 활용하기 위함. 3. 결과 : A등급 : [해당 없음] B등급 : [이은수, 강민경, 이지희, 김정은, 김지선, 임연우, 박찬미, 이은경, 박주연, 최지혜, 허지민] C등급 : [해당 없음] F등급 : [해당 없음] * 능력단위요소 ‘디자인 조사 계획하기’에 대한 이해도 부족 : [김정은, 김지선, 임연우, 박찬미, 이은경, 박주연, 최지혜, 허지민] - 조치사항 : 디자인 조사 목적에 맞는 조사 방향 설정, 조사 대상자 선정 기준, 정성·정량 조사 방법의 차이를 다시 확인할 수 있도록 조사 계획서 예시 자료를 제공함. / 프로젝트 주제에 맞는 조사 목적, 대상자 조건, 조사 방법을 구체적으로 작성하는 보충 과제를 추가 제시함. / 보충 과제 제출 후 개별 피드백을 통해 조사 계획의 논리성과 대상자 선정 근거가 적절한지 확인하고 수정 방향을 안내함. * 능력단위요소 ‘디자인 조사 실시하기’에 대한 이해도 부족 : [이지희, 김정은, 김지선, 임연우, 박찬미, 이은경, 박주연, 최지혜, 허지민] - 조치사항 : 설문 문항 구성, 인터뷰 질문 작성, 리서치 대상자 섭외 방법, 조사 진행 시 유의사항을 정리한 실습 가이드를 제공함. / 실제 조사 상황을 가정하여 설문지 또는 인터뷰 가이드라인을 작성하는 과제를 추가 제시함. / 수업 시간 내 개별 점검을 통해 질문 내용이 조사 목적과 연결되는지 확인하고, 중복되거나 모호한 문항은 수정할 수 있도록 피드백함. * 능력단위요소 ‘디자인 조사 결과 정리’에 대한 이해도 부족 : [이은수, 강민경, 이지희, 김정은, 김지선, 임연우, 박찬미, 이은경, 박주연, 최지혜, 허지민] - 조치사항 : 수집한 자료를 카테고리별로 분류하고 핵심 내용을 요약하는 방법, 조사 결과를 표·도표·키워드로 정리하는 방법을 안내함. / 조사 결과를 어피니티 다이어그램 또는 그룹핑 방식으로 정리하고, 주요 인사이트를 도출하는 보완 과제를 제시함. / 보완 완료 후 결과물을 다시 확인하여 단순 자료 나열에 그치지 않고 디자인 방향으로 연결되는 분석이 이루어졌는지 개별 피드백을 진행함. F등급 : [해당 없음] * 조치사항 : 해당 인원 없음. 다만 전체 학습자가 B등급에 분포되어 있어 A등급 수준의 결과물로 향상될 수 있도록 우수 리서치 조사 사례와 결과 정리 예시를 추가로 공유함. / 조사 계획, 조사 실시, 결과 정리 단계별 체크리스트를 제공하여 학습자가 스스로 부족한 부분을 점검할 수 있도록 지도함. 4. 종합 의견 : 전체적으로 모든 학습자가 B등급을 기록하여 시각디자인 리서치 조사의 기본 수행 기준은 충족한 것으로 확인됨. 이은수와 강민경은 상대적으로 높은 점수를 기록하여 조사 계획 수립과 기본 자료 정리 능력이 양호하였으나, A등급 수준으로 향상되기 위해서는 조사 결과를 디자인 방향과 연결하는 인사이트 도출 과정의 보완이 필요함. 이지희, 김정은, 김지선, 임연우는 조사 수행은 이루어졌으나 조사 목적, 대상자 선정 근거, 질문 구성의 구체성이 다소 부족함. 박찬미, 이은경, 박주연, 최지혜, 허지민은 최소 수행 기준은 충족하였으나 조사 결과 정리 방식과 분석 내용의 깊이에서 추가 지도가 필요함. 차후 수업에서는 단순 자료 수집을 넘어 조사 결과를 해석하고 디자인 방향으로 연결하는 훈련을 강화할 예정임. *개선사항 1. 건의사항 : 예시 : “조사 목적에 맞는 대상자를 어떻게 선정해야 하는지 더 구체적으로 알고 싶습니다.” / “설문 문항이나 인터뷰 질문을 작성할 때 어떤 기준으로 구성해야 하는지 어렵습니다.” / “수집한 자료를 단순히 정리하는 것에서 끝나지 않고 디자인 인사이트로 연결하는 방법을 더 배우고 싶습니다.”"
