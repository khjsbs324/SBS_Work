                    - rowgroup [ref=f26e200]:
                      - row [ref=f26e201]:
                        - cell "내용" [ref=f26e202]
                        - cell [ref=f26e203]:
                          - paragraph [ref=f26e204]: 초안으로 제작한 서비스 기획을 형식에 맞춰 검증 후 최고의 기획안을 완성해 주세요.
