                          - paragraph [ref=f26e211]: 서비스 기획_이름.md
                        - cell [ref=f26e212]
                      - row [ref=f26e213]:
                        - cell "채점기준" [ref=f26e214]
                        - cell [ref=f26e215]:
                          - paragraph [ref=f26e216]:
                            - strong [ref=f26e218]: 01.서비스 환경과 사용자 요구조건 예측 — 8점
                          - paragraph [ref=f26e219]: "- 원문: 서비스 환경에 대한 사용자의 요구조건을 예측할 수 있다."
                          - paragraph [ref=f26e220]: "- 원본: PDF 38쪽 / 인쇄 26쪽"
                          - paragraph [ref=f26e221]: "- 증빙: 서비스 상세 설명, 사용자 유형, 요구 기록의 상황·문제·근거 표시."
                          - paragraph [ref=f26e222]: "- 판단 범위: 요구를 예측한 상황과 논리. 이론 분류는 SO-07, 수집 자료와의 추적은 SO-08에서 본다."
                          - paragraph [ref=f26e223]: "- 7~8점: 대상·장소·이용 상황·제약을 구체화하고 기능적·감성적 요구를 서비스 문제와 연결하며 확인된 내용과 예상 요구를 구분했다."
                          - paragraph [ref=f26e224]: "- 5~6점: 주요 상황과 요구가 연결되지만 이용 제약 또는 요구를 예상한 이유가 일부 부족하다."
                          - paragraph [ref=f26e225]: "- 3~4점: 사용자와 요구를 적었으나 일반적인 편리함·만족 위주이고 서비스 환경과의 연결이 약하다."
                          - paragraph [ref=f26e226]: "- 0~2점: 대상 또는 이용 상황이 불명확하고 요구 예측의 근거를 확인하기 어렵다."
                          - paragraph [ref=f26e227]
                          - paragraph [ref=f26e228]:
                            - strong [ref=f26e230]: 02.사용자 경험요소의 디자인 전략 적용 — 8점
                          - paragraph [ref=f26e231]: "- 원문: 사용자의 경험요소들의 파악을 통해 디자인 전략으로 적용할 수 있다."
                          - paragraph [ref=f26e232]: "- 원본: PDF 38쪽 / 인쇄 26쪽"
                          - paragraph [ref=f26e233]: "- 증빙: 이용 전·중·후 여정, 기능적·감성적·사회적 경험, 브랜드 연결과 디자인 전략."
                          - paragraph [ref=f26e234]: "- 판단 범위: 경험에서 전략으로 이어지는 연결. 개별 디자인 요소 선정은 SO-10에서 본다."
                          - paragraph [ref=f26e235]: "- 7~8점: 여정의 행동·감정·상호작용을 기능적·감성적·사회적 경험으로 해석하고 브랜드 의도와 연결된 실행 가능한 디자인 전략을 제시했다."
                          - paragraph [ref=f26e236]: "- 5~6점: 주요 경험과 전략은 연결되지만 일부 경험 관점 또는 전략의 적용 방식이 구체적이지 않다."
                          - paragraph [ref=f26e237]: "- 3~4점: 경험과 전략이 모두 있으나 연결 이유가 약하거나 색상·기능 나열에 머문다."
                          - paragraph [ref=f26e238]: "- 0~2점: 경험 분석 또는 디자인 전략이 없거나 사용자 경험과 무관한 취향만 제시했다."
                          - paragraph [ref=f26e239]
                          - paragraph [ref=f26e240]:
                            - strong [ref=f26e242]: 03.사용자 특성 자료 조사 — 8점
                          - paragraph [ref=f26e243]: "- 원문: 사용자 라이프스타일, 인구학적 특성, 소비심리학적 특성을 조사할 수 있다."
                          - paragraph [ref=f26e244]: "- 원본: PDF 38쪽 / 인쇄 26쪽"
                          - paragraph [ref=f26e245]: "- 증빙: 사용자 특성 기록, 출처 자료, 자료에서 확인한 내용과 적용 범위."
                          - paragraph [ref=f26e246]: "- 판단 범위: 세 가지 특성의 조사 내용과 출처. 유형 분류의 논리는 SO-04에서 본다."
                          - paragraph [ref=f26e247]: "- 7~8점: 라이프스타일·인구학적·소비심리학적 특성을 출처가 있는 자료 또는 기존 프로젝트의 확인 가능한 자료에 연결하고 조사 내용·해석·가설의 범위를 구분했다."
                          - paragraph [ref=f26e248]: "- 5~6점: 세 관점의 특성과 자료가 있으나 일부 특성의 출처 또는 자료를 자신의 사용자에게 적용한 이유가 부족하다."
                          - paragraph [ref=f26e249]: "- 3~4점: 일부 특성만 조사했거나 대부분 가상 설정으로 작성하여 실제 자료와의 연결이 제한적이다."
                          - paragraph [ref=f26e250]: "- 0~2점: 자료 조사 없이 사용자 특성을 임의 설정했거나 확인 가능한 조사 내용이 거의 없다."
                          - paragraph [ref=f26e251]
                          - paragraph [ref=f26e252]:
                            - strong [ref=f26e254]: 04.특성 요인에 따른 사용자 유형 분류 — 8점
                          - paragraph [ref=f26e255]: "- 원문: 조사된 특성 요인들을 중심으로 사용자 유형을 분류할 수 있다."
                          - paragraph [ref=f26e256]: "- 원본: PDF 38쪽 / 인쇄 26쪽"
                          - paragraph [ref=f26e257]: "- 증빙: 사용자 유형 비교, 분류 기준, 유형별 특성과 요구 차이."
                          - paragraph [ref=f26e258]: "- 판단 범위: 분류 기준의 일관성과 설명력. SO-03에서 처리한 동일 자료 출처 누락을 반복 감점하지 않는다."
                          - paragraph [ref=f26e259]: "- 7~8점: 서로 구별되는 사용자 유형을 일관된 특성 요인으로 분류하고 유형별 이용 상황·동기·요구의 차이와 대표 사용자 선정 이유를 설명했다."
                          - paragraph [ref=f26e260]: "- 5~6점: 유형과 분류 기준은 구분되지만 일부 유형의 요구 차이 또는 대표 사용자 선택 이유가 부족하다."
                          - paragraph [ref=f26e261]: "- 3~4점: 유형을 나누었으나 연령·직업 라벨에 머물거나 분류 기준이 서로 겹친다."
                          - paragraph [ref=f26e262]: "- 0~2점: 유형 분류가 없거나 특성 요인과 무관한 임의 분류여서 서비스에 활용하기 어렵다."
                          - paragraph [ref=f26e263]
                          - paragraph [ref=f26e264]:
                            - strong [ref=f26e266]: 05.선행조사에 근거한 관찰조사 기획 — 10점
                          - paragraph [ref=f26e267]: "- 원문: 문헌조사 및 데스크 리서치를 통해 조사된 내용을 바탕으로 사용자 관찰을 구체적으로 기획할 수 있다."
                          - paragraph [ref=f26e268]: "- 원본: PDF 61쪽 / 인쇄 49쪽"
                          - paragraph [ref=f26e269]: "- 증빙: 출처 자료, 관찰 목적·질문·대상·과업·환경·방법·시간·기록 방식, 조사 한계와 동의 계획."
                          - paragraph [ref=f26e270]: "- 판단 범위: 실제로 실행 가능한 관찰 설계. 계획을 실제 현장 실행 결과로 인정하지 않는다."
                          - paragraph [ref=f26e271]: "- 9~10점: 선행자료에서 확인할 질문을 도출하고 대상·상황·과업·방법·시간·기록·판정 기준을 연결했으며 가상 검토의 한계와 실제 조사 시 동의·정보 처리 계획을 제시했다."
                          - paragraph [ref=f26e272]: "- 6~8점: 자료와 주요 조사 계획은 연결되지만 일부 관찰 행동, 기록 방식, 판단 기준 또는 조사 한계가 구체적이지 않다."
                          - paragraph [ref=f26e273]: "- 3~5점: 계획은 있으나 자료와 연결이 약하거나 대상·방법만 제시하여 다른 사람이 실행하기 어렵다."
                          - paragraph [ref=f26e274]: "- 0~2점: 선행조사에 근거한 관찰 계획이 없거나 무엇을 어떻게 확인할지 판단할 수 없다."
                          - paragraph [ref=f26e275]
                          - paragraph [ref=f26e276]:
                            - strong [ref=f26e278]: 06.기본 자료에 따른 서비스 개발 방향 정리 — 6점
                          - paragraph [ref=f26e279]: "- 원문: 기본 자료조사를 바탕으로 서비스 개발 방향을 조망하여 정리할 수 있다."
                          - paragraph [ref=f26e280]: "- 원본: PDF 61쪽 / 인쇄 49쪽"
                          - paragraph [ref=f26e281]: "- 증빙: 선행자료의 시사점, 개발 방향, 포함·제외 범위, 우선순위와 제약."
                          - paragraph [ref=f26e282]: "- 판단 범위: 자료가 시사하는 개발 방향과 범위. 경쟁사 대비 개념은 SO-09에서 본다."
                          - paragraph [ref=f26e283]: "- 6점: 기본 자료의 시사점을 서비스 개발 방향으로 연결하고 우선 적용 내용, 포함·제외 범위 및 현실적 제약을 이유와 함께 정리했다."
                          - paragraph [ref=f26e284]: "- 4~5점: 자료와 개발 방향이 연결되지만 우선순위, 범위 또는 제약을 선택한 이유가 부족하다."
                          - paragraph [ref=f26e285]: "- 2~3점: 개발 방향은 있으나 자료와의 연결이 약하거나 원하는 기능 목록에 머문다."
                          - paragraph [ref=f26e286]: "- 0~1점: 자료에서 도출한 개발 방향을 확인할 수 없거나 내용이 서로 모순된다."
                          - paragraph [ref=f26e287]
                          - paragraph [ref=f26e288]:
                            - strong [ref=f26e290]: 07.관련 이론을 적용한 사용자 요구 해석 — 8점
                          - paragraph [ref=f26e291]: "- 원문: 관련 이론을 바탕으로 사용자 요구사항을 파악할 수 있다."
                          - paragraph [ref=f26e292]: "- 원본: PDF 61쪽 / 인쇄 49쪽"
                          - paragraph [ref=f26e293]: "- 증빙: 카노 모델 등 선택한 이론·분석 틀, 요구별 적용과 분류 이유."
                          - paragraph [ref=f26e294]: "- 판단 범위: 이론을 실제 요구에 적용한 정확성. 이론 이름을 적었다는 사실만으로 충족하지 않는다."
                          - paragraph [ref=f26e295]: "- 7~8점: 선택한 이론의 기준을 설명하고 자신의 요구에 정확히 적용하여 분류·해석 이유 및 우선 판단을 제시했다. 가설에 적용한 결과는 검증 전 해석임을 표시했다."
                          - paragraph [ref=f26e296]: "- 5~6점: 이론과 요구의 연결이 적절하나 일부 분류 이유 또는 우선 판단 설명이 부족하다."
                          - paragraph [ref=f26e297]: "- 3~4점: 이론을 명명하거나 분류했지만 정의를 반복하고 서비스 요구에 적용한 이유가 약하다."
                          - paragraph [ref=f26e298]: "- 0~2점: 이론 적용이 없거나 핵심 개념을 잘못 적용하여 요구 해석의 타당성을 확인하기 어렵다."
                          - paragraph [ref=f26e299]
                          - paragraph [ref=f26e300]:
                            - strong [ref=f26e302]: 08.수집 자료에 근거한 사용자 요구 도출 — 8점
                          - paragraph [ref=f26e303]: "- 원문: 자료 수집을 바탕으로 사용자 요구를 파악할 수 있다."
                          - paragraph [ref=f26e304]: "- 원본: PDF 61쪽 / 인쇄 49쪽"
                          - paragraph [ref=f26e305]: "- 증빙: 자료 ID·출처·확인 내용, 요구 ID, 자료에서 요구로 이어지는 해석."
                          - paragraph [ref=f26e306]: "- 판단 범위: 수집한 자료와 요구의 추적성. SO-01의 상황 예측 또는 SO-07의 이론 판단과 구분한다."
                          - paragraph [ref=f26e307]: "- 7~8점: 출처 자료에서 실제 확인한 내용을 요구와 연결하고 사실·해석·추가 확인할 가설을 구별하며 자료의 적용 한계도 설명했다."
                          - paragraph [ref=f26e308]: "- 5~6점: 주요 요구는 수집 자료와 연결되지만 일부 요구의 근거 위치 또는 해석 범위가 불명확하다."
                          - paragraph [ref=f26e309]: "- 3~4점: 자료와 요구는 있으나 각각 나열되어 연결이 약하거나 AI 제안에 주로 의존한다."
                          - paragraph [ref=f26e310]: "- 0~2점: 수집 자료에서 요구를 도출한 증빙이 없거나 확인하지 않은 자료를 조사 사실로 단정했다."
                          - paragraph [ref=f26e311]
                          - paragraph [ref=f26e312]:
                            - strong [ref=f26e314]: 09.경쟁사 조사에 따른 서비스 디자인 개념 수립 — 8점
                          - paragraph [ref=f26e315]: "- 원문: 경쟁사 조사를 통해 서비스 디자인 개념을 수립할 수 있다."
                          - paragraph [ref=f26e316]: "- 원본: PDF 61쪽 / 인쇄 49쪽"
                          - paragraph [ref=f26e317]: "- 증빙: 경쟁·유사 서비스 출처와 비교, 고객·문제·혜택·제공 방식·차별점을 담은 서비스 개념."
                          - paragraph [ref=f26e318]: "- 판단 범위: 경쟁사 조사에서 개념으로 이어지는 논리. 서비스 개발 범위는 SO-06에서 본다."
                          - paragraph [ref=f26e319]: "- 7~8점: 경쟁·유사 서비스의 실제 제공 내용과 장단점을 출처에 근거해 비교하고 고객·혜택·제공 방식·차별 방향이 있는 자신의 서비스 개념을 도출했다."
                          - paragraph [ref=f26e320]: "- 5~6점: 경쟁사와 서비스 개념은 연결되지만 비교 항목 또는 차별 방향의 선택 이유가 부족하다."
                          - paragraph [ref=f26e321]: "- 3~4점: 경쟁사 소개와 서비스 아이디어는 있으나 비교 근거가 약하거나 경쟁사를 그대로 따라 한 내용에 머문다."
                          - paragraph [ref=f26e322]: "- 0~2점: 경쟁사 조사 근거가 없거나 조사와 무관한 서비스 개념만 제시했다."
                          - paragraph [ref=f26e323]
                          - paragraph [ref=f26e324]:
                            - strong [ref=f26e326]: 10.사용자 성향에 따른 서비스 디자인 요소 설정 — 8점
                          - paragraph [ref=f26e327]: "- 원문: 사용자 성향 조사를 통해 서비스 디자인 요소를 설정할 수 있다."
                          - paragraph [ref=f26e328]: "- 원본: PDF 78쪽 / 인쇄 66쪽"
                          - paragraph [ref=f26e329]: "- 증빙: 사용자 성향 자료·가설, 요구·접점·디자인 요소의 연결, 유지·보완 이유."
                          - paragraph [ref=f26e330]: "- 판단 범위: 사용자 성향에서 구체적 서비스 요소로의 연결. SO-03에서 처리한 동일한 출처 문제는 중복 감점하지 않는다."
                          - paragraph [ref=f26e331]: "- 7~8점: 사용자 성향과 요구를 근거로 해당 서비스의 물리적·디지털·인적·시간적 요소 중 필요한 요소를 선정하고 적용 위치·운영 방식·선택 이유를 구체화했다."
                          - paragraph [ref=f26e332]: "- 5~6점: 주요 요소가 성향과 연결되지만 일부 적용 위치, 운영 방식 또는 선정 이유가 부족하다."
                          - paragraph [ref=f26e333]: "- 3~4점: 요소는 나열했으나 사용자 성향과 연결이 약하거나 화면 기능만으로 제한하여 중요한 접점을 놓쳤다."
                          - paragraph [ref=f26e334]: "- 0~2점: 사용자 성향에 따른 요소 설정이 없거나 서비스 상황과 맞지 않는 요소만 제시했다."
                          - paragraph [ref=f26e335]
                          - paragraph [ref=f26e336]:
                            - strong [ref=f26e338]: 11.사용자 경험에 근거한 잠재 요구 파악 — 10점
                          - paragraph [ref=f26e339]: "- 원문: 사용자 경험조사를 바탕으로 잠재 요구를 파악할 수 있다."
                          - paragraph [ref=f26e340]: "- 원본: PDF 78쪽 / 인쇄 66쪽"
                          - paragraph [ref=f26e341]: "- 증빙: 출처가 있는 경험 자료 또는 가설로 표시한 가상 이용 기록, 행동 단서·명시적 요구·잠재 요구·대안 해석·후속 확인 질문."
                          - paragraph [ref=f26e342]: "- 판단 범위: 경험 단서에서 잠재 요구로 이어지는 해석의 질. 가상 시나리오는 모의 분석 증빙이며 실제 경험조사 실행의 증빙이 아니다."
                          - paragraph [ref=f26e343]: "- 9~10점: 이용 전·중·후 경험의 행동·감정·불편 단서를 잠재 요구와 연결하고 명시적 요구와 구별했으며 대안 해석, 자료·가설의 한계와 후속 확인 질문을 제시했다."
                          - paragraph [ref=f26e344]: "- 6~8점: 경험 단서와 잠재 요구는 연결되지만 명시적 요구와의 구별, 대안 해석 또는 후속 확인 방법이 일부 부족하다."
                          - paragraph [ref=f26e345]: "- 3~5점: 잠재 요구를 제시했으나 원하는 기능을 다시 표현하거나 행동 단서와의 연결이 약하다."
                          - paragraph [ref=f26e346]: "- 0~2점: 잠재 요구 도출이 없거나 경험 단서 없이 사용자의 속마음을 단정했다."
                          - paragraph [ref=f26e347]
                          - paragraph [ref=f26e348]:
                            - strong [ref=f26e350]: 12.잠재 요구에 따른 서비스 환경 개선 예측 — 10점
                          - paragraph [ref=f26e351]: "- 원문: 사용자 잠재 요구를 바탕으로 서비스 환경 개선을 예측할 수 있다."
                          - paragraph [ref=f26e352]: "- 원본: PDF 78쪽 / 인쇄 66쪽"
                          - paragraph [ref=f26e353]: "- 증빙: 잠재 요구·문제·AI 판단·수정 전후·재확인 ID 연결, 예상 효과·부작용·확인 조건."
                          - paragraph [ref=f26e354]: "- 판단 범위: 잠재 요구에 대한 개선의 타당성과 검증 가능한 예측. 실제 효과 달성을 필수로 요구하지 않는다."
                          - paragraph [ref=f26e355]: "- 9~10점: 잠재 요구에서 개선 우선순위를 정하고 접점·정보·절차 등의 수정 전후를 추적했으며 예상 효과·부작용과 확인 조건을 제시하고 문서·흐름의 재확인 및 남은 가설을 기록했다."
                          - paragraph [ref=f26e356]: "- 6~8점: 잠재 요구와 수정은 연결되고 예상 효과가 있지만 우선순위 이유, 부작용, 확인 조건 또는 남은 과제가 일부 부족하다."
                          - paragraph [ref=f26e357]: "- 3~5점: 수정 결과는 있으나 잠재 요구와의 연결이 약하거나 효과를 추상적으로 예측하고 재확인 근거가 부족하다."
                          - paragraph [ref=f26e358]: "- 0~2점: 환경 개선 예측을 확인할 수 없거나 잠재 요구와 무관한 수정·근거 없는 효과 단정에 머문다."
