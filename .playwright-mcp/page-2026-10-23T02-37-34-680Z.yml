                    - cell [ref=f21e185]:
                      - paragraph [ref=f21e186]: 자료를 분류하고 예비 방향·개발 범위를 정리
                    - cell [ref=f21e187]:
                      - paragraph [ref=f21e188]: 45분
                  - row [ref=f21e189]:
                    - cell [ref=f21e190]:
                      - paragraph [ref=f21e191]: ⑤ 점검
                    - cell [ref=f21e192]:
                      - paragraph [ref=f21e193]: 수정 전후를 비교하고 다음 검증 질문 작성
                    - cell [ref=f21e194]:
                      - paragraph [ref=f21e195]: 15분
              - paragraph [ref=f21e196]: "준비물: 기존 조사 결과물, 원문 링크·캡처·조사 기록, 표를 작성할 도구입니다. 선택 영상 시청에는 약 17분을 추가하세요. 아래 수량과 양식은 보완학습을 위한 권장 예시이며 기존 평가의 배점·제출 조건을 바꾸지 않습니다."
              - blockquote [ref=f21e197]:
                - paragraph [ref=f21e198]: "학습 후 남길 것: ① 사용자 우선순위표 ② 경쟁사 디자인 비교표 ③ 근거와 디자인 방향 연결표 ④ 단계별 개발 범위표입니다. 빈 양식은 첨부파일에서 편집할 수 있습니다."
              - heading "2. 출처가 있는 자료를 판단의 근거로 바꾸기" [level=2] [ref=f21e199]
              - paragraph [ref=f21e200]:
                - text: “시장이 성장하고 있다”, “요즘 이 디자인이 유행한다”는 문장만으로는 내 프로젝트의 방향을 설명하기 어렵습니다.
                - strong [ref=f21e201]: 어느 범위의 자료가 무엇을 보여주는지
                - text: 먼저 확인하세요. 성장 수치가 있더라도 조사 대상·기간·지역·단위가 다르면 직접 비교할 수 없습니다.
              - table [ref=f21e202]:
