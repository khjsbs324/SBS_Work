            - cell [ref=f21e133]:
              - paragraph [ref=f21e134]:
                - strong [ref=f21e135]: 첨부자료 안내
                - text: — 아래 ZIP에는 출력용 심화학습자료 PDF 10쪽, 편집 가능한 실습 양식 DOCX 6종, 설명 도식 PNG 2개가 들어 있습니다. 먼저 본문을 읽고 필요한 양식을 자신의 프로젝트에 적용하세요.
              - heading "조사 근거를 디자인 방향으로 연결하는 심화학습" [level=2] [ref=f21e136]
              - paragraph [ref=f21e137]:
                - strong [ref=f21e138]: 시각디자인 리서치 조사 · A그룹 지원자료
              - heading "1. 이번 학습의 목표와 활용 순서" [level=2] [ref=f21e139]
              - paragraph [ref=f21e140]:
                - text: 시장과 트렌드를 조사하고 브랜드 콘셉트를 제안했다면, 이제는
                - strong [ref=f21e141]: 왜 그 사용자를 우선하고, 왜 그 디자인 방향을 선택하는지
                - text: 근거를 정리할 차례입니다. A그룹은 조사량을 늘리기보다 기존 자료에서 판단의 근거와 빈틈을 찾아 보완하는 데 집중하세요.
              - list [ref=f21e142]:
                - listitem [ref=f21e143]:
                  - paragraph [ref=f21e144]: 주 사용자와 부 사용자를 이용 목적·상황·행동으로 구분하고 선정 근거를 설명합니다.
                - listitem [ref=f21e145]:
                  - paragraph [ref=f21e146]: 경쟁사의 조형적 특징을 같은 기준으로 비교하여 차별화의 출발점을 찾습니다.
                - listitem [ref=f21e147]:
                  - paragraph [ref=f21e148]: 조사 사실·해석·가설을 구분하고, 근거가 연결된 예비 디자인 방향을 작성합니다.
                - listitem [ref=f21e149]:
                  - paragraph [ref=f21e150]: 조사 결과에 맞춰 1차 개발 범위와 이후 확장 범위를 구분합니다.
              - table [ref=f21e151]:
