              - paragraph [ref=f21e230]: 자료마다 R-01, R-02처럼 식별번호를 붙이고, 설명 옆에 번호를 적어 원문으로 돌아갈 수 있게 하세요. 홈페이지나 검색 결과 화면만 제시하기보다 해당 주장을 확인할 수 있는 상세 자료를 연결합니다.
