                    - cell [ref=f21e300]:
                      - paragraph [ref=f21e301]: 자료ID와 남아 있는 질문
              - paragraph [ref=f21e302]:
                - text: 예를 들어 향 제품은 실제 사용자와 선물 구매자의 관심 정보가 다를 수 있고, 문구 제품은 일상 기록자와 선물 구매자의 비교 기준이 다를 수 있습니다. 이는
                - strong [ref=f21e303]: 조사할 역할을 설명하는 예시
                - text: 이며, 자신의 조사에서 확인한 사실로 바꾸어 작성해야 합니다.
              - table [ref=f21e304]:
                - rowgroup [ref=f21e305]:
                  - row [ref=f21e306]:
                    - columnheader [ref=f21e307]:
                      - paragraph [ref=f21e308]: 질문 초안
                    - columnheader [ref=f21e309]:
                      - paragraph [ref=f21e310]: 개선 질문
                    - columnheader [ref=f21e311]:
                      - paragraph [ref=f21e312]: 확인할 것
                - rowgroup [ref=f21e313]:
                  - row [ref=f21e314]:
                    - cell [ref=f21e315]:
                      - paragraph [ref=f21e316]: 이런 제품이 있으면 구매하시겠어요?
                    - cell [ref=f21e317]:
                      - paragraph [ref=f21e318]: 최근 비슷한 제품을 선택했던 상황과 비교했던 대안을 말씀해 주세요.
                    - cell [ref=f21e319]:
                      - paragraph [ref=f21e320]: 실제 선택 맥락과 기준
                  - row [ref=f21e321]:
                    - cell [ref=f21e322]:
                      - paragraph [ref=f21e323]: 휴대성이 중요하지 않나요?
                    - cell [ref=f21e324]:
                      - paragraph [ref=f21e325]: 가장 최근 들고 다녔던 상황에서 편했던 점과 불편했던 점은 무엇인가요?
                    - cell [ref=f21e326]:
                      - paragraph [ref=f21e327]: 불편의 구체적 조건
                  - row [ref=f21e328]:
                    - cell [ref=f21e329]:
                      - paragraph [ref=f21e330]: 어떤 디자인이 좋으세요?
                    - cell [ref=f21e331]:
                      - paragraph [ref=f21e332]: 후보를 비교할 때 어떤 정보를 먼저 보고 무엇 때문에 제외했나요?
                    - cell [ref=f21e333]:
                      - paragraph [ref=f21e334]: 행동과 판단의 근거
              - paragraph [ref=f21e335]: 실제 조사 시 목적과 기록 방법을 설명하고 동의를 받으세요. 이름·연락처 대신 익명 ID를 사용합니다. 발언·관찰과 자신의 해석을 다른 칸에 적고, 소수의 의견을 전체 고객의 비율로 확대하지 않습니다.
              - blockquote [ref=f21e336]:
                - paragraph [ref=f21e337]: "실습: 주·부 사용자 각각 1개 역할을 정의하고, 선정 이유와 근거ID를 적으세요. 근거가 없으면 “가설”로 표시한 후 확인할 질문을 남기세요. 참여자를 확보하지 못했다면 강사가 제공한 익명 자료를 사용하고 자료 유형을 표시합니다."
              - heading "4. 경쟁사 이미지를 동일한 기준으로 비교하기" [level=2] [ref=f21e338]
              - paragraph [ref=f21e339]:
                - text: 경쟁사 이미지를 모으는 것과 비교하는 것은 다릅니다. 먼저
                - strong [ref=f21e340]: 같은 사용자 목적을 해결하는 직접 대안
                - text: 과
                - strong [ref=f21e341]: 다른 방식으로 같은 목적을 해결하는 간접 대안
                - text: 을 구분하세요. 단순히 유명하거나 보기 좋은 브랜드만 고르면 선정 근거가 약해집니다.
              - table [ref=f21e342]:
                - rowgroup [ref=f21e343]:
                  - row [ref=f21e344]:
                    - columnheader [ref=f21e345]:
                      - paragraph [ref=f21e346]: 비교 축
                    - columnheader [ref=f21e347]:
                      - paragraph [ref=f21e348]: 관찰할 내용
                    - columnheader [ref=f21e349]:
                      - paragraph [ref=f21e350]: 디자인 방향을 위한 질문
                - rowgroup [ref=f21e351]:
                  - row [ref=f21e352]:
                    - cell [ref=f21e353]:
                      - paragraph [ref=f21e354]: 형태·구조
                    - cell [ref=f21e355]:
                      - paragraph [ref=f21e356]: 크기, 개폐·휴대 방식, 정보의 배치 순서
                    - cell [ref=f21e357]:
                      - paragraph [ref=f21e358]: 어떤 이용 상황에 맞고 어떤 제약이 있는가?
                  - row [ref=f21e359]:
                    - cell [ref=f21e360]:
                      - paragraph [ref=f21e361]: 색상·타입
                    - cell [ref=f21e362]:
                      - paragraph [ref=f21e363]: 대비, 글자 크기, 서체 역할, 정보 위계
                    - cell [ref=f21e364]:
                      - paragraph [ref=f21e365]: 핵심 정보가 먼저 읽히는가?
                  - row [ref=f21e366]:
                    - cell [ref=f21e367]:
                      - paragraph [ref=f21e368]: 재질·이미지
                    - cell [ref=f21e369]:
                      - paragraph [ref=f21e370]: 공식 표기 재질, 사진·일러스트의 역할
                    - cell [ref=f21e371]:
                      - paragraph [ref=f21e372]: 실제로 확인 가능한 특성과 추정한 특성은 무엇인가?
                  - row [ref=f21e373]:
                    - cell [ref=f21e374]:
                      - paragraph [ref=f21e375]: 레이아웃·접점
                    - cell [ref=f21e376]:
                      - paragraph [ref=f21e377]: 패키지 앞·뒤, 상세페이지, 비교·구매 동선
                    - cell [ref=f21e378]:
                      - paragraph [ref=f21e379]: 내 사용자에게 필요한 정보가 어디에 있는가?
              - paragraph [ref=f21e380]: 권장 연습으로 직접 경쟁사 2개와 간접 대안 1개를 같은 접점에서 비교하세요. “고급스럽다” 대신 색·면적·배치·정보 순서처럼 다시 관찰할 수 있는 말로 기록합니다. 사진만 보고 실제 촉감이나 재질을 단정하지 마세요.
              - table [ref=f21e381]:
                - rowgroup [ref=f21e382]:
                  - row [ref=f21e383]:
                    - columnheader [ref=f21e384]:
                      - paragraph [ref=f21e385]: 부족한 기록
                    - columnheader [ref=f21e386]:
                      - paragraph [ref=f21e387]: 구체화한 기록 방식
                - rowgroup [ref=f21e388]:
                  - row [ref=f21e389]:
                    - cell [ref=f21e390]:
                      - paragraph [ref=f21e391]: A사는 세련됐다.
                    - cell [ref=f21e392]:
                      - paragraph [ref=f21e393]: A사의 어떤 면·화면에서 색 수, 제목 크기, 여백, 정보 순서를 관찰했는지 적습니다.
                  - row [ref=f21e394]:
                    - cell [ref=f21e395]:
                      - paragraph [ref=f21e396]: 우리 브랜드는 차별화한다.
                    - cell [ref=f21e397]:
                      - paragraph [ref=f21e398]: 어떤 사용자 목적에 대해 어떤 정보·형태를 우선하며, 그 판단의 근거가 무엇인지 적습니다.
              - paragraph [ref=f21e399]: 포지셔닝 맵을 쓴다면 축을 먼저 정의하세요. 예를 들어 “감성적 ↔ 기능적”처럼 판단 기준이 모호한 축보다, 실제 자료에서 관찰 가능한 기준을 택하고 각 위치에 근거ID를 연결합니다. 경쟁사가 하지 않는다는 이유만으로 그 기능이 필요하다고 결론 내리지는 마세요.
              - blockquote [ref=f21e400]:
                - paragraph [ref=f21e401]: "실습: 비교표 마지막에 “유지할 장점 1개 / 보완할 기회 1개 / 추가로 확인할 질문 1개”를 작성하세요."
              - 'heading "5. 조사 결과 정리: 메모를 묶고 근거를 남기기" [level=2] [ref=f21e402]'
              - paragraph [ref=f21e403]: 어피니티 다이어그램은 조사 기록의 유사한 내용을 묶어 관계를 살피는 방법입니다. 먼저 실제 기록을 작은 의미 단위로 나눈 뒤 묶어야 합니다. 처음부터 원하는 결론의 제목을 만들어 자료를 끼워 넣지 마세요.
              - paragraph [ref=f21e404]:
                - img "자료ID가 있는 실제 기록을 의미 단위로 나누고 묶음·해석·미확인 질문으로 정리하는 절차" [ref=f21e405]
              - list [ref=f21e406]:
                - listitem [ref=f21e407]:
                  - paragraph [ref=f21e408]: ① 실제 메모·응답·관찰에서 의미가 하나인 내용을 카드 하나에 적고 자료ID와 원문 위치를 붙입니다.
                - listitem [ref=f21e409]:
                  - paragraph [ref=f21e410]: ② 유사한 내용끼리 묶되, 한 카드에 여러 주제가 있으면 분리합니다.
                - listitem [ref=f21e411]:
                  - paragraph [ref=f21e412]: ③ 묶음 이름은 자료가 공통으로 말하는 내용을 드러내도록 정합니다.
                - listitem [ref=f21e413]:
                  - paragraph [ref=f21e414]: ④ 맞지 않는 의견과 반대 사례도 남겨 해석의 한계를 확인합니다.
                - listitem [ref=f21e415]:
                  - paragraph [ref=f21e416]: ⑤ 각 묶음에서 “확인한 내용 / 가능한 해석 / 미확인 질문”을 따로 작성합니다.
              - paragraph [ref=f21e417]: 카드 수는 중요도나 시장 비율을 뜻하지 않습니다. 같은 참여자의 긴 발언을 여러 카드로 나누었다면 카드 수와 참여자 수가 달라집니다. 정리 결과를 “전체 사용자가 원한다”는 표현으로 바꾸지 마세요.
              - blockquote [ref=f21e418]:
                - paragraph [ref=f21e419]: "실습: 기존 자료 중 핵심 기록 6~10개를 골라 2~4개 주제로 묶어 보세요. 새 응답을 만들어 채우지 말고, 자료가 적으면 확보한 기록만 사용한 뒤 추가 조사할 항목을 적으세요."
              - heading "6. 근거를 예비 디자인 방향으로 연결하기" [level=2] [ref=f21e420]
              - paragraph [ref=f21e421]:
                - text: 이 능력단위에서는 조사자료의 수집·분류·비교와 예비 방향 설정을 연습합니다.
                - strong [ref=f21e422]: 조사 기록에서 곧바로 최종 콘셉트나 효과를 확정하지 말고
                - text: ", 관찰한 사실과 자신의 해석, 아직 확인할 가설을 구분하세요."
              - paragraph [ref=f21e423]:
                - img "출처와 원문 위치에서 시작하여 관찰·해석·요구사항 가설·예비 방향·추가 확인으로 이어지는 연결표" [ref=f21e424]
              - table [ref=f21e425]:
                - rowgroup [ref=f21e426]:
                  - row [ref=f21e427]:
                    - columnheader [ref=f21e428]:
                      - paragraph [ref=f21e429]: 구분
                    - columnheader [ref=f21e430]:
                      - paragraph [ref=f21e431]: 작성할 내용
                - rowgroup [ref=f21e432]:
                  - row [ref=f21e433]:
                    - cell [ref=f21e434]:
                      - paragraph [ref=f21e435]: 관찰 사실
                    - cell [ref=f21e436]:
                      - paragraph [ref=f21e437]: 실제 원문·응답·화면에서 확인한 내용과 자료ID
                  - row [ref=f21e438]:
                    - cell [ref=f21e439]:
                      - paragraph [ref=f21e440]: 해석
                    - cell [ref=f21e441]:
                      - paragraph [ref=f21e442]: 그 사실이 사용자 목적·상황에서 의미할 수 있는 점
                  - row [ref=f21e443]:
                    - cell [ref=f21e444]:
                      - paragraph [ref=f21e445]: 요구사항 가설
                    - cell [ref=f21e446]:
                      - paragraph [ref=f21e447]: 현재 근거를 바탕으로 잠정적으로 필요한 조건
                  - row [ref=f21e448]:
                    - cell [ref=f21e449]:
                      - paragraph [ref=f21e450]: 예비 디자인 방향
                    - cell [ref=f21e451]:
                      - paragraph [ref=f21e452]: 색·형태·정보 위계·구성 등에 적용해 볼 방향
                  - row [ref=f21e453]:
                    - cell [ref=f21e454]:
                      - paragraph [ref=f21e455]: 다음 확인
                    - cell [ref=f21e456]:
                      - paragraph [ref=f21e457]: 가설을 확인할 질문, 추가 자료 또는 비교할 대안
              - paragraph [ref=f21e458]:
                - strong [ref=f21e459]: "설명용 가정 예시:"
                - text: 비교 페이지에서 규격 정보가 서로 다른 위치에 있다고 가정하면, 관찰은 “규격 표기 위치가 다르다”입니다. “사용자가 찾기 어렵다”는 실제 사용자 기록이 없다면 해석 또는 가설입니다. 예비 방향은 규격을 같은 위치에서 비교하도록 제안하고, 다음 조사에서는 어떤 정보를 먼저 찾는지 확인하는 것입니다.
              - blockquote [ref=f21e460]:
                - paragraph [ref=f21e461]: "실습: 근거ID가 연결된 예비 방향 3개를 작성하세요. 각각에 대안 1개와 아직 확인하지 못한 점을 덧붙이세요. 화면이나 제품의 모든 요소를 바꿀 필요는 없습니다."
              - heading "7. 조사에 맞춰 1차 개발 범위 정하기" [level=2] [ref=f21e462]
              - paragraph [ref=f21e463]:
                - text: 개발수준 예측은 가능한 기능이나 제품을 많이 나열하는 일이 아닙니다.
                - strong [ref=f21e464]: 우선 사용자의 핵심 목적을 충족하기 위해 무엇을 먼저 만들고, 무엇을 나중에 확인할지
                - text: 정하는 일입니다. 실제 구현·출시 완료를 요구하는 활동은 아닙니다.
              - table [ref=f21e465]:
                - rowgroup [ref=f21e466]:
                  - row [ref=f21e467]:
                    - columnheader [ref=f21e468]:
                      - paragraph [ref=f21e469]: 판단 기준
                    - columnheader [ref=f21e470]:
                      - paragraph [ref=f21e471]: 검토 질문
                - rowgroup [ref=f21e472]:
                  - row [ref=f21e473]:
                    - cell [ref=f21e474]:
                      - paragraph [ref=f21e475]: 필요성
                    - cell [ref=f21e476]:
                      - paragraph [ref=f21e477]: 핵심 사용자 문제와 직접 연결되며 자료ID가 있는가?
                  - row [ref=f21e478]:
                    - cell [ref=f21e479]:
                      - paragraph [ref=f21e480]: 확실성
                    - cell [ref=f21e481]:
                      - paragraph [ref=f21e482]: 확인된 사실인가, 아직 검증하지 않은 가설인가?
                  - row [ref=f21e483]:
                    - cell [ref=f21e484]:
                      - paragraph [ref=f21e485]: 실행 가능성
                    - cell [ref=f21e486]:
                      - paragraph [ref=f21e487]: 현재 확보한 자료·시간·제작 여건으로 설명 가능한가?
                  - row [ref=f21e488]:
                    - cell [ref=f21e489]:
                      - paragraph [ref=f21e490]: 의존 관계
                    - cell [ref=f21e491]:
                      - paragraph [ref=f21e492]: 이 항목보다 먼저 확인하거나 준비해야 할 것은 무엇인가?
              - table [ref=f21e493]:
                - rowgroup [ref=f21e494]:
                  - row [ref=f21e495]:
                    - columnheader [ref=f21e496]:
                      - paragraph [ref=f21e497]: 구분
                    - columnheader [ref=f21e498]:
                      - paragraph [ref=f21e499]: 브랜드 프로젝트 예시
                    - columnheader [ref=f21e500]:
                      - paragraph [ref=f21e501]: 포트폴리오 사이트에 적용한다면
                - rowgroup [ref=f21e502]:
                  - row [ref=f21e503]:
                    - cell [ref=f21e504]:
                      - paragraph [ref=f21e505]: 1차 범위
                    - cell [ref=f21e506]:
                      - paragraph [ref=f21e507]: 핵심 사용 상황 1개, 대표 제품·구성, 필수 비교 정보
                    - cell [ref=f21e508]:
                      - paragraph [ref=f21e509]: 대표 프로젝트·역할·과정·연락 정보의 우선 범위
                  - row [ref=f21e510]:
                    - cell [ref=f21e511]:
                      - paragraph [ref=f21e512]: 다음 확인 후 확장
                    - cell [ref=f21e513]:
                      - paragraph [ref=f21e514]: 용량·선물 구성·제품군 확대 등 근거 확인이 필요한 항목
                    - cell [ref=f21e515]:
                      - paragraph [ref=f21e516]: 추가 사례·상호작용 등 효과와 제작 여건 확인이 필요한 항목
                  - row [ref=f21e517]:
                    - cell [ref=f21e518]:
                      - paragraph [ref=f21e519]: 보류
                    - cell [ref=f21e520]:
                      - paragraph [ref=f21e521]: 사용자 근거가 없거나 핵심 목적과 관계가 약한 아이디어
                    - cell [ref=f21e522]:
                      - paragraph [ref=f21e523]: 근거 없이 추가한 기능·과도한 표현
              - paragraph [ref=f21e524]: 위 항목은 적용 방식을 설명하는 예시입니다. 학생 자신의 프로젝트에 맞춰 바꾸세요. “작은 용량이 잘 팔릴 것이다”처럼 판매 결과를 예측하려면 별도의 근거가 필요합니다. 근거가 없으면 확인할 가설로 남깁니다.
              - blockquote [ref=f21e525]:
                - paragraph [ref=f21e526]: "실습: 1차 항목 3개, 다음 단계 항목 2개, 보류 항목 1개를 권장 연습으로 정리하세요. 각 항목에 근거ID·선정 이유·다음 확인을 붙이고, 수량보다 이유의 타당성을 우선하세요."
              - heading "8. 하나의 예시로 연결해 보기" [level=2] [ref=f21e527]
              - paragraph [ref=f21e528]:
                - strong [ref=f21e529]: "교육용 가정 사례: 휴대용 기록 문구 브랜드."
                - text: 아래는 작성 방식을 설명하기 위한 제안이며 실제 조사·인터뷰·판매 결과가 아닙니다. 학생 제출물의 근거로 사용하지 말고 자신의 원자료로 바꾸세요.
              - table [ref=f21e530]:
                - rowgroup [ref=f21e531]:
                  - row [ref=f21e532]:
                    - columnheader [ref=f21e533]:
                      - paragraph [ref=f21e534]: 단계
                    - columnheader [ref=f21e535]:
                      - paragraph [ref=f21e536]: 가정 사례에서 작성할 내용
                - rowgroup [ref=f21e537]:
                  - row [ref=f21e538]:
                    - cell [ref=f21e539]:
                      - paragraph [ref=f21e540]: 조사 질문
                    - cell [ref=f21e541]:
                      - paragraph [ref=f21e542]: 이동 중 기록할 때 어떤 크기·도구·정보가 필요한가?
                  - row [ref=f21e543]:
                    - cell [ref=f21e544]:
                      - paragraph [ref=f21e545]: 주·부 사용자 가설
                    - cell [ref=f21e546]:
                      - paragraph [ref=f21e547]: "주: 이동 중 스스로 기록할 사람 / 부: 선물 목적으로 비교할 사람. 실제 자료로 역할을 확인한다."
                  - row [ref=f21e548]:
                    - cell [ref=f21e549]:
                      - paragraph [ref=f21e550]: 자료 수집
                    - cell [ref=f21e551]:
                      - paragraph [ref=f21e552]: 최근 사용 경험에 대한 질문, 실제 제품 규격·구성 정보, 동일 접점의 경쟁사 자료를 확보한다.
                  - row [ref=f21e553]:
                    - cell [ref=f21e554]:
                      - paragraph [ref=f21e555]: 비교와 분류
                    - cell [ref=f21e556]:
                      - paragraph [ref=f21e557]: 휴대·보관, 기록 시작, 구매 판단 등 실제 기록이 보여주는 주제를 찾는다.
                  - row [ref=f21e558]:
                    - cell [ref=f21e559]:
                      - paragraph [ref=f21e560]: 예비 방향
                    - cell [ref=f21e561]:
                      - paragraph [ref=f21e562]: 확인한 조건에 맞춰 규격·구성·사용 장면 정보의 우선순위를 제안한다.
                  - row [ref=f21e563]:
                    - cell [ref=f21e564]:
                      - paragraph [ref=f21e565]: 개발수준 예측
                    - cell [ref=f21e566]:
                      - paragraph [ref=f21e567]: 대표 구성과 필수 정보를 우선 범위로 제안하고, 선물 구성 등은 추가 근거 확인 후 판단한다.
                  - row [ref=f21e568]:
                    - cell [ref=f21e569]:
                      - paragraph [ref=f21e570]: 다음 조사
                    - cell [ref=f21e571]:
                      - paragraph [ref=f21e572]: 실제 이용자가 어떤 상황에서 무엇을 먼저 확인하며 어떤 대안을 고르는지 묻는다.
              - paragraph [ref=f21e573]: 향 제품 프로젝트라면 규격·구성을 향의 사용 상황, 향 선택 정보, 용량, 사용 방식 등으로 바꿔 적용할 수 있습니다. 판매 문구나 효능을 조사 없이 단정하지 말고 공식 정보와 사용자의 실제 경험을 구분하세요.
              - paragraph [ref=f21e574]:
                - strong [ref=f21e575]: "설명 문장 틀:"
                - text: “[자료ID·위치]에서 [관찰한 내용]을 확인했습니다. 이를 [사용자 목적·상황]과 연결하여 [요구사항]을 가설로 설정했습니다. 이에 따라 [예비 디자인 방향]을 제안하며, [미확인점]은 [추가 조사 방법]으로 확인하겠습니다.”
              - blockquote [ref=f21e576]:
                - paragraph [ref=f21e577]: 자신의 프로젝트에 적용할 때는 서로 모순되는 자료도 표시하세요. 현재 근거로 판단할 수 없는 부분을 남기는 것이, 자료에 없는 결론을 채우는 것보다 정확합니다.
              - heading "9. 국내 전문가 자료와 무료 영상 학습 안내" [level=2] [ref=f21e578]
              - heading "필수 읽기 1 | pxd 박재현" [level=3] [ref=f21e579]
              - paragraph [ref=f21e580]:
                - link "정성, 정량 조사를 병행하여 퍼소나에 설득력 부여하기" [ref=f21e581] [cursor=pointer]:
                  - /url: https://story.pxd.co.kr/1343
                - text: · 공개일 2018-12-05
              - paragraph [ref=f21e582]: “인터뷰와 서베이를 조합하여 조사 설계하고 분석하기” 부분을 중심으로 읽으세요.
              - paragraph [ref=f21e583]:
                - strong [ref=f21e584]: "적용 활동:"
                - text: 내 사용자 구분에서 실제 근거가 있는 항목과 아직 가정인 항목을 구분하세요.
              - heading "필수 읽기 2 | pxd 전성진" [level=3] [ref=f21e585]
              - paragraph [ref=f21e586]:
                - link "사용자의 목소리로부터 보다 효과적으로 정보를 얻는 방법" [ref=f21e587] [cursor=pointer]:
                  - /url: https://story.pxd.co.kr/341
                - text: · 공개일 2011-02-27
              - paragraph [ref=f21e588]: 5번·7번·8번·9번 항목을 중심으로 읽으세요.
              - paragraph [ref=f21e589]:
                - strong [ref=f21e590]: "적용 활동:"
                - text: 막연한 선호 질문 2개를 최근 경험과 구체적 상황을 확인하는 질문으로 고치세요.
              - heading "심화 읽기 | pxd 전성진" [level=3] [ref=f21e591]
              - paragraph [ref=f21e592]:
                - link "멘탈모델(2)-행동중심의 디자인접근법" [ref=f21e593] [cursor=pointer]:
                  - /url: https://story.pxd.co.kr/176
                - text: · 공개일 2010-07-06
              - paragraph [ref=f21e594]: “행동 추출하기”와 “패턴찾기” 부분을 읽으세요.
              - paragraph [ref=f21e595]:
                - strong [ref=f21e596]: "적용 활동:"
                - text: 자신의 기록에서 행동에 관한 내용을 골라 원문 위치와 함께 분류하세요. 완전한 멘탈모델 제작은 요구하지 않습니다.
              - heading "선택 영상 | 공돌이 디자이너" [level=3] [ref=f21e597]
              - paragraph [ref=f21e598]:
                - link "현직 UXUI 디자이너 포트폴리오 공개합니다" [ref=f21e599] [cursor=pointer]:
                  - /url: https://www.youtube.com/watch?v=8HzYbvzoPqw
                - text: · 공개일 2020-04-09
              - paragraph [ref=f21e600]: 전체 약 16분 23초. 리서치부터 디자인까지의 과정을 소개하는 사례 영상입니다.
              - paragraph [ref=f21e601]:
                - strong [ref=f21e602]: "적용 활동:"
                - text: 시청하면서 조사→디자인의 연결을 설명하는 장면을 찾아 재생 시각과 배운 점을 기록하세요. 화면 표현을 그대로 모방하지 마세요.
              - paragraph [ref=f21e603]: 글은 무료 공개된 한국어 자료이며 영상은 무료 공개 유튜브 콘텐츠입니다. 과거 자료는 조사 방법과 사고방식을 익히는 데 활용하고, 자신의 프로젝트 시장·경쟁사 정보는 조사 시점에 맞는 원문을 확인하세요. 참고자료는 저자의 원문으로 연결했으며 본문의 예시·양식·도식은 학습을 위해 별도로 작성했습니다.
              - heading "10. 보완 실습과 자기점검" [level=2] [ref=f21e604]
              - table [ref=f21e605]:
                - rowgroup [ref=f21e606]:
                  - row [ref=f21e607]:
                    - columnheader [ref=f21e608]:
                      - paragraph [ref=f21e609]: 단계
                    - columnheader [ref=f21e610]:
                      - paragraph [ref=f21e611]: 보완할 결과물
                    - columnheader [ref=f21e612]:
                      - paragraph [ref=f21e613]: 완료 확인
                - rowgroup [ref=f21e614]:
                  - row [ref=f21e615]:
                    - cell [ref=f21e616]:
                      - paragraph [ref=f21e617]: "1"
                    - cell [ref=f21e618]:
                      - paragraph [ref=f21e619]: 출처 기록표
                    - cell [ref=f21e620]:
                      - paragraph [ref=f21e621]: 핵심 주장에 원문 위치·자료ID·적용 한계가 있다.
                  - row [ref=f21e622]:
                    - cell [ref=f21e623]:
                      - paragraph [ref=f21e624]: "2"
                    - cell [ref=f21e625]:
                      - paragraph [ref=f21e626]: 사용자 우선순위표
                    - cell [ref=f21e627]:
                      - paragraph [ref=f21e628]: 주·부 사용자를 역할과 행동으로 구분하고 근거를 연결했다.
                  - row [ref=f21e629]:
                    - cell [ref=f21e630]:
                      - paragraph [ref=f21e631]: "3"
                    - cell [ref=f21e632]:
                      - paragraph [ref=f21e633]: 경쟁사 디자인 비교표
                    - cell [ref=f21e634]:
                      - paragraph [ref=f21e635]: 선정 이유가 있고 같은 접점을 동일 기준으로 비교했다.
                  - row [ref=f21e636]:
                    - cell [ref=f21e637]:
                      - paragraph [ref=f21e638]: "4"
                    - cell [ref=f21e639]:
                      - paragraph [ref=f21e640]: 근거→예비 방향 연결표
                    - cell [ref=f21e641]:
                      - paragraph [ref=f21e642]: 관찰·해석·가설을 구분하고 다음 확인을 적었다.
                  - row [ref=f21e643]:
                    - cell [ref=f21e644]:
                      - paragraph [ref=f21e645]: "5"
                    - cell [ref=f21e646]:
                      - paragraph [ref=f21e647]: 단계별 개발 범위표
                    - cell [ref=f21e648]:
                      - paragraph [ref=f21e649]: 1차·확장·보류의 근거와 판단 조건을 적었다.
                  - row [ref=f21e650]:
                    - cell [ref=f21e651]:
                      - paragraph [ref=f21e652]: "6"
                    - cell [ref=f21e653]:
                      - paragraph [ref=f21e654]: 수정 전후 기록
                    - cell [ref=f21e655]:
                      - paragraph [ref=f21e656]: 어디를 왜 고쳤는지 원본과 비교해 설명할 수 있다.
              - list [ref=f21e657]:
                - listitem [ref=f21e658]:
                  - paragraph [ref=f21e659]: □ 출처를 열면 내가 적은 주장과 같은 내용·조건을 확인할 수 있습니다.
                - listitem [ref=f21e660]:
                  - paragraph [ref=f21e661]: □ 인구통계나 취향만으로 사용자 특성을 단정하지 않았습니다.
                - listitem [ref=f21e662]:
                  - paragraph [ref=f21e663]: □ 경쟁사 비교의 “좋다·나쁘다”를 관찰 가능한 특징으로 바꾸었습니다.
                - listitem [ref=f21e664]:
                  - paragraph [ref=f21e665]: □ 반대 사례와 조사 한계를 지우지 않았습니다.
                - listitem [ref=f21e666]:
                  - paragraph [ref=f21e667]: □ 조사 기록에 없는 응답·수치·효과를 만들어 넣지 않았습니다.
                - listitem [ref=f21e668]:
                  - paragraph [ref=f21e669]: □ 예비 방향과 확정 사실을 구분했습니다.
                - listitem [ref=f21e670]:
                  - paragraph [ref=f21e671]: □ 각 개발 범위가 사용자 목적과 근거자료에 연결됩니다.
              - paragraph [ref=f21e672]:
                - strong [ref=f21e673]: "미흡할 때 돌아갈 곳:"
                - text: 근거가 약하면 2절, 사용자 구분이 모호하면 3절, 차별화가 추상적이면 4절, 결과가 나열되면 5~6절, 개발 범위가 과하면 7절을 다시 학습하세요.
              - paragraph [ref=f21e674]:
                - strong [ref=f21e675]: "교사에게 설명할 내용:"
                - text: 가장 크게 수정한 항목, 그 판단에 사용한 근거, 아직 확인하지 못한 점을 각각 한 문장으로 정리하세요. 모르는 점은 자료ID와 질문을 함께 가져오면 구체적인 피드백을 받기 쉽습니다.
              - blockquote [ref=f21e676]:
                - paragraph [ref=f21e677]: "다음 학습: 보완한 자료를 이후 시각디자인 리서치 분석과 디자인 개발의 입력으로 활용하세요. 이 자료에서는 예비 방향과 추가 확인까지 정리하고, 확정적인 분석·구현 결과를 미리 요구하지 않습니다."
