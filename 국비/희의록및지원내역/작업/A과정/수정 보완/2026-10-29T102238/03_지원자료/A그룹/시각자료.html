<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f6;font-family:"Malgun Gothic",sans-serif;color:#18364b}#visual{width:1120px;height:420px;padding:32px 38px;background:linear-gradient(120deg,#f3f8fb,#eef6ee)}.label{font-size:14px;font-weight:700;letter-spacing:2px;color:#497d69}h1{font-size:30px;letter-spacing:-1px;margin:10px 0 6px}.sub{font-size:17px;color:#516b7a}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}.card{padding:22px 18px;background:#fff;border-top:5px solid #428572;border-radius:10px;min-height:142px;box-shadow:0 5px 15px #18364b0b}.step{font-size:18px;font-weight:700;color:#235b51}.line{font-size:16px;line-height:1.85;margin-top:8px}.foot{margin-top:22px;font-size:15px;color:#4c6677}</style><div id="visual"><div class="label">수정 보완 / A그룹 / 검수 흐름</div><h1>고친 코드와 제출 증빙이 같은 상태인가요?</h1><div class="sub">원인 위치 → 계산값 → 같은 너비의 화면 → 최종 커밋의 증빙</div><div class="cards"><div class="card"><div class="step">01  원인 선언</div><div class="line">실제 파일·선택자<br>우회 규칙과 원인 분리</div></div><div class="card"><div class="step">02  최종 계산값</div><div class="line">Styles + Computed<br>적용·무효·덮어쓰기</div></div><div class="card"><div class="step">03  회귀 화면</div><div class="line">지정 5개 너비<br>잘림·포커스·넘침</div></div><div class="card"><div class="step">04  제출 일치</div><div class="line">HEAD · PR · ZIP<br>같은 코드의 근거 연결</div></div></div><div class="foot">정상인 부분도 보존해 재확인합니다. 수행하지 않은 검사는 미확인으로 남깁니다.</div></div></html>
