<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f6;font-family:"Malgun Gothic",sans-serif;color:#18364b}#visual{width:1120px;height:420px;padding:32px 38px;background:linear-gradient(120deg,#f3f8fb,#eef6ee)}.label{font-size:14px;font-weight:700;letter-spacing:2px;color:#497d69}h1{font-size:30px;letter-spacing:-1px;margin:10px 0 6px}.sub{font-size:17px;color:#516b7a}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{padding:22px 18px;background:#fff;border-top:5px solid #428572;border-radius:10px;min-height:142px;box-shadow:0 5px 15px #18364b0b}.step{font-size:18px;font-weight:700;color:#235b51}.line{font-size:16px;line-height:1.85;margin-top:8px}.foot{margin-top:22px;font-size:15px;color:#4c6677}</style><div id="visual"><div class="label">수정 보완 / C그룹 / 선택 기초 연습</div><h1>파일 한 곳의 수정이 화면까지 이어지는 과정</h1><div class="sub">연습 사본에서 시작해 작은 변화 한 건을 끝까지 확인하세요</div><div class="cards"><div class="card"><div class="step">01  HTML 열기</div><div class="line">lab/index.html<br>내용과 link 경로 확인</div></div><div class="card"><div class="step">02  CSS 저장</div><div class="line">lab/styles.css<br>여백 한 값만 변경</div></div><div class="card"><div class="step">03  화면 확인</div><div class="line">같은 페이지 새로고침<br>전후 변화와 질문 기록</div></div></div><div class="foot">HTML → link → CSS 파일 → 적용된 화면. 개발자 도구의 임시 변경과 파일 저장은 다릅니다.</div></div></html>
