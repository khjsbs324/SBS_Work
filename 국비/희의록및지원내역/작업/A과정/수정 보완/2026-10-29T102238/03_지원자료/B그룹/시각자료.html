<!doctype html><html lang="ko"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f6;font-family:"Malgun Gothic",sans-serif;color:#18364b}#visual{width:1120px;height:420px;padding:32px 38px;background:linear-gradient(120deg,#f3f8fb,#eef6ee)}.label{font-size:14px;font-weight:700;letter-spacing:2px;color:#497d69}h1{font-size:30px;letter-spacing:-1px;margin:10px 0 6px}.sub{font-size:17px;color:#516b7a}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{padding:22px 18px;background:#fff;border-top:5px solid #428572;border-radius:10px;min-height:142px;box-shadow:0 5px 15px #18364b0b}.step{font-size:18px;font-weight:700;color:#235b51}.line{font-size:16px;line-height:1.85;margin-top:8px}.foot{margin-top:22px;font-size:15px;color:#4c6677}</style><div id="visual"><div class="label">수정 보완 / B그룹 / 진단 순서</div><h1>겉모양을 고치기 전에 원인을 나누어 봅니다</h1><div class="sub">한 건 수정 → 실제 파일 저장 → 새로고침 → 같은 조건으로 비교</div><div class="cards"><div class="card"><div class="step">01  스타일이 없나요?</div><div class="line">link 경로 · 파일명<br>요청과 내부 문법 확인</div></div><div class="card"><div class="step">02  배열이 다른가요?</div><div class="line">display · Grid 열<br>변수·무효 선언 확인</div></div><div class="card"><div class="step">03  화면이 넘치나요?</div><div class="line">고정 폭 · 최소 폭<br>문서 폭과 원인 요소</div></div></div><div class="foot">파일 요청 성공만으로 끝내지 않습니다. 실제 적용값과 화면을 함께 확인합니다.</div></div></html>
