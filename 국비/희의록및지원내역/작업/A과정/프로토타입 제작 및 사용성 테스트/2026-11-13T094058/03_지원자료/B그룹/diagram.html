<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;font-family:Malgun Gothic,sans-serif;background:#f3f6fa;color:#17365a}main{width:1120px;box-sizing:border-box;padding:40px}h1{font-size:30px;margin:0 0 28px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #cbd8e6;border-top:5px solid #386f96;padding:20px 18px;min-height:155px;box-sizing:border-box}.num{font-size:15px;color:#60788d;font-weight:bold}h2{font-size:24px;margin:12px 0}p{font-size:19px;word-break:keep-all;line-height:1.6;margin:0}.note{font-size:17px;margin-top:24px;color:#53677a}</style><main><h1>선택에서 저장과 복귀까지 의미 맞추기</h1><div class="flow"><div class="card"><div class="num">01</div><h2>선택</h2><p>차분한 향 선택 표시</p></div><div class="card"><div class="num">02</div><h2>결과</h2><p>선택 조건과 추천 연결</p></div><div class="card"><div class="num">03</div><h2>저장</h2><p>지금 결과를 보관</p></div><div class="card"><div class="num">04</div><h2>복귀</h2><p>이전 선택 맥락 유지</p></div></div><p class="note">가상 향 추천 예시입니다. 재추천과 저장은 서로 다른 결과를 보여줍니다.</p></main></html>
