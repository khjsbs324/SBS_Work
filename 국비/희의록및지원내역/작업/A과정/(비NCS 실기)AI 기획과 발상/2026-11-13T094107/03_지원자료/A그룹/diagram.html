<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;font-family:Malgun Gothic,sans-serif;background:#f3f6fa;color:#17365a}main{width:1120px;box-sizing:border-box;padding:40px}h1{font-size:30px;margin:0 0 28px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #cbd8e6;border-top:5px solid #386f96;padding:20px 18px;min-height:155px;box-sizing:border-box}.num{font-size:15px;color:#60788d;font-weight:bold}h2{font-size:24px;margin:12px 0}p{font-size:19px;word-break:keep-all;line-height:1.6;margin:0}.note{font-size:17px;margin-top:24px;color:#53677a}</style><main><h1>경험의 판단이 최종 화면에 남는 과정</h1><div class="flow"><div class="card"><div class="num">01</div><h2>경험</h2><p>직접 한 일과 판단</p></div><div class="card"><div class="num">02</div><h2>브랜드</h2><p>근거 있는 소개 문장</p></div><div class="card"><div class="num">03</div><h2>선택</h2><p>대안 비교와 수정 이유</p></div><div class="card"><div class="num">04</div><h2>화면</h2><p>커버와 소개의 일관성</p></div></div><p class="note">학습용 구성 예시입니다. 경험·성과·대화 기록은 자신의 실제 자료를 사용합니다.</p></main></html>
