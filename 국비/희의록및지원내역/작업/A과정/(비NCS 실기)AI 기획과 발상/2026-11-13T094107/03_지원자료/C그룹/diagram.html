<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;font-family:Malgun Gothic,sans-serif;background:#f3f6fa;color:#17365a}main{width:1120px;box-sizing:border-box;padding:40px}h1{font-size:30px;margin:0 0 28px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #cbd8e6;border-top:5px solid #386f96;padding:20px 18px;min-height:155px;box-sizing:border-box}.num{font-size:15px;color:#60788d;font-weight:bold}h2{font-size:24px;margin:12px 0}p{font-size:19px;word-break:keep-all;line-height:1.6;margin:0}.note{font-size:17px;margin-top:24px;color:#53677a}</style><main><h1>질문에서 최종 화면까지 근거 남기기</h1><div class="flow"><div class="card"><div class="num">01</div><h2>실제 질문</h2><p>대화에서 원문 확인</p></div><div class="card"><div class="num">02</div><h2>초안</h2><p>처음 결과 찾기</p></div><div class="card"><div class="num">03</div><h2>수정</h2><p>직접 바꾼 위치</p></div><div class="card"><div class="num">04</div><h2>최종</h2><p>선택 이유와 확인</p></div></div><p class="note">기록이 없는 대화나 초안을 새로 만들어 과거 기록으로 채우지 않습니다.</p></main></html>
