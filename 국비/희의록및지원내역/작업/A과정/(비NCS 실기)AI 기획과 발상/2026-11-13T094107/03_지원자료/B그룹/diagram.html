<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;font-family:Malgun Gothic,sans-serif;background:#f3f6fa;color:#17365a}main{width:1120px;box-sizing:border-box;padding:40px}h1{font-size:30px;margin:0 0 28px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid #cbd8e6;border-top:5px solid #386f96;padding:20px 18px;min-height:155px;box-sizing:border-box}.num{font-size:15px;color:#60788d;font-weight:bold}h2{font-size:24px;margin:12px 0}p{font-size:19px;word-break:keep-all;line-height:1.6;margin:0}.note{font-size:17px;margin-top:24px;color:#53677a}</style><main><h1>취향을 실제 작업의 설명으로 바꾸기</h1><div class="flow"><div class="card"><div class="num">01</div><h2>취향</h2><p>정돈된 구성을 선호</p></div><div class="card"><div class="num">02</div><h2>경험</h2><p>직접 정렬한 화면</p></div><div class="card"><div class="num">03</div><h2>판단</h2><p>정보의 순서 조정</p></div><div class="card"><div class="num">04</div><h2>소개</h2><p>근거 있는 한 문장</p></div></div><p class="note">가상 연결 예시입니다. 성향을 곧바로 능력이나 경력으로 단정하지 않습니다.</p></main></html>
