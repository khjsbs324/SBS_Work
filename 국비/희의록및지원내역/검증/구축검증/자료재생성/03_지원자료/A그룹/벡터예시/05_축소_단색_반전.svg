<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" font-family="Malgun Gothic, sans-serif"><rect x="0" y="0" width="1160" height="730" rx="0" fill="#f2f6fb"/><text x="35" y="57" font-size="32" fill="#243d37" font-weight="700" >작은 크기·단색·반전을 같은 조건에서 확인하세요.</text><text x="60" y="132" font-size="25" fill="#243d37" font-weight="700" >16px</text><g transform="translate(60 170) scale(0.25)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="205" y="132" font-size="25" fill="#243d37" font-weight="700" >32px</text><g transform="translate(205 170) scale(0.5)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="390" y="132" font-size="25" fill="#243d37" font-weight="700" >64px</text><g transform="translate(390 170) scale(1.0)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="650" y="132" font-size="25" fill="#243d37" font-weight="700" >128px</text><g transform="translate(650 170) scale(2.0)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="35" y="352" font-size="23" fill="#243d37" font-weight="400" >크기는 연습값입니다. 실제 최소 크기는 자신의 검수 결과로 정하세요.</text><rect x="35" y="397" width="516" height="204" rx="12" fill="#fff"/><g transform="translate(67 434) scale(1.5625)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#1C2D29" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#1C2D29" stroke-width="4" stroke-linecap="round"/></g><text x="194" y="493" font-size="36" fill="#1C2D29" font-weight="700" >MORU NOTE</text><rect x="581" y="397" width="544" height="204" rx="12" fill="#234B43"/><g transform="translate(609 434) scale(1.5625)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#F1EEE4" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#F1EEE4" stroke-width="4" stroke-linecap="round"/></g><text x="736" y="493" font-size="36" fill="#F1EEE4" font-weight="700" >MORU NOTE</text><text x="35" y="646" font-size="23" fill="#243d37" font-weight="400" >화면·배율·크기·배경을 적고, 선·틈·글자의 문제와 수정 결과를 남기세요.</text><text x="35" y="694" font-size="21" fill="#243d37" font-weight="400" >이 화면은 모니터 미리보기입니다. 실제 인쇄·재료·색상 교정을 완료한 결과가 아닙니다.</text></svg>