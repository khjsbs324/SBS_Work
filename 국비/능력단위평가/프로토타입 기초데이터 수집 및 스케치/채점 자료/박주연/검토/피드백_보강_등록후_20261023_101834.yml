            - cell [ref=f119e254]:
              - textbox "이곳에 피드백을 입력하세요." [ref=f119e255]: 현재 제출물에서 가장 먼저 정리할 부분은 실제 시안과 보고서 설명의 차이입니다. 브랜드 소개·카테고리의 초안과 수정안 HTML은 모두 제출되어 있지만, 보고서 5~6장과 8장에는 ‘확인 후 보완’, ‘자료 확인 후 작성’, ‘수정 전후 미기재’라는 문장이 남아 있습니다. 화면 자체를 확인할 수 없는 상태는 아니므로, 이미 만든 결과를 보고서에 연결하여 어떤 판단으로 바꿨는지 보여주는 작업이 필요합니다. 카테고리 수정안은 상품을 같은 카드 형식으로 비교하도록 정리했고, 브랜드 소개도 메시지와 설명의 순서를 나누었습니다. 7장의 자체 점검에서는 제품명 아래의 자외선 차단 표시를 단서로 상품을 찾았고, 장바구니·바로구매 버튼의 위치는 찾았지만 반응하지 않았다는 사실을 구분했습니다. 무엇을 보고 판단했는지 적은 기록은 유지하되, 작성자 자신의 점검에서 확인한 범위라는 점을 분명히 하세요. 보고서 5장의 ‘자외선 차단 기능이 있는 베이스 제품 찾기’를 한 개의 완결된 과업으로 정리해 보세요. 상품 목록에서 시작하여 어떤 분류를 고르고, 카드의 어떤 정보를 읽고, 무엇을 확인하면 과업이 끝나는지 화면 번호와 화살표로 표시하면 됩니다. 장바구니나 구매 버튼은 완성된 결제 기능을 구현하기보다 선택했을 때 보여줄 안내와 다음 상태를 주석으로 설명하세요. 버튼이 반응하지 않는다는 기록만으로 끝내면 다음 제작자는 의도적으로 생략한 동작과 아직 결정하지 않은 동작을 구별하기 어렵습니다. 4장의 레퍼런스 표에는 이즈앤트리·투쿨포스쿨의 좌우 배치, 넘버즈인의 히어로, 누메의 카테고리 버튼을 참고했다고 적혀 있습니다. 여기에 각 방식의 장단점과 누니드에서 선택한 이유를 같은 기준으로 덧붙이세요. 예를 들어 브랜드 설명을 이미지 옆에 둘 때 핵심 문장을 빨리 찾을 수 있는지, 긴 설명이 들어가면 어떤 배치가 읽기 쉬운지를 비교할 수 있습니다. 이는 앞으로 확인할 질문이며, 해당 사이트의 실제 사용자 반응을 관찰한 결과처럼 적어서는 안 됩니다. 자료별 확인일과 이용 조건도 함께 정리하세요. 수정 전후 자료는 기존 HTML 두 버전을 활용하세요. 카테고리 분류나 카드 정보가 바뀐 부분을 같은 위치에서 비교하고, 변경한 내용·해결하려는 문제·남겨 둔 사항을 연결하면 됩니다. 다음 자체 점검에서는 시작 화면과 성공 조건을 먼저 정하고, 선택한 순서와 막힌 지점을 남기세요. 다른 점검자에게 같은 과업을 맡길 수 있다면 작성자가 이미 구조를 알고 있다는 영향을 줄이는 데도 도움이 됩니다. 보고서와 원본의 화면 번호를 맞춘 뒤 PDF로 묶어 최종 제출본을 정리하세요. 최종점수는 81점입니다. 새로운 기능을 늘리기보다 이미 제출한 시안의 과업 흐름과 변경 이유를 보고서에 먼저 연결하세요.
