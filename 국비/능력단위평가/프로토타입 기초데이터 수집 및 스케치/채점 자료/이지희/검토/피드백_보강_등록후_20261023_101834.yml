              - textbox "이곳에 피드백을 입력하세요." [ref=f137e255]: WIKETEA는 수정 전후의 설계 결정을 구체적으로 추적할 수 있습니다. 손 스토리보드에서 브랜드 소개의 정보 간소화, 독립 상품 페이지 이동, 레시피 조합 탭, 장바구니 수량 조절의 변화가 보입니다. 보고서 6장과 10장도 이 변화를 초안·수정안 파일에 연결하여, 브랜드를 읽는 흐름과 상품을 고르는 흐름을 어떻게 나누고 다시 연결했는지 설명합니다. 이 구조와 실제 전후 자료는 유지할 강점입니다. 우선 기초데이터의 성격을 일관되게 정리하세요. 3.2절에서는 인증·성능 관련 값을 ‘프로토타입용 시뮬레이션 텍스트·수치’라고 적었지만, 3.3절과 일부 설명에서는 구체적인 수치가 객관적 신뢰를 높이는 근거처럼 읽힙니다. 내부 시안에 적혀 있다는 사실과 외부 원자료로 확인한 사실은 구분해야 합니다. 기획 예시는 해당 표와 관련 화면에서 예시로 표시하고, 실제 확인한 자료만 그 출처와 확인 범위를 연결하세요. 가상 브랜드의 화면 구성은 그대로 설명할 수 있으며, 실제 인증을 새로 받아야 한다는 요구가 아닙니다. 레퍼런스도 시각적으로 참고한 원리와 기능의 효과를 나누면 더 정확해집니다. 예를 들어 조합 탭과 카테고리 필터를 구분한 것은 현재 시안의 설계 결정으로 설명할 수 있습니다. 다만 그 결정이 모든 초보자의 탐색을 빠르게 만든다는 결론은 실제 관찰한 참여자와 과업의 범위 안에서만 적어야 합니다. 출처의 특징, 우리 시안에서 바꾼 점, 그 변경을 확인한 방법을 연결하면 분석과 결과가 섞이지 않습니다. 9.2절에는 참여자 역할, 발언, 도움 여부와 재점검 결과가 기록되어 있습니다. 다만 3명의 결과가 통합된 표 안에 섞여 있어 참여자별 과업이 어떻게 끝났는지 추적하기 어렵습니다. 통합 재점검의 시간 구간은 1분 25초이고, 단계별 설명은 30초·25초·25초이며, 결과에는 평균 80초 이내라고 적혀 있습니다. 이 값이 한 사람의 기록인지, 관찰 구간인지, 세 사람의 평균인지 구분해 주세요. 서로 다른 종류의 값이라면 그 차이를 설명하면 되고, 현재 표만으로 기록을 허위라고 판단할 수는 없습니다. 보완할 때에는 기존 관찰 자료를 참여자별로 나누어 과업의 시작·종료, 완료 여부, 도움, 멈춘 위치를 연결하세요. 자료가 없는 값은 미측정으로 남기고, ‘120초 이내’ 같은 성공 목표와 실제 결과를 별도 칸에 적으면 됩니다. 9.3절의 완료율·시간 단축·오조작 관련 표현도 이 기록으로 설명되는 범위에 맞추세요. 새 테스트를 무조건 늘리기보다 현재 기록의 출처와 집계 방식을 먼저 명확히 하는 것이 우선입니다. 제출 패키지는 보고서 PDF에 손 스케치와 주요 필터·상세·장바구니 상태를 함께 정리하면 더 명확해집니다. 선택한 레시피의 결과에서 전체 상품으로 돌아오는 경로와 장바구니를 닫고 탐색을 이어가는 조건도 같은 화면 번호로 연결하세요. 이는 실제 결제나 외부 주문 전송을 완성하라는 의미가 아니라, 현재 과업의 끝과 복귀를 설명하는 작업입니다. 최종점수는 94점입니다. 기획 수치와 확인된 근거를 구분하고, 참여자별 기록과 집계 결과를 먼저 일치시키세요.
