              - textbox "이곳에 피드백을 입력하세요." [ref=f149e257]: TOP 3의 수정은 요청과 실제 변경이 잘 연결된 사례입니다. 보고서 9.2절의 ‘상품을 더 작게’, ‘여백을 줘’, 제목을 ‘36px 정도’로 바꾸라는 발언이 10장의 카드 폭·간격·제목 크기 변경으로 이어집니다. 수정안에서도 작은 3열 카드와 정돈된 체험 영역을 확인할 수 있어, 받은 의견을 어느 위치에 어떻게 반영했는지 이해하기 쉽습니다. 이 전후 자료를 중심으로 수정 이유를 설명하는 방식은 유지하세요. 다음에는 그 수치가 상품 비교에 어떤 도움이 되었는지 확인하면 좋습니다. 최대 폭 1120px, 카드 간격 24px, 제목 36px은 이번 시안에서 선택한 값이며 그 자체가 사용성의 정답은 아닙니다. 현재 확인 기록은 CSS와 구조가 바뀌었다는 점에 집중되어 있습니다. 세 상품의 용도·규격·가격을 비교할 때 필요한 정보가 함께 보이는지, 카드와 버튼을 쉽게 구분하는지, 제목이 비교 정보를 가리지 않는지를 점검 기준으로 삼아 보세요. 이 효과는 아직 관찰로 확인할 부분입니다. 사용성 점검도 디자인 수정 요청과 과업 수행을 구분해 정리하세요. 9.1절에는 TOP 3 비교, 상품 탐색, 상세·장바구니, 체험 신청이 적혀 있지만 9.2절의 발언은 주로 크기와 여백에 대한 요청입니다. 이를 삭제할 필요는 없으며 시각 검토 의견으로 보존하면 됩니다. 별도로 점검자에게 ‘세안용 상품을 찾아 상세를 확인하고 담기’를 맡겨 어떤 정보를 비교했는지, 선택 전에 망설인 곳은 어디인지, 담기 결과를 알아보았는지 기록하세요. 폼을 실제 전송하거나 결제할 필요는 없습니다. 레퍼런스 비교의 범위도 보완하세요. 4장의 비교 대상은 자체 브랜드 페이지와 초기·수정 컬렉션이어서 내부 개선 과정은 설명하지만, 별도 파일에 적힌 딥디크·르라보를 어떤 기준으로 참고했는지는 충분히 드러나지 않습니다. 두 사례에서 정보의 순서, 이동 수단, 설명과 이미지의 관계를 같은 기준으로 정리하고 플로뜰리에에 적용·변형·제외한 이유를 연결하세요. 실제로 열어 확인한 내용만 쓰고, 원문 이미지나 문구를 사용했다면 출처와 이용 조건도 구분해 적어야 합니다. 보고서 6장의 대안 표는 세로형 대표 카드와 3열 카드, 체험 영역의 다른 구성을 비교하고 있습니다. 기존 초안·수정안에서 같은 부분을 작게 나란히 보여주면 대안의 차이가 더 빨리 읽힙니다. 특히 수정 이유와 이후 확인할 질문을 함께 붙이세요. 그 뒤 점검 결과에 따라 필요한 부분만 다시 고치고 같은 과업을 확인한 내용을 보고서 PDF에 정리하면, 표현 수정에서 실제 사용성 판단으로 이어집니다. 최종점수는 91점입니다. 외부 레퍼런스의 적용 근거와 실제 상품 비교·선택 과업의 관찰을 우선 보완하세요.
