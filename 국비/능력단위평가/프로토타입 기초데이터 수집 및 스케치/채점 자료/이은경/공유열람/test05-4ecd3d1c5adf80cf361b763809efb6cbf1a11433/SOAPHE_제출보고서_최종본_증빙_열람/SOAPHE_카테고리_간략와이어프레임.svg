<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1640" viewBox="0 0 1060 1640"><title>SOAPHE 카테고리 수정 와이어프레임</title><desc>메뉴 이동 목적지, 필터 선택·결과, 단일 상세 팝업 흐름을 반영한 수정 와이어프레임. SVG 도형과 텍스트로 구성. 구현 주석은 화면 밖에 배치.</desc><rect width="1060" height="1640" fill="white"/><text x="40" y="43" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" fill="#252525" text-anchor="start">카테고리 페이지</text><text x="40" y="72" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">수정안 · 필터 결과 예시 / 단일 상세 보기</text><g id="category-header"><rect x="40" y="100" width="420" height="64" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="131" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">SOAPHE</text></g><text x="442" y="129" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" fill="#252525" text-anchor="end">브랜드 소개  |  전체 제품  |  퀴즈</text><g id="category-intro"><rect x="40" y="164" width="420" height="100" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="195" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">전체 컬렉션 소개</text><text x="58" y="221" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">온기를 담는 세 가지 방식</text></g><g id="signature-sets"><rect x="40" y="264" width="420" height="220" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="295" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">소재별 대표 세트 3종</text><text x="58" y="321" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">화강석 · 백자 · 강화유리</text></g><rect x="58" y="340" width="122" height="94" fill="white" stroke="#555" stroke-width="1.4"/><text x="119" y="392" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" fill="#252525" text-anchor="middle">화강석 세트</text><rect x="5