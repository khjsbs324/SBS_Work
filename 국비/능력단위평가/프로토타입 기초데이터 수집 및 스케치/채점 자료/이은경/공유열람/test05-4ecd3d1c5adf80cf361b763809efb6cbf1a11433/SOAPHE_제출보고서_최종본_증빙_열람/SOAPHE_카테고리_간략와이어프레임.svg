rd, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">제품 상세 보기</text><text x="58" y="1362" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">카드 추가 펼침 없이 기본 정보 확인</text><text x="58" y="1388" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">상세 버튼 선택 → 오른쪽 팝업</text><g id="category-footer"><rect x="40" y="1414" width="420" height="100" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="1445" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">푸터</text></g><rect x="284" y="1466" width="158" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="363.0" y="1487" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">메인으로 돌아가기</text><rect x="550" y="100" width="360" height="146" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="564" y="126" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">메뉴·버튼 이동 목적지</text><text x="564" y="154" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">로고 / 메인으로 돌아가기 → 메인 상단</text><text x="564" y="178" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">브랜드 소개 → 브랜드 소개 페이지</text><text x="564" y="202" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">전체 제품 → 카테고리 / 전체 상태</text><text x="564" y="226" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">대표 세트 상세 → 동일한 상세 팝업</text><rect x="550" y="345" width="360" height="170" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="564" y="371" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">공간 필터 구현 주석</text><text x="564" y="399" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">한 제품에 여러 사용 공간 지정 가능</text><text x="564" y="423" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">상품 설명과 공간 태그를 함께 검토</text><text x="564" y="447" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">예: 백자 받침 = 욕실 + 서재</text><text x="564" y="471" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">소재·제품군·공간 조건은 함께 적용</text><text x="564" y="495" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">결과 2개는 수정 방향을 보여주는 예시</text><rect x="550" y="555" width="360" height="98" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="564" y="581" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">초기화 결과</text><text x="564" y="609" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">모든 조건 해제 → 전체 상품 25개</text><text x="564" y="633" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">전체 탭 선택 / 결과 수 함께 갱신</text><text x="550" y="790" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="22" fill="#252525" text-anchor="start">상품 상세 팝업</text><rect x="550" y="810" width="360" height="355" fill="white" stroke="#555" stroke-width="1.4"/><text x="568" y="843" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="19" fill="#252525" text-anchor="start">선택한 제품명</text><rect x="832" y="822" width="60" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="862.0" y="843" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">닫기</text><rect x="568" y="868" width="324" height="100" fill="#F5F5F5" stroke="#555" stroke-width="1.4"/><text x="730" y="926" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" fill="#777" text-anchor="middle">제품 이미지</text><text x="568" y="1004" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" fill="#252525" text-anchor="start">소재 · 규격 · 추천 공간</text><text x="568" y="1038" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" fill="#252525" text-anchor="start">제품 설명 / 설계 특징</text><text x="568" y="1072" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="15" fill="#252525" text-anchor="start">비누 사용 후 두 번째 쓰임</text><text x="568" y="1136" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">닫기 / ESC → 기존 목록으로 복귀</text><polyline points="232,1292 244,1292 244,1334 510,1334 510,852 550,852" fill="none" stroke="#555" stroke-width="1.5"/><path d="M 541.0 856.0 L 550 852 L 541.0 848.0" fill="none" stroke="#555" stroke-width="1.5"/><rect x="550" y="1220" width="360" height="122" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="564" y="1246" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">닫기 동작</text><text x="564" y="1274" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">선택 조건과 목록 위치 유지</text><text x="564" y="1298" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">열었던 상세 버튼으로 포커스 복귀</text><text x="564" y="1322" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">상품 카드 자체에는 펼침 동작 없음</text><text x="40" y="1595" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">필터 결과는 개선안 예시이며 실제 데이터 반영 후 검증 필요</text></svg>