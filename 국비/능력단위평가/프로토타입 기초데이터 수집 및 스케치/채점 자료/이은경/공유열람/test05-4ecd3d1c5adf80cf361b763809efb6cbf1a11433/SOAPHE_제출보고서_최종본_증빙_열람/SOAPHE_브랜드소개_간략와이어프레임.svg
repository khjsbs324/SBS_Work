-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">05  두 번째 쓰임</text><text x="58" y="975" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">욕실 → 현관 · 서재 · 파우더룸</text></g><text x="58" y="1014" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" fill="#777" text-anchor="start">비누 받침 / 생활 트레이 비교</text><g id="gifting"><rect x="40" y="1048" width="420" height="110" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="1079" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">06  선물</text><text x="58" y="1105" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">GIVE → USE → STAY</text></g><rect x="58" y="1114" width="166" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="141.0" y="1135" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">선물 구성하기</text><rect x="530" y="1052" width="360" height="98" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="544" y="1078" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">이동 목적지</text><text x="544" y="1106" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">브랜드 소개 안에서 팝업 열기</text><text x="544" y="1130" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">비누 1개 + 받침 1개 직접 선택</text><polyline points="224,1130 500,1130 530,1101" fill="none" stroke="#555" stroke-width="1.5"/><path d="M 526.309193002948 1110.1311523758238 L 530 1101 L 520.7490162281681 1104.3792453674307" fill="none" stroke="#555" stroke-width="1.5"/><g id="collection"><rect x="40" y="1158" width="420" height="120" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="1189" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">컬렉션 / 사용 모습</text></g><rect x="58" y="1213" width="176" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="146.0" y="1234" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">SOAPHE 컬렉션 보기</text><rect x="288" y="1213" width="154" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="365.0" y="1234" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">실제 사용 모습 보기</text><rect x="530" y="1166" width="360" height="98" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="544" y="1192" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">이동 목적지</text><text x="544" y="1220" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">컬렉션 보기 → 카테고리 전체</text><text x="544" y="1244" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">실제 사용 모습 → 사용 후기 페이지</text><polyline points="234,1230 242,1230 242,1262 500,1262 530,1223" fill="none" stroke="#555" stroke-width="1.5"/><path d="M 527.6830991087712 1232.57245894534 L 530 1223 L 521.3421071959343 1227.6947728585426" fill="none" stroke="#555" stroke-width="1.5"/><g id="footer"><rect x="40" y="1278" width="420" height="74" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="1309" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">푸터</text></g><rect x="530" y="100" width="360" height="146" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="544" y="126" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">공통 메뉴 연결 주석</text><text x="544" y="154" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">로고 → 메인 페이지 상단</text><text x="544" y="178" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">브랜드 소개 → 현재 소개 페이지 상단</text><text x="544" y="202" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">전체 제품 → 카테고리 / 전체 상품</text><text x="544" y="226" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">퀴즈 → 메인 페이지의 맞춤 퀴즈</text><rect x="530" y="310" width="360" height="146" fill="#FAFAFA" stroke="#555" stroke-width="1.4" stroke-dasharray="5 4"/><text x="544" y="336" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525" text-anchor="start">섹션 이동 주석</text><text x="544" y="364" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">챕터 메뉴 → 소개 안의 해당 섹션</text><text x="544" y="388" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">이야기 읽기 → 01 탄생 배경</text><text x="544" y="412" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">공통 메뉴의 비누·공간·선물 항목은</text><text x="544" y="436" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#555" text-anchor="start">메인 페이지의 해당 섹션으로 연결</text><text x="40" y="1547" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">박스: 화면 구성 / 점선 박스: 구현·이동 주석</text><g id="gift-builder-flow"><text x="990" y="72" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#252525">W-07 / S-07 · 선물 구성 팝업</text><rect x="990" y="100" width="450" height="920" fill="white" stroke="#555" stroke-width="1.4"/><text x="1010" y="136" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="21" fill="#252525">마음을 담아, 선물 구성하기</text><text x="1360" y="135" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">닫기 ×</text><text x="1010" y="168" font-family="Pretendard, Noto Sans KR, sans-serif" 