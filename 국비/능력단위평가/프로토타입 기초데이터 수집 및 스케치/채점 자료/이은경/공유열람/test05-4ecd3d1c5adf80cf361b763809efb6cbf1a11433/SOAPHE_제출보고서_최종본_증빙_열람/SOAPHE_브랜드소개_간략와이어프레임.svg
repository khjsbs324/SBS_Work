<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1590" viewBox="0 0 1480 1590"><title>SOAPHE 브랜드 소개 수정 와이어프레임</title><desc>선물 구성 버튼, 비누·받침 선택 팝업, 요약·저장·초기화·닫기 흐름을 반영한 수정 와이어프레임. SVG 도형과 텍스트로 구성. 구현 주석은 화면 밖에 배치.</desc><rect width="1480" height="1590" fill="white"/><text x="40" y="43" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="26" fill="#252525" text-anchor="start">브랜드 소개 페이지</text><text x="40" y="72" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">수정안 v0.3 · 메뉴 목적지와 선물 구성 팝업 흐름</text><g id="brand-header"><rect x="40" y="100" width="420" height="64" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="131" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">SOAPHE</text></g><text x="442" y="129" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="12" fill="#252525" text-anchor="end">브랜드 소개  |  전체 제품  |  퀴즈</text><g id="chapter-menu"><rect x="40" y="164" width="420" height="44" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="195" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="start">철학 · 탄생 · 설계 · 소재 · 두 번째 쓰임 · 선물</text></g><g id="philosophy"><rect x="40" y="208" width="420" height="150" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="239" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">철학 / 브랜드 메시지</text><text x="58" y="265" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">사라지는 비누와 오래 머무는 오브제</text></g><text x="58" y="298" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" fill="#777" text-anchor="start">비누 / 오브제 대비 이미지</text><rect x="58" y="313" width="152" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="134.0" y="334" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">브랜드 이야기 읽기</text><g id="origin"><rect x="40" y="358" width="420" height="130" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="389" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">01  탄생 배경</text><text x="58" y="415" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">물 고임 · 비누의 무름 · 버려지는 받침</text></g><text x="58" y="456" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" fill="#777" text-anchor="start">문제 설명 / 사용 전후 비교</text><g id="design"><rect x="40" y="488" width="420" height="150" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="519" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">02  기능 설계</text><text x="58" y="545" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">접점 · 배수 · 마감</text></g><text x="58" y="581" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="14" fill="#777" text-anchor="start">구조도 / 단면도</text><text x="58" y="613" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#777" text-anchor="start">형태 설계 → 제작 → 마감 → 검수</text><g id="materials"><rect x="40" y="638" width="420" height="170" fill="white" stroke="#555" stroke-width="1.4"/><text x="58" y="669" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="20" fill="#252525" text-anchor="start">03  소재</text><text x="58" y="695" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#666" text-anchor="start">화강석 · 백자 · 강화유리</text></g><rect x="58" y="714" width="122" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="119.0" y="735" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525" text-anchor="middle">화강석</text><rect x="188" y="714" width="122" height="32" fill="white" stroke="#555" stroke-width="1.4"/><text x="249.0" y="735" font-family="Pretendard, 