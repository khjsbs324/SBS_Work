소개 위치 복귀</text><rect x="990" y="1052" width="450" height="204" fill="#fafafa" stroke="#555" stroke-width="1.4"/><text x="1010" y="1080" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="16" fill="#252525">선물 흐름 구현 주석</text><text x="1010" y="1110" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">버튼 → 팝업 → 제품 선택 → 요약 갱신</text><text x="1010" y="1137" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">저장: 필수 선택 검사 → 브라우저 로컬 저장</text><text x="1010" y="1164" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">재방문: 저장 구성 복원 / 초기화: 선택·저장 삭제</text><text x="1010" y="1191" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">닫기: 팝업 종료 후 열었던 버튼으로 초점 복귀</text><text x="1010" y="1218" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="13" fill="#252525">선택 예시이며 주문·결제 화면은 포함하지 않음</text><polyline points="890,1101 950,1101 950,115 990,115" fill="none" stroke="#555" stroke-width="1.5"/><path d="M980 110 L990 115 L980 120" fill="none" stroke="#555" stroke-width="1.5"/></g></svg>