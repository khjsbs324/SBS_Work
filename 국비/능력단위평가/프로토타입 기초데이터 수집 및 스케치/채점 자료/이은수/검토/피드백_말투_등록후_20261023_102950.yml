              - textbox "이곳에 피드백을 입력하세요." [ref=f207e255]: 손그림 3장에서 상시 노출 필터와 서랍형 필터를 나란히 비교하여 설계 판단을 보여준 점이 좋았습니다. 필터가 상품 목록을 아래로 밀어내는 문제를 적고, 상품을 먼저 보게 하려고 필터를 옮긴 이유를 수정안에 연결한 점도 적절했습니다. 1~2장에서는 브랜드의 마패 구분에서 상품 목록·장바구니·상세 확인으로 이어지는 흐름을, 4장에서는 진단과 추천의 연결을 보여주어 각 화면의 역할도 파악할 수 있습니다. 이제 확인할 핵심은 서랍형 필터가 있다는 사실보다 사용자가 그 적용 방식을 이해하는지입니다. 보고서 7.2절과 9.2절에 따르면 조건 선택은 즉시 목록에 반영되고, ‘상품 보기’는 서랍을 닫는 동작입니다. 방문자는 이 문구를 보고 마지막에 눌러야 조건이 적용된다고 생각할 수도 있습니다. 이는 아직 확인하지 않은 해석이므로, 점검에서 어떤 의미로 받아들이는지 살펴보면 설계 의도를 더 정확하게 확인할 수 있을 것입니다. 같은 동작을 유지한다면 닫기 역할이 드러나는 문구나 선택 즉시 반영된다는 안내로 설명을 맞추는 방법을 검토할 수 있습니다. 9장에는 참여자 모집과 과업 수행 관찰이 예정으로 적혀 있고, 현재 기록은 스케치·코드 대조입니다. 점검자에게 향이나 사용 상황에 맞는 상품 하나를 찾도록 요청하고, 필터 버튼을 처음 찾은 위치, 조건을 고른 순서, 결과 수를 확인한 시점, 도움을 요청한 지점을 기록하면 실제 탐색 과정에서 보완할 부분이 드러날 것입니다. 이후 조건에 맞는 상품이 없는 상황을 제시해 초기화 방법을 스스로 찾는지도 확인하면 됩니다. 측정하지 않은 시간이나 성공률을 만들어 적기보다 실제 선택과 발언을 남기면 판단의 근거가 더 명확해질 것 같습니다. 수정 전후는 손그림 3장의 같은 필터 영역을 기준으로 묶으면 변경한 내용을 비교하기 쉬울 것 같습니다. 수정 전의 상시 필터, 수정 후의 목록과 필터 버튼, 열린 서랍과 선택 상태를 연결하고 무엇을 유지·이동했는지 적으면 필터를 옮긴 이유도 더 잘 전달될 것입니다. 점검 후 변경이 필요했다면 그 위치만 고쳐 같은 과업으로 다시 확인하면 수정의 효과를 설명하는 데 도움이 될 것입니다. 브랜드·진단 등 다른 화면도 실제로 검토한 대안과 최종 결정의 이유를 짧게 연결하되, 모든 기능을 새로 만드는 방향으로 범위를 늘릴 필요는 없습니다. 마무리에서는 보고서 11장의 원본 파일명과 실제 동봉명을 일치시키고, 보고서와 손그림·시안에 같은 화면 번호를 붙이면 자료를 이어서 확인하기 쉬울 것입니다. 보고서 PDF에는 작은 손글씨가 읽히도록 그림을 배치하고, 기본 목록·필터 열림·선택 결과·결과 없음의 관계가 한 흐름으로 보이는지 확인하면 인계가 쉬워집니다. 최종점수는 90점입니다. 필터를 찾는 과정과 적용 시점을 어떻게 이해하는지 먼저 점검하고, 그 결과를 현재의 전후 비교에 연결하면 설계의 근거가 더욱 분명해질 것 같습니다. 고생하셨습니다.
