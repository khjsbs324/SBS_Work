<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모나미</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="head_top">
      <div class="head_left">
        <div class="top_language_btn">
          <div class="lang_btn">
            <div class="lang_btn_image">
              <img src="./image/icon/lang_kor.gif" alt="국기">
            </div>
            <span>KOR</span>
            <span class="arrow material-symbols-outlined">keyboard_arrow_down</span>
          </div>
        </div>
        <div class="top_sns">
          <img src="./image/icon/sns_facebook.gif" alt="페이스북">
          <img src="./image/icon/sns_insta.gif" alt="인스타그램">
          <img src="./image/icon/sns_youtube.png" alt="유튜브">
        </div>
      </div>
      <div class="top_utility">
        <nav>
          <ul>
            <li>HOME</li>
            <li>SITE MAP</li>
            <li>CONTACT US</li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="main_banner">
      <img src="./image/banner/visual1.jpg" alt="배너이미지">
    </div>
    <div class="products">
      <div class="con products_con">
        <div class="product_head">
          <h2 class="product_title">BEST PRODUCT</h2>
          <p class="product_desc">언제 어디서나 생활 속에 함께하는 모나미</p>
        </div>
        <div class="product_tabs">
          <div id="actions" class="actions">
            <div class="ac-tab_premium">
              <span class="tab_premium">프리미엄 펜</span>
            </div>
            <div class="ac-tab_pen">
              <span class="tab_pen">펜·펜슬</span>
            </div>
            <div class="ac-tab_coloring">
              <span class="tab_coloring">마카·컬러링</span>
            </div>
            <div class="ac-tab_officen">
              <span class="tab_office">노트·사무용품</span>
            </div>
          </div>
        </div>
        <div class="product_list">
          <div class="product_list_image">
            <ul>
              <li>
                <img src="./image/list/product-01.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-02.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-03.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-04.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-05.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-06.jpg" alt="상품이미지">
              </li>
              <li>
                <img src="./image/list/product-07.jpg" alt="상품이미지">
              </li>
            </ul>
          </div>
        </div>
        <div class="product_scroll"></div>
      </div>
    </div>
  </header>
</body>
</html>
