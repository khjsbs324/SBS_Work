<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1차_모나미</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="head_top">
    <div class="conwrap">
      <div class="links">
        <div class="lang">
          <img src="./image/lang_kor.png" alt="한국어">
          <span>KOR</span>
        </div>
        <div class="sns">
          <ul>
            <li><img src="./image/sns_facebook.png" alt="페이스북"></li>
            <li><img src="./image/sns_insta.png" alt="인스타그램"></li>
            <li><img src="./image/sns_youtube.png" alt="유투브"></li>
          </ul> <!-- 여백을 주기 위해서 ul > li으로 묶음! -->
        </div>
      </div>
      <div class="topmenu">
        <ul>
          <li>HOME</li>
          <li>SITE MAP</li>
          <li>CONTACT US</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="category">
    <img class="logo" src="./image/logo.jpg" alt="모나미 로고">
    <ul>
      <li>모나미소개</li>
      <li>모나미제품</li>
      <li>NEWS＆VIDEO</li>
      <li>브랜드스토어</li>
      <li>모나미 미술대회</li>
      <li>고객지원</li>
      <li>기업 구매/개발</li>
    </ul>
    <div class="search">
      <img src="./image/btn_search.jpg" alt="검색">
      <img src="./image/btn_all.jpg" alt="전체 카테고리">
    </div>
  </div>
  <div class="bgarea">
    <img src="./image/visual1.jpg" alt="배너">
  </div>
  <div class="new">
    <div class="con">
      <div class="toparea">
        <div class="left">
          <div class="tit">
            <h2>NEW<br>ARRIVALS</h2> <!-- br은 줄바꿈 태그 -->
            <p>가장 먼저 만나는 설레는 기다림</p>
            <!-- 사이트에서는 p태그 사용. p태그는 문단, 하나의 문장이나 문단을 담을 때 사용 -->
          </div>
          <div class="image1">
            <img src="./image/new1.jpg" alt="new1">
          </div>
        </div>
        <div class="image2">
          <img src="./image/new2.jpg" alt="new2">
        </div>
      </div>
      <div class="btmarea">
        <img src="./image/new3.jpg" alt="new3">
        <img src="./image/new4.jpg" alt="new4">
        <img src="./image/new5.jpg" alt="new5">
      </div>
    </div>
    <div class="product"></div>
  </div>
</body>
</html>
