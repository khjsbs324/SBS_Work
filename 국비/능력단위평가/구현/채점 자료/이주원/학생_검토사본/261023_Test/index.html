<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험(모나미 메인페이지)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="head-top">
            <div class="conwrap">
                <div class="social-links">
                    <div class="lang-but">
                        <img src="./image/icon/lang_kor.gif" alt="태극기">
                        <span class="lang-ko">KOR</span>
                        <span class="head-icon material-symbols-outlined">stat_minus_1</span>
                    </div>
                    <div class="img-con">
                        <img src="./image/icon/sns_facebook.gif" alt="페이스북 아이콘">
                        <img src="./image/icon/sns_insta.gif" alt="인스타그램 아이콘">
                        <img src="./image/icon/sns_youtube.png" alt="유튜브 아이콘">
                    </div>
                </div>
                <div class="head-nav">
                    <nav>
                        <ul>
                            <li>HOME</li>
                            <li>SITE MAP</li>
                            <li>CONTACT US</li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <div class="top-line">
        </div>
        <div class="main-nav">
            <div class="m-nav-inner">
                <div class="main-logo">
                    <img src="./image/icon/logo.jpg" alt="모나미 로고">
                </div>
                <div class="m-nav-list">
                   <div class="list-con">
                    <span>모나미소개</span>
                   </div>
                   <div class="list-con">
                    <span>모나미제품</span>
                   </div>
                   <div class="list-con">
                    <span>NEWS & VIDEO</span>
                   </div>
                   <div class="list-con">
                    <span>브랜드스토어</span>
                   </div>
                   <div class="list-con">
                    <span>모나미 미술대회</span>
                   </div>
                   <div class="list-con">
                    <span>고객지원</span>
                   </div>
                   <div class="list-con">
                    <span>기업 구매 / 개발</span>
                   </div>

                </div>
                <div class="serch">
                    <span class="search-icon material-symbols-outlined">search</span>
                    <span class="menu-icon material-symbols-outlined">menu</span>
                </div>
            </div>
        
        </div>
        <div class="bot-line"></div>
    </header>
    <main>
        <div class="new-arrivals">
            <div class="top-area">
                <div class="top-products-left">
                    <div class="section-title">
                        <h2>NEW<br>ARRIVALS
                        </h2>
                        <div class="title-bg"></div>
                        <p>가장 먼저 만나는 설레는 기다림</p>
                    </div>
                    <div class="top-product-l">
                        <img src="./image/products/file1_1699945409grwui60w6u.jpg" alt="볼펜">
                    </div>
                </div>
                <div class="top-products-right">
                    <div class="top-products-r">
                        <img src="./image/products/file1_169994521784nzg4whv7.jpg" alt="다이어리">
                    </div>
                </div>
            </div>
            <div class="bot-area">
                <div class="bot-img">
                    <div class="bot-img-con">
                        <img src="./image/products/file1_1715318030bhfwnjum09.jpg" alt="볼펜과필통">
                    </div>
                    <div class="bot-img-con">
                        <img src="./image/products/file1_1681087061mb8i5l6zdx.jpg" alt="만년필">
                    </div>
                    <div class="bot-img-con">
                        <img src="./image/products/file1_1715319042z7nuju2l3p.jpg" alt="볼펜묶음">
                    </div>
                </div>
            </div>
           
        </div>
    </main>
    
</body>
</html>
