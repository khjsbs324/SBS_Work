<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../image/logo.jpg">
  <title>MONAMI | MON-02 비주얼</title>
  <!-- UIUXB_2610의 HTML/CSS 수업 예제를 참고한 모나미 데스크톱 학습용 정답 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============================================================
  MON-02 시작: 메인 비주얼
  참고: 마켓컬리 banner의 대표 이미지 영역 + 제목·설명 패턴
  협업: 사진은 CSS .hero에서 연결합니다. 사진을 바꾸면 글자 대비를 확인합니다.
  배치: 사진과 문구를 absolute로 겹치지 않고 배경 + 내부 Flex로 구성합니다.
  폭: 1400px 컨테이너, 문구 왼쪽 여백 120px, 전체 높이 652px
============================================================ -->
<div id="MON-02" class="hero">
  <div class="con hero-con">
    <div class="hero-copy">
      <div class="hero-title">
        <p>어쩌면 삶은</p><p>인생이라는 종이 위에</p>
        <p>써 내려가는</p><p>펜의 기록 같습니다.</p>
      </div>
      <div class="hero-desc">
        <p>그중에서도 지우고 싶지 않은 기록이 있습니다.</p>
        <p>모나미는 언제나 당신의 행복한 기록과 함께 합니다.</p>
      </div>
    </div>
  </div>
</div>
<!-- MON-02 끝 -->
</body>
</html>
