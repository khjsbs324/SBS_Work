<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구현 보완학습 · 독립 연습 예제</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">HTML · CSS 실습실</header>
  <main>
    <section class="practice-section" aria-label="도서 카드 연습">
      <div class="section-heading"><h1>추천 도서</h1><a href="#book-list">목록 확인</a></div>
      <div class="book-list" id="book-list"><!-- 도서 카드 1: 이미지와 정보가 같은 카드 안에 있습니다. -->
<article class="book-card">
  <img class="book-cover" src="../images/book-01.svg" alt="작은 기록의 시작 표지" />
  <h2 class="book-title">작은 기록의 시작</h2>
  <p class="book-desc">구조와 스타일을 연습하는 교육용 도서 카드입니다.</p>
  <div class="book-meta">
    <span class="book-price">12,000원</span>
    <p class="book-options"><span class="is-selected">종이책</span><span>전자책</span></p>
  </div>
  <button type="button" class="practice-button">선택하기 · 태그 연습</button>
</article></div>
    </section>
  </main>
  <footer class="site-footer">교육용 가상 도서·가격입니다. 버튼은 태그·표시·키보드 초점 연습용이며 구매나 선택 상태 변경 기능은 연결하지 않았습니다.</footer>
</body>
</html>
