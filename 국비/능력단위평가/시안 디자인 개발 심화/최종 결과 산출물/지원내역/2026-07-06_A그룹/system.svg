<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="730" viewBox="0 0 1160 730" font-family="Malgun Gothic, sans-serif"><rect x="0" y="0" width="1160" height="730" rx="0" fill="#f2f6fb"/><text x="35" y="57" font-size="33" fill="#243d37" font-weight="700" >기본형·색·글자의 역할을 실제로 보여 주세요.</text><rect x="35" y="89" width="1090" height="150" rx="12" fill="#F1EEE4"/><g transform="translate(66 125) scale(1.16)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="165.84" y="167.24" font-size="37.12" fill="#234B43" font-weight="700" >MORU NOTE</text><text x="167.12" y="196.68" font-size="16.64" fill="#234B43" font-weight="400" >정돈된 기록, 다음 생각의 시작</text><rect x="35" y="275" width="256" height="78" rx="8" fill="#234B43"/><text x="43" y="390" font-size="23" fill="#243d37" font-weight="700" >기본·브랜드</text><text x="43" y="426" font-size="21" fill="#243d37" font-weight="400" >#234B43</text><text x="43" y="464" font-size="21" fill="#243d37" font-weight="400" >로고·주요 형태</text><rect x="317" y="275" width="256" height="78" rx="8" fill="#F1EEE4"/><text x="325" y="390" font-size="23" fill="#243d37" font-weight="700" >배경</text><text x="325" y="426" font-size="21" fill="#243d37" font-weight="400" >#F1EEE4</text><text x="325" y="464" font-size="21" fill="#243d37" font-weight="400" >종이 느낌의 바탕</text><rect x="599" y="275" width="256" height="78" rx="8" fill="#D69C4A"/><text x="607" y="390" font-size="23" fill="#243d37" font-weight="700" >강조</text><text x="607" y="426" font-size="21" fill="#243d37" font-weight="400" >#D69C4A</text><text x="607" y="464" font-size="21" fill="#243d37" font-weight="400" >제한된 정보 강조</text><rect x="881" y="275" width="256" height="78" rx="8" fill="#1C2D29"/><text x="889" y="390" font-size="23" fill="#243d37" font-weight="700" >본문</text><text x="889" y="426" font-size="21" fill="#243d37" font-weight="400" >#1C2D29</text><text x="889" y="464" font-size="21" fill="#243d37" font-weight="400" >읽기 위한 글자</text><text x="43" y="535" font-size="37" fill="#243d37" font-weight="700" >정돈된 기록의 첫 문장</text><text x="43" y="581" font-size="25" fill="#243d37" font-weight="400" >제목은 먼저 읽히고, 설명은 다음 순서로 이어집니다.</text><text x="43" y="626" font-size="22" fill="#243d37" font-weight="400" >MORU NOTE  0123456789  /  한글·영문·숫자 확인</text><text x="43" y="687" font-size="21" fill="#243d37" font-weight="400" >예시 서체: 시스템의 Malgun Gothic 계열. 폰트 프로그램은 포함하지 않습니다.</text></svg>