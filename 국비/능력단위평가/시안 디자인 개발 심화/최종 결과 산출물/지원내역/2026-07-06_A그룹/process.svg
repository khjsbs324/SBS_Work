<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="670" viewBox="0 0 1160 670" font-family="Malgun Gothic, sans-serif"><rect x="0" y="0" width="1160" height="670" rx="0" fill="#f2f6fb"/><text x="35" y="60" font-size="33" fill="#243d37" font-weight="700" >자료의 모양보다 선택의 이유를 연결하세요.</text><rect x="35" y="115" width="256" height="437" rx="14" fill="#dceafb"/><text x="53" y="158" font-size="24" fill="#243d37" font-weight="700" >01 가상 브리프</text><text x="53" y="205" font-size="22" fill="#243d37" font-weight="400" >정돈된 기록</text><text x="53" y="248" font-size="22" fill="#243d37" font-weight="400" >다시 찾기 쉬움</text><rect x="63" y="333" width="197" height="6" rx="3" fill="#527a70"/><rect x="63" y="375" width="197" height="6" rx="3" fill="#527a70"/><rect x="63" y="417" width="197" height="6" rx="3" fill="#527a70"/><rect x="317" y="115" width="256" height="437" rx="14" fill="#dcefe5"/><text x="335" y="158" font-size="24" fill="#243d37" font-weight="700" >02 관찰·추출</text><text x="335" y="205" font-size="22" fill="#243d37" font-weight="400" >반복되는 간격</text><text x="335" y="248" font-size="22" fill="#243d37" font-weight="400" >둥근 연결과 여백</text><rect x="345" y="323" width="197" height="30" rx="9" fill="none" stroke="#527a70"/><rect x="345" y="370" width="197" height="30" rx="9" fill="none" stroke="#527a70"/><rect x="345" y="417" width="197" height="30" rx="9" fill="none" stroke="#527a70"/><rect x="599" y="115" width="256" height="437" rx="14" fill="#fff0cf"/><text x="617" y="158" font-size="24" fill="#243d37" font-weight="700" >03 조형 규칙</text><text x="617" y="205" font-size="22" fill="#243d37" font-weight="400" >두 흐름의 리듬</text><text x="617" y="248" font-size="22" fill="#243d37" font-weight="400" >읽히는 이름·설명</text><g transform="translate(670 325) scale(1.71875)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><rect x="881" y="115" width="256" height="437" rx="14" fill="#e9e2f7"/><text x="899" y="158" font-size="24" fill="#243d37" font-weight="700" >04 기본 시안</text><text x="899" y="205" font-size="22" fill="#243d37" font-weight="400" >심볼 + 브랜드명</text><text x="899" y="248" font-size="22" fill="#243d37" font-weight="400" >역할별 정보 위계</text><g transform="translate(972 313) scale(1.125)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="908" y="438" font-size="28" fill="#243d37" font-weight="700" >MORU NOTE</text><text x="35" y="602" font-size="23" fill="#243d37" font-weight="400" >별도 제작한 설명용 예시입니다. 실제 자료·시안의 선택 이유는 직접 작성하세요.</text><text x="35" y="642" font-size="21" fill="#243d37" font-weight="400" >색·크기·형태는 정답이 아니라 비교·전환 과정을 보여 주는 연습 조건입니다.</text></svg>