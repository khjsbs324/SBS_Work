<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" font-family="Malgun Gothic, sans-serif"><rect x="0" y="0" width="1160" height="780" rx="0" fill="#f2f6fb"/><text x="35" y="57" font-size="33" fill="#243d37" font-weight="700" >같은 콘셉트, 매체에 맞게 달라지는 배치</text><text x="35" y="105" font-size="25" fill="#243d37" font-weight="700" >세로형 포스터</text><rect x="35" y="125" width="315" height="506" rx="8" fill="#F1EEE4" stroke="#c5d5d0"/><g transform="translate(65 158) scale(0.765625)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="65" y="252" font-size="31" fill="#243d37" font-weight="700" >한 장의 기록,</text><text x="65" y="301" font-size="27" fill="#243d37" font-weight="700" >다음 생각의 시작.</text><g transform="translate(128 362) scale(1.953125)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="65" y="570" font-size="30" fill="#243d37" font-weight="700" >MORU NOTE</text><text x="420" y="105" font-size="25" fill="#243d37" font-weight="700" >정사각형 콘텐츠</text><rect x="420" y="125" width="315" height="315" rx="8" fill="#234B43"/><g transform="translate(531 151) scale(1.46875)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#F1EEE4" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#F1EEE4" stroke-width="4" stroke-linecap="round"/></g><text x="578" y="289" font-size="28" fill="#F1EEE4" font-weight="700" text-anchor="middle">MORU NOTE</text><text x="578" y="344" font-size="26" fill="#F1EEE4" font-weight="400" text-anchor="middle">정돈된 기록</text><rect x="528" y="375" width="100" height="6" rx="3" fill="#D69C4A"/><text x="802" y="105" font-size="25" fill="#243d37" font-weight="700" >라벨 정면</text><rect x="802" y="125" width="323" height="200" rx="8" fill="#F1EEE4" stroke="#c5d5d0"/><g transform="translate(823 145) scale(0.796875)"><path d="M8 48V24Q8 10 20 10Q32 10 32 24V48M32 48V24Q32 10 44 10Q56 10 56 24V48" fill="none" stroke="#234B43" stroke-width="7" stroke-linecap="round"/><path d="M8 58H56" fill="none" stroke="#234B43" stroke-width="4" stroke-linecap="round"/></g><text x="889" y="181" font-size="25" fill="#243d37" font-weight="700" >MORU NOTE</text><text x="824" y="236" font-size="25" fill="#243d37" font-weight="700" >기록 노트</text><text x="824" y="282" font-size="19" fill="#243d37" font-weight="400" >이름·용도·설명의 순서</text><text x="420" y="490" font-size="23" fill="#243d37" font-weight="700" >유지: 핵심 형태·이름·색의 역할</text><text x="420" y="541" font-size="23" fill="#243d37" font-weight="400" >변경: 비율·위치·크기·줄바꿈</text><text x="420" y="591" font-size="23" fill="#243d37" font-weight="400" >확인: 실제 문구·정보량·사용 조건</text><text x="35" y="707" font-size="24" fill="#243d37" font-weight="400" >설명용 평면 시안입니다. 인쇄 완성품·패키지 제작 도면이 아닙니다.</text><text x="35" y="751" font-size="22" fill="#243d37" font-weight="400" >다른 비율로 단순히 늘이지 말고, 무엇을 유지·조정했는지 비교하세요.</text></svg>