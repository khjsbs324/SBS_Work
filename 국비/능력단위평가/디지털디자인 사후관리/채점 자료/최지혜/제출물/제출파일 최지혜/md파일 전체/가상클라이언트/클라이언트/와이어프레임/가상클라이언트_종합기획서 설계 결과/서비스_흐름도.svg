<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1380" width="100%" height="100%">
  <defs>
    <filter id="flow-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1F3327" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="start-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3327"/>
      <stop offset="100%" stop-color="#2D4D3A"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5A4232"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #FBF9F5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 26px; font-weight: 800; fill: #1F3327; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 14px; fill: #5A4232; }
    
    .node-start { fill: url(#start-grad); stroke: #1F3327; stroke-width: 2; rx: 25; filter: url(#flow-shadow); }
    .node-proc { fill: #FFFFFF; stroke: #1F3327; stroke-width: 1.5; rx: 8; filter: url(#flow-shadow); }
    .node-modal { fill: #FFFDF9; stroke: #C47A5A; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 8; filter: url(#flow-shadow); }
    .node-dec { fill: #FFF8F0; stroke: #D9822B; stroke-width: 2; filter: url(#flow-shadow); }
    .node-success { fill: #EBF4EE; stroke: #2E6945; stroke-width: 2; rx: 8; filter: url(#flow-shadow); }
    .node-refund { fill: #FDF0F0; stroke: #D9383A; stroke-width: 1.5; rx: 8; filter: url(#flow-shadow); }
    
    .text-start { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 13px; font-weight: bold; fill: #1F3327; text-anchor: middle; }
    .text-code { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 11px; font-weight: bold; fill: #C47A5A; text-anchor: middle; }
    .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 11px; fill: #555555; text-anchor: middle; }
    .text-dec { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 12px; font-weight: bold; fill: #995200; text-anchor: middle; }
    .text-branch { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 11px; font-weight: bold; fill: #5A4232; text-anchor: middle; }
    
    .flow-line { stroke: #5A4232; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
    .section-border { fill: none; stroke: #D8D2C4; stroke-dasharray: 6 6; stroke-width: 1.5; rx: 12; }
    .section-label { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Noto Sans KR", sans-serif; font-size: 13px; font-weight: bold; fill: #1F3327; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1300" height="1380" />

  <!-- Title Section -->
  <text x="650" y="45" class="title" text-anchor="middle">플로뜰리에 (Flottelier) 서비스 흐름도 (Service Flowchart)</text>
  <text x="650" y="70" class="subtitle" text-anchor="middle">초민감성 안심 검증 ➔ 1장 체험팩 &amp; 완전 정련 ➔ 1-Click 평생 재구매 &amp; 에코 루프 여정</text>

  <!-- ==================== 1. START NODE ==================== -->
  <g transform="translate(490, 100)">
    <rect class="node-start" width="320" height="46" />
    <text x="160" y="28" class="text-start">● 서비스 시작 (광고 / 검색 / 29CM / SNS)</text>
  </g>
  <path class="flow-line" d="M 650 146 L 650 180" />

  <!-- ==================== 2. MAIN LANDING (P-01) ==================== -->
  <g transform="translate(480, 180)">
    <rect class="node-proc" width="340" height="64" />
    <text x="170" y="22" class="text-code">P-01 | 메인페이지 진입</text>
    <text x="170" y="40" class="text-title">더마테스트 엑설런트 뱃지 &amp; 4대 리추얼 확인</text>
    <text x="170" y="55" class="text-desc">캔버스 질감 &amp; 수채화 몽환 무드</text>
  </g>
  <path class="flow-line" d="M 650 244 L 650 280" />

  <!-- ==================== 3. CERT DECISION ==================== -->
  <g transform="translate(560, 280)">
    <polygon points="90,0 180,45 90,90 0,45" class="node-dec" />
    <text x="90" y="42" class="text-dec">공인 성적서</text>
    <text x="90" y="56" class="text-dec">검증 여부?</text>
  </g>

  <!-- Branches from CERT Decision -->
  <!-- Left Branch: M-01 Modal -->
  <path class="flow-line" d="M 560 325 L 280 325 L 280 380" />
  <text x="410" y="318" class="text-branch">성적서 1초 확인</text>

  <g transform="translate(140, 380)">
    <rect class="node-modal" width="280" height="66" />
    <text x="140" y="22" class="text-code">M-01 | 성적서 고해상도 모달</text>
    <text x="140" y="40" class="text-title">KOTITI 100% 무형광 성적서 확대</text>
    <text x="140" y="55" class="text-desc">형광 0.0% ND &amp; 유효기간 검증</text>
  </g>

  <!-- Right Branch: 30s Curator P-07 -->
  <path class="flow-line" d="M 740 325 L 1020 325 L 1020 380" />
  <text x="890" y="318" class="text-branch">맞춤 큐레이션</text>

  <g transform="translate(880, 380)">
    <rect class="node-proc" width="280" height="66" />
    <text x="140" y="22" class="text-code">P-07 | 30초 안심 큐레이터</text>
    <text x="140" y="40" class="text-title">피부타입 &amp; 사용 맥락 퀴즈</text>
    <text x="140" y="55" class="text-desc">초민감 / 아토피 / 신생아 겹수 추천</text>
  </g>

  <!-- Center Branch: Product Catalog P-04 -->
  <path class="flow-line" d="M 650 370 L 650 480" />
  <text x="690" y="425" class="text-branch">바로 쇼핑</text>

  <!-- Connect M-01 and P-07 to Detail Page -->
  <path class="flow-line" d="M 280 446 L 280 510 L 480 510" />
  <path class="flow-line" d="M 1020 446 L 1020 510 L 820 510" />

  <!-- ==================== 4. PRODUCT DETAIL (P-05) ==================== -->
  <g transform="translate(480, 480)">
    <rect class="node-proc" width="340" height="64" />
    <text x="170" y="22" class="text-code">P-05 | 상품 상세 페이지</text>
    <text x="170" y="40" class="text-title">봉제선 500% HD 줌 &amp; 완전정련 옵션</text>
    <text x="170" y="55" class="text-desc">무라벨 · 무향 밀봉 포장 보증</text>
  </g>
  <path class="flow-line" d="M 650 544 L 650 580" />

  <!-- ==================== 5. ZOOM & CRAFT DECISION ==================== -->
  <g transform="translate(560, 580)">
    <polygon points="90,0 180,45 90,90 0,45" class="node-dec" />
    <text x="90" y="42" class="text-dec">봉제선/라벨</text>
    <text x="90" y="56" class="text-dec">마감 확인?</text>
  </g>

  <!-- Left Branch: Zoom Action -->
  <path class="flow-line" d="M 560 625 L 300 625 L 300 680" />
  <text x="420" y="618" class="text-branch">500% 밀착 확대</text>

  <g transform="translate(160, 680)">
    <rect class="node-proc" width="280" height="66" />
    <text x="140" y="22" class="text-code">P-03 / INTERACTION</text>
    <text x="140" y="40" class="text-title">500% HD 마그니파이어 줌 조작</text>
    <text x="140" y="55" class="text-desc">말아박기 마감 &amp; 까끌거림 0% 확인</text>
  </g>

  <!-- Merge Zoom back to Purchase Decision -->
  <path class="flow-line" d="M 300 746 L 300 805 L 560 805" />
  <path class="flow-line" d="M 650 670 L 650 760" />
  <text x="690" y="715" class="text-branch">검증 통과</text>

  <!-- ==================== 6. PURCHASE TYPE DECISION ==================== -->
  <g transform="translate(560, 760)">
    <polygon points="90,0 180,45 90,90 0,45" class="node-dec" />
    <text x="90" y="42" class="text-dec">구매 방식</text>
    <text x="90" y="56" class="text-dec">선택?</text>
  </g>

  <!-- Option A: 1-Piece Pack P-06 -->
  <path class="flow-line" d="M 560 805 L 200 805 L 200 870" />
  <text x="360" y="798" class="text-branch">1장 소량 안심 체험</text>

  <g transform="translate(60, 870)">
    <rect class="node-proc" width="280" height="66" />
    <text x="140" y="22" class="text-code">P-06 | 1장 안심 체험팩</text>
    <text x="140" y="40" class="text-title">1장 신청 &amp; 100% 페이백 쿠폰</text>
    <text x="140" y="55" class="text-desc">본품 구매 시 체험비 전액 환급</text>
  </g>

  <!-- Option B: Gift Option M-02 -->
  <path class="flow-line" d="M 740 805 L 1100 805 L 1100 870" />
  <text x="940" y="798" class="text-branch">선물 포장 &amp; 꽃말 카드</text>

  <g transform="translate(960, 870)">
    <rect class="node-modal" width="280" height="66" />
    <text x="140" y="22" class="text-code">M-02 | 6종 꽃말 카드 모달</text>
    <text x="140" y="40" class="text-title">꽃말 카드 선택 &amp; 자필 메시지</text>
    <text x="140" y="55" class="text-desc">생분해 지함 패키징 결합</text>
  </g>

  <!-- Center Option: Direct Order -->
  <path class="flow-line" d="M 650 850 L 650 970" />
  <text x="695" y="910" class="text-branch">본품 즉시 구매</text>

  <!-- Merge Option A and Option B to Checkout P-11 -->
  <path class="flow-line" d="M 200 936 L 200 1000 L 480 1000" />
  <path class="flow-line" d="M 1100 936 L 1100 1000 L 820 1000" />

  <!-- ==================== 7. CHECKOUT & SAFETY PACKING (P-11) ==================== -->
  <g transform="translate(480, 970)">
    <rect class="node-proc" width="340" height="64" />
    <text x="170" y="22" class="text-code">P-11 | 장바구니 &amp; 1초 결제</text>
    <text x="170" y="40" class="text-title">무향 밀봉 보증 체크 &amp; 페이백 적용</text>
    <text x="170" y="55" class="text-desc">🟢 N Pay / 카카오페이 1초 간편 결제</text>
  </g>
  <path class="flow-line" d="M 650 1034 L 650 1070" />

  <!-- ==================== 8. DELIVERY & FIRST RITUAL ==================== -->
  <g transform="translate(480, 1070)">
    <rect class="node-proc" width="340" height="60" />
    <text x="170" y="24" class="text-code">DELIVERY &amp; RITUAL</text>
    <text x="170" y="44" class="text-title">📦 무향 밀봉 수령 ➔ 즉시 첫 세안 진행</text>
  </g>
  <path class="flow-line" d="M 650 1130 L 650 1165" />

  <!-- ==================== 9. SATISFACTION DECISION ==================== -->
  <g transform="translate(560, 1165)">
    <polygon points="90,0 180,40 90,80 0,40" class="node-dec" />
    <text x="90" y="38" class="text-dec">피부 적합성</text>
    <text x="90" y="52" class="text-dec">만족 여부?</text>
  </g>

  <!-- Left: Trouble Exception M-03 -->
  <path class="flow-line" d="M 560 1205 L 240 1205 L 240 1260" />
  <text x="370" y="1198" class="text-branch">트러블 발생</text>

  <g transform="translate(100, 1260)">
    <rect class="node-refund" width="280" height="64" />
    <text x="140" y="22" class="text-code" style="fill:#D9383A;">M-03 | 100% 안심 환불 모달</text>
    <text x="140" y="40" class="text-title" style="fill:#D9383A;">14일 이내 무료 수거 &amp; 100% 전액 환불</text>
    <text x="140" y="55" class="text-desc">피부 트러블 시 전액 안심 보장</text>
  </g>

  <!-- Right: 1-Click Reorder P-12 -->
  <path class="flow-line" d="M 740 1205 L 1050 1205 L 1050 1260" />
  <text x="920" y="1198" class="text-branch">자극 0% 대만족</text>

  <g transform="translate(900, 1260)">
    <rect class="node-success" width="300" height="64" />
    <text x="150" y="22" class="text-code" style="fill:#2E6945;">P-12 | 마이페이지 &amp; 평생 재주문</text>
    <text x="150" y="40" class="text-title" style="fill:#1F3327;">동일 스펙 1-Click 재구매 &amp; 에코 루프</text>
    <text x="150" y="55" class="text-desc">헌 소창 수거 신청 (5,000원 리워드)</text>
  </g>
</svg>
