<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="100%" height="100%" style="background-color: #F8FAF9; font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="flow-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="flow-start" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2F"/>
      <stop offset="100%" stop-color="#2D5A46"/>
    </linearGradient>
    <linearGradient id="flow-action" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46"/>
      <stop offset="100%" stop-color="#41775E"/>
    </linearGradient>
    <linearGradient id="flow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#A68019"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 35)">
    <rect width="1320" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#flow-shadow)"/>
    <text x="25" y="36" font-size="18" font-weight="700" fill="#1E293B">🔄 플로뜰리에 GOLF 서비스 흐름도 (End-to-End User Journey Flow)</text>
    <text x="25" y="54" font-size="12" fill="#64748B">페르소나: 김골프(배진혁) | 탐색 ➔ 기어 선택 ➔ 3D 검증 ➔ 자수 커스텀 ➔ 단체 견적 ➔ 엑셀 배송 ➔ 주문 완료</text>
  </g>

  <!-- Flow Steps Layout -->

  <!-- STEP 0: START -->
  <g transform="translate(560, 120)" filter="url(#flow-shadow)">
    <rect width="320" height="46" rx="23" fill="url(#flow-start)"/>
    <text x="160" y="28" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">🏁 시작: SCR-01 메인 / SCR-12 검색</text>
  </g>

  <path d="M 720 166 L 720 195" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 1: 탐색 & 4대 진입 분기 -->
  <g transform="translate(100, 195)">
    <!-- Branch 1: SCR-02 -->
    <g transform="translate(0, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="64" rx="8" fill="#FFFFFF" stroke="#2D5A46" stroke-width="1.5"/>
      <text x="140" y="26" font-size="12" font-weight="700" fill="#2D5A46" text-anchor="middle">SCR-02 | 마그네틱 타월 상세</text>
      <text x="140" y="46" font-size="11" fill="#475569" text-anchor="middle">롱 슬림 타월 &amp; 컬러 선택</text>
    </g>

    <!-- Branch 2: SCR-03 -->
    <g transform="translate(320, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="140" y="26" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">SCR-03 | 클럽/볼 와입스</text>
      <text x="140" y="46" font-size="11" fill="#475569" text-anchor="middle">스크래치 제로 3장 번들</text>
    </g>

    <!-- Branch 3: SCR-05 -->
    <g transform="translate(640, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="64" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="140" y="26" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">SCR-05 | 홀인원 답례품</text>
      <text x="140" y="46" font-size="11" fill="#78350F" text-anchor="middle">10~50세트 단체 패키지</text>
    </g>

    <!-- Branch 4: SCR-07 -->
    <g transform="translate(960, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="64" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <text x="140" y="26" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">SCR-07 | 1장 안심 체험팩</text>
      <text x="140" y="46" font-size="11" fill="#047857" text-anchor="middle">3,000원 체험 / 100% 환급</text>
    </g>
  </g>

  <!-- Connectors from Root to 4 Branches -->
  <path d="M 720 166 L 720 180 M 240 180 L 1200 180" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <path d="M 240 180 L 240 195 M 560 180 L 560 195 M 880 180 L 880 195 M 1200 180 L 1200 195" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 2: 상세 확인 & 검증 인터랙션 -->
  <g transform="translate(100, 300)">
    <!-- MODAL-01 -->
    <g transform="translate(0, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="60" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
      <text x="140" y="25" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">MODAL-01 | 마그네틱 3D 뷰어</text>
      <text x="140" y="43" font-size="11" fill="#78350F" text-anchor="middle">자석 클립 찰칵 결착 360도 시연</text>
    </g>

    <!-- SCR-06 -->
    <g transform="translate(320, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="140" y="25" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">SCR-06 | 필드 케어 &amp; 검증실</text>
      <text x="140" y="43" font-size="11" fill="#64748B" text-anchor="middle">1초 땀흡수 &amp; 인장력 시험성적서</text>
    </g>

    <!-- B2B Calc -->
    <g transform="translate(640, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="140" y="25" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">단체 견적 계산 &amp; 직인 PDF</text>
      <text x="140" y="43" font-size="11" fill="#78350F" text-anchor="middle">수량별 최대 30% 할인 견적서 출력</text>
    </g>
  </g>

  <!-- Connectors Step 1 to Step 2 -->
  <path d="M 240 259 L 240 300" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 560 259 L 460 300" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 880 259 L 880 300" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 3: 자수 아틀리에 (핵심 행동) -->
  <g transform="translate(260, 400)" filter="url(#flow-shadow)">
    <rect width="600" height="74" rx="8" fill="url(#flow-action)"/>
    <text x="300" y="28" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">SCR-04 | 골프 자수 아틀리에 (실시간 Canvas 렌더러)</text>
    <text x="300" y="48" font-size="11" fill="#E2E8F0" text-anchor="middle">영문 이니셜 + 핸디캡 + 골프 엠블럼 6종 조합 ➔ 실시간 시안 확정</text>
  </g>

  <path d="M 240 360 L 400 400" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 880 360 L 720 400" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 4: 장바구니 및 배송 분기 -->
  <g transform="translate(260, 520)">
    <!-- SCR-08 -->
    <g transform="translate(0, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="60" rx="8" fill="#FFFFFF" stroke="#2D5A46" stroke-width="1.5"/>
      <text x="140" y="25" font-size="12" font-weight="700" fill="#2D5A46" text-anchor="middle">SCR-08 | 장바구니</text>
      <text x="140" y="43" font-size="11" fill="#475569" text-anchor="middle">자수 시안 썸네일 &amp; 단체 할인 적용</text>
    </g>

    <!-- SCR-11 -->
    <g transform="translate(320, 0)" filter="url(#flow-shadow)">
      <rect width="280" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="140" y="25" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">SCR-11 | 엑셀 다중 배송지 등록</text>
      <text x="140" y="43" font-size="11" fill="#475569" text-anchor="middle">동반자 주소지 일괄 엑셀 파싱</text>
    </g>
  </g>

  <path d="M 560 474 L 400 520" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 560 474 L 720 520" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 5: 주문 및 결제 -->
  <g transform="translate(420, 630)" filter="url(#flow-shadow)">
    <rect width="600" height="74" rx="8" fill="#FFFFFF" stroke="#2D5A46" stroke-width="2"/>
    <text x="300" y="28" font-size="13" font-weight="700" fill="#2D5A46" text-anchor="middle">SCR-09 | 주문 및 결제 (Checkout)</text>
    <text x="300" y="48" font-size="11" fill="#475569" text-anchor="middle">N-Pay 1초 결제 / 카드 복합 결제 / 세금계산서 즉시 발행 신청</text>
  </g>

  <path d="M 400 580 L 560 630" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 720 580 L 880 630" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M 1200 259 L 1200 600 L 950 630" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 6: 주문 완료 & 후속 처리 -->
  <g transform="translate(420, 750)" filter="url(#flow-shadow)">
    <rect width="600" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="300" y="28" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">SCR-10 | 주문 완료 (Order Completed)</text>
    <text x="300" y="48" font-size="11" fill="#15803D" text-anchor="middle">✓ 최종 자수 확인증 발급 | ✓ 라운딩 D-Day 납품 확약서 발급</text>
    <text x="300" y="66" font-size="11" fill="#15803D" text-anchor="middle">✓ 카카오 알림톡 실시간 배송 트래킹 안내</text>
  </g>

  <path d="M 720 704 L 720 750" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- STEP 7: END -->
  <g transform="translate(560, 880)" filter="url(#flow-shadow)">
    <rect width="320" height="46" rx="23" fill="url(#flow-start)"/>
    <text x="160" y="28" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">🎯 종료: 라운딩 D-Day 안심 배송 완료</text>
  </g>

  <path d="M 720 834 L 720 880" stroke="#2D5A46" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Legend -->
  <g transform="translate(100, 960)">
    <rect width="1240" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="30" font-size="12" font-weight="700" fill="#334155">도형 범례 (Flow Legend):</text>
    <rect x="150" y="16" width="70" height="22" rx="11" fill="url(#flow-start)"/>
    <text x="185" y="31" font-size="11" fill="#FFFFFF" text-anchor="middle">시작/종료</text>
    <rect x="250" y="16" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#2D5A46" stroke-width="1.2"/>
    <text x="285" y="31" font-size="11" fill="#2D5A46" text-anchor="middle">사용자 행동</text>
    <rect x="350" y="16" width="70" height="22" rx="4" fill="url(#flow-action)"/>
    <text x="385" y="31" font-size="11" fill="#FFFFFF" text-anchor="middle">핵심 인터랙션</text>
    <rect x="450" y="16" width="70" height="22" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="485" y="31" font-size="11" fill="#B45309" text-anchor="middle">B2B/단체 분기</text>
    <rect x="550" y="16" width="70" height="22" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
    <text x="585" y="31" font-size="11" fill="#166534" text-anchor="middle">완료/결과</text>
  </g>
</svg>
