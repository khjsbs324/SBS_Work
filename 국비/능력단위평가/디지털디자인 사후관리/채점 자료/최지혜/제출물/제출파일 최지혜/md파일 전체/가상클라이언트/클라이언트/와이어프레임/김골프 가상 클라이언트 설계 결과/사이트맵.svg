<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="100%" height="100%" style="background-color: #F8FAF9; font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
    <linearGradient id="grad-root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2F"/>
      <stop offset="100%" stop-color="#2D5A46"/>
    </linearGradient>
    <linearGradient id="grad-depth1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46"/>
      <stop offset="100%" stop-color="#41775E"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#A68019"/>
    </linearGradient>
  </defs>

  <!-- Title & Meta Header -->
  <g transform="translate(60, 40)">
    <rect width="1320" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-sm)"/>
    <text x="30" y="38" font-size="20" font-weight="700" fill="#1E293B">🗺️ 플로뜰리에 (Flottelier) 골프 기어 &amp; 라운딩 패브릭 마스터 사이트맵</text>
    <text x="30" y="58" font-size="13" fill="#64748B">페르소나: 김골프(배진혁) | 마그네틱 자석 클립 · 18홀 땀흡수 · 골프 자수 아틀리에 · 홀인원 답례품 | IA Version 1.0 (UTF-8)</text>
    <rect x="1170" y="20" width="120" height="30" rx="15" fill="#E8F5E9"/>
    <text x="1230" y="40" font-size="12" font-weight="700" fill="#2E7D32" text-anchor="middle">✓ WCAG 2.1 AA</text>
  </g>

  <!-- Root Node -->
  <g transform="translate(480, 135)" filter="url(#shadow)">
    <rect width="480" height="56" rx="28" fill="url(#grad-root)"/>
    <text x="240" y="28" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">플로뜰리에 GOLF 플랫폼 마스터 IA</text>
    <text x="240" y="46" font-size="12" fill="#E2E8F0" text-anchor="middle">마그네틱 골프 타월 · 클럽/볼 와입스 · 자수 아틀리에 · 홀인원 답례품</text>
  </g>

  <!-- Connector Lines from Root to Depth 1 Columns -->
  <path d="M 720 191 L 720 225 M 190 225 L 1250 225" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  <path d="M 190 225 L 190 250 M 455 225 L 455 250 M 720 225 L 720 250 M 985 225 L 985 250 M 1250 225 L 1250 250" stroke="#CBD5E1" stroke-width="2" fill="none"/>

  <!-- ==================== COLUMN 1: GOLF GEAR SHOP (SCR-02/03) ==================== -->
  <g transform="translate(70, 250)">
    <!-- Depth 1 Header -->
    <rect width="240" height="44" rx="8" fill="url(#grad-depth1)" filter="url(#shadow-sm)"/>
    <text x="120" y="27" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1.0 GOLF GEAR 샵</text>
    
    <!-- Depth 2 Node: SCR-02 -->
    <g transform="translate(0, 58)">
      <rect width="240" height="84" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-02 | 마그네틱 타월 상세</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 25x100cm 롱 슬림 땀 타월</text>
      <text x="10" y="58" font-size="11" fill="#334155">• 네오디뮴 자석 클립 3D 뷰어</text>
      <text x="10" y="74" font-size="11" fill="#64748B">• 그린/네이비/아이보리 스와치</text>
    </g>

    <!-- Depth 2 Node: SCR-03 -->
    <g transform="translate(0, 154)">
      <rect width="240" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-03 | 클럽/볼 와입스</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 20x20cm 스크래치 제로 와입스</text>
      <text x="10" y="58" font-size="11" fill="#334155">• 3장 번들 포켓 볼타월 세트</text>
    </g>

    <!-- Depth 2 Node: MODAL-01 -->
    <g transform="translate(0, 240)">
      <rect width="240" height="64" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#B45309">MODAL-01 | 마그네틱 3D 뷰어</text>
      <text x="10" y="38" font-size="11" fill="#78350F">• 캐디백/카트 원터치 탈부착</text>
      <text x="10" y="52" font-size="11" fill="#78350F">• 360도 회전 인스트럭션</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: CUSTOM ATELIER (SCR-04) ==================== -->
  <g transform="translate(335, 250)">
    <!-- Depth 1 Header -->
    <rect width="240" height="44" rx="8" fill="url(#grad-depth1)" filter="url(#shadow-sm)"/>
    <text x="120" y="27" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2.0 자수 아틀리에</text>
    
    <!-- Depth 2 Node: SCR-04 -->
    <g transform="translate(0, 58)">
      <rect width="240" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-04 | 골프 자수 아틀리에</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 영문 로만/이탤릭 폰트 4종</text>
      <text x="10" y="60" font-size="11" fill="#334155">• 골프 엠블럼 심볼 6종</text>
      <text x="10" y="78" font-size="11" fill="#334155">• 핸디캡/백넘버 각인 옵션</text>
      <text x="10" y="96" font-size="11" fill="#334155">• 골드/실버/화이트 자수사</text>
      <text x="10" y="114" font-size="11" fill="#334155">• 실시간 Canvas 렌더링 뷰어</text>
      <text x="10" y="132" font-size="11" fill="#64748B">• [자수 적용하고 바로 구매]</text>
    </g>

    <!-- Sub Features -->
    <g transform="translate(0, 220)">
      <rect width="240" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#475569">📌 엠블럼 6종 라인업</text>
      <text x="10" y="38" font-size="10" fill="#64748B">1. 드라이버 2. 퍼터 3. 핀플래그</text>
      <text x="10" y="54" font-size="10" fill="#64748B">4. 플라잉 이글 5. 트로피 6. 골프볼</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: HOLE IN ONE GIFT (SCR-05) ==================== -->
  <g transform="translate(600, 250)">
    <!-- Depth 1 Header -->
    <rect width="240" height="44" rx="8" fill="url(#grad-accent)" filter="url(#shadow-sm)"/>
    <text x="120" y="27" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3.0 홀인원 답례품 (B2B)</text>
    
    <!-- Depth 2 Node: SCR-05 -->
    <g transform="translate(0, 58)">
      <rect width="240" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#FEF3C7"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#92400E">SCR-05 | 홀인원/이글 답례품</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 10/20/30/50세트 단체 할인</text>
      <text x="10" y="60" font-size="11" fill="#334155">• 한지 지함 &amp; 보자기 패키지</text>
      <text x="10" y="78" font-size="11" fill="#334155">• 동반자 감사 메시지 카드 대필</text>
      <text x="10" y="96" font-size="11" fill="#334155">• 실시간 단체 견적 계산기</text>
      <text x="10" y="114" font-size="11" fill="#334155">• PDF 직인 견적서 즉시 다운로드</text>
      <text x="10" y="132" font-size="11" fill="#64748B">• 동호회 로고 AI 파일 일괄 업로드</text>
    </g>

    <!-- Depth 2 Node: SCR-11 -->
    <g transform="translate(0, 220)">
      <rect width="240" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-11 | 엑셀 다중 배송지</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 동반자 주소지 엑셀 일괄 등록</text>
      <text x="10" y="58" font-size="11" fill="#334155">• 가격표 미동봉 안심 직배송</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: CARE & PROOFS (SCR-06/07) ==================== -->
  <g transform="translate(865, 250)">
    <!-- Depth 1 Header -->
    <rect width="240" height="44" rx="8" fill="url(#grad-depth1)" filter="url(#shadow-sm)"/>
    <text x="120" y="27" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4.0 필드 케어 &amp; 검증</text>
    
    <!-- Depth 2 Node: SCR-06 -->
    <g transform="translate(0, 58)">
      <rect width="240" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-06 | 필드 케어 &amp; 검증실</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 1초 땀흡수 vs 극세사 타임랩스</text>
      <text x="10" y="60" font-size="11" fill="#334155">• 마그네틱 인장력 시험성적서</text>
      <text x="10" y="78" font-size="11" fill="#334155">• 잔디/흙먼지 천연 세척 가이드</text>
      <text x="10" y="96" font-size="11" fill="#334155">• 100회 세탁 품질 보증 인증</text>
    </g>

    <!-- Depth 2 Node: SCR-07 -->
    <g transform="translate(0, 190)">
      <rect width="240" height="84" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#D1FAE5"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#065F46">SCR-07 | 1장 안심 체험팩</text>
      <text x="10" y="42" font-size="11" fill="#065F46">• 1장 3,000원에 원단 감촉 확인</text>
      <text x="10" y="58" font-size="11" fill="#065F46">• 본품 구매 시 100% 환급 쿠폰</text>
      <text x="10" y="74" font-size="11" fill="#047857">• 첫 구매 부담 ZERO 프로그램</text>
    </g>
  </g>

  <!-- ==================== COLUMN 5: ORDER & CHECKOUT (SCR-08/09/10) ==================== -->
  <g transform="translate(1130, 250)">
    <!-- Depth 1 Header -->
    <rect width="240" height="44" rx="8" fill="url(#grad-depth1)" filter="url(#shadow-sm)"/>
    <text x="120" y="27" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5.0 주문 &amp; 결제</text>
    
    <!-- Depth 2 Node: SCR-08 -->
    <g transform="translate(0, 58)">
      <rect width="240" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-08 | 장바구니</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 선택 기어 &amp; 자수 시안 썸네일</text>
      <text x="10" y="56" font-size="11" fill="#64748B">• 수량별 단체 할인 적용 확인</text>
    </g>

    <!-- Depth 2 Node: SCR-09 -->
    <g transform="translate(0, 134)">
      <rect width="240" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-09 | 주문 및 결제</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 법인 세금계산서 신청</text>
      <text x="10" y="58" font-size="11" fill="#334155">• N-Pay / 카카오 1초 간편결제</text>
    </g>

    <!-- Depth 2 Node: SCR-10 -->
    <g transform="translate(0, 220)">
      <rect width="240" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="0" y="0" width="240" height="24" rx="8" fill="#F1F5F9"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#2D5A46">SCR-10 | 주문 완료</text>
      <text x="10" y="42" font-size="11" fill="#334155">• 최종 자수 시안 확인증 발급</text>
      <text x="10" y="58" font-size="11" fill="#334155">• 라운딩 D-Day 납품 확약서</text>
    </g>
  </g>

  <!-- Bottom Common Bar -->
  <g transform="translate(70, 730)">
    <rect width="1300" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#shadow-sm)"/>
    <text x="20" y="35" font-size="13" font-weight="700" fill="#1E293B">공통 영역 (Common)</text>
    <text x="170" y="35" font-size="12" fill="#64748B">SCR-12 통합 검색 결과 | 글로벌 헤더 GNB | 플로팅 퀵 자수 시뮬레이터 | 카카오 실시간 상담 채널 | 푸터 품질 보증</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70, 810)">
    <rect width="1300" height="50" rx="8" fill="#F1F5F9"/>
    <text x="20" y="30" font-size="12" font-weight="700" fill="#334155">범례 (Legend):</text>
    <rect x="120" y="18" width="16" height="16" rx="4" fill="url(#grad-depth1)"/>
    <text x="145" y="31" font-size="12" fill="#334155">기어 샵 / 자수 / 케어</text>
    <rect x="320" y="18" width="16" height="16" rx="4" fill="url(#grad-accent)"/>
    <text x="345" y="31" font-size="12" fill="#334155">홀인원 답례품 (B2B 단체)</text>
    <rect x="530" y="18" width="16" height="16" rx="4" fill="#D1FAE5" stroke="#10B981"/>
    <text x="555" y="31" font-size="12" fill="#334155">체험팩 (100% 환급)</text>
    <rect x="720" y="18" width="16" height="16" rx="4" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="745" y="31" font-size="12" fill="#334155">3D 모달 인터랙션</text>
  </g>
</svg>
