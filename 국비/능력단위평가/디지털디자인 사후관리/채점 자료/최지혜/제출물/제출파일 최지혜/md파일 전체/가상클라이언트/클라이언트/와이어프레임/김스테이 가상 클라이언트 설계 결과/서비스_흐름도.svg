<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAFDFD; }
      .title { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 22px; fill: #1A3B34; }
      .subtitle { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 13px; fill: #585D62; }
      .start-end { fill: #1A3B34; stroke: #102A24; stroke-width: 2px; rx: 20px; }
      .start-end-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .action-node { fill: #E8F3F1; stroke: #4A7C72; stroke-width: 1.5px; rx: 6px; }
      .action-title { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 12px; fill: #1A3B34; text-anchor: middle; }
      .action-desc { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 10px; fill: #585D62; text-anchor: middle; }
      .decision-node { fill: #FFF6ED; stroke: #D97706; stroke-width: 1.5px; }
      .decision-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #92400E; text-anchor: middle; }
      .system-node { fill: #EBF3FA; stroke: #2B6CB0; stroke-width: 1.5px; rx: 4px; }
      .system-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #1A365D; text-anchor: middle; }
      .error-node { fill: #FEE2E2; stroke: #EF4444; stroke-width: 1.5px; rx: 6px; stroke-dasharray: 3 3; }
      .error-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #991B1B; text-anchor: middle; }
      .flow-line { stroke: #4A7C72; stroke-width: 1.5px; fill: none; marker-end: url(#arrow); }
      .branch-line { stroke: #D97706; stroke-width: 1.2px; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrow-orange); }
      .branch-label { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 10px; fill: #D97706; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7C72" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" class="bg" />

  <!-- Title Header -->
  <text x="50" y="45" class="title">🔄 플로뜰리에 (Flottelier) - 김스테이 B2B 서비스 흐름도 (Service Flowchart)</text>
  <text x="50" y="70" class="subtitle">탐색 ➔ 객실 번들 선택 ➔ 숙소 로고 자수 ➔ 견적서 PDF ➔ 세금계산서 ➔ 발주 완료 및 정기 납품 구독</text>

  <!-- Flow Steps -->
  <rect x="475" y="100" width="250" height="40" class="start-end" />
  <text x="600" y="125" class="start-end-text">시작: 스테이 B2B 메인 접속 (P-01)</text>

  <line x1="600" y1="140" x2="600" y2="175" class="flow-line" />
  <rect x="475" y="175" width="250" height="50" class="action-node" />
  <text x="600" y="196" class="action-title">1. 탐색: 객실 번들 카탈로그 (P-02)</text>
  <text x="600" y="213" class="action-desc">독채(20장)/부티크(50장)/호텔(100장) 탐색</text>

  <line x1="600" y1="225" x2="600" y2="260" class="flow-line" />
  <polygon points="600,260 720,295 600,330 480,295" class="decision-node" />
  <text x="600" y="292" class="decision-text">사전 검증</text>
  <text x="600" y="306" class="decision-text">샘플 필요?</text>

  <line x1="480" y1="295" x2="260" y2="295" class="branch-line" />
  <text x="320" y="285" class="branch-label">샘플 먼저 체험</text>
  <rect x="80" y="270" width="180" height="50" class="action-node" />
  <text x="170" y="291" class="action-title">호스트 3종 샘플 신청</text>
  <text x="170" y="308" class="action-desc">15,000원 결제 (P-09)</text>

  <line x1="170" y1="320" x2="170" y2="355" class="branch-line" />
  <rect x="80" y="355" width="180" height="50" class="system-node" />
  <text x="170" y="376" class="system-text">100% 환급 쿠폰 발급</text>
  <text x="170" y="393" class="action-desc">본품 발주 시 15,000원 차감</text>
  <line x1="260" y1="380" x2="475" y2="380" class="branch-line" />

  <line x1="600" y1="330" x2="600" y2="365" class="flow-line" />
  <text x="605" y="350" class="branch-label">본품 즉시 발주</text>
  <rect x="475" y="365" width="250" height="50" class="action-node" />
  <text x="600" y="386" class="action-title">2. 선택: 50장 스탠다드 팩 (P-03)</text>
  <text x="600" y="403" class="action-desc">3배 빠른 건조 스펙 &amp; 고리형 루프 체크</text>

  <line x1="600" y1="415" x2="600" y2="450" class="flow-line" />
  <rect x="475" y="450" width="250" height="50" class="action-node" />
  <text x="600" y="471" class="action-title">3. 커스텀: 숙소 로고 업로드 (P-05)</text>
  <text x="600" y="488" class="action-desc">AI/PNG 로고 &amp; 자수 실 색상(골드) 선택</text>

  <line x1="600" y1="500" x2="600" y2="535" class="flow-line" />
  <polygon points="600,535 720,570 600,605 480,570" class="decision-node" />
  <text x="600" y="567" class="decision-text">로고 파일 형식</text>
  <text x="600" y="581" class="decision-text">유효성 검증</text>

  <line x1="720" y1="570" x2="880" y2="570" class="branch-line" />
  <text x="740" y="560" class="branch-label">저화질/비지원</text>
  <rect x="880" y="545" width="220" height="50" class="error-node" />
  <text x="990" y="566" class="error-text">EX-01 로고 오류 안내</text>
  <text x="990" y="583" class="action-desc">1:1 디자이너 무료 벡터 변환</text>
  <line x1="990" y1="545" x2="990" y2="475" class="branch-line" />
  <line x1="990" y1="475" x2="725" y2="475" class="branch-line" />

  <line x1="600" y1="605" x2="600" y2="640" class="flow-line" />
  <text x="605" y="625" class="branch-label">정상 파일</text>
  <rect x="475" y="640" width="250" height="50" class="action-node" />
  <text x="600" y="661" class="action-title">4. Canvas 실시간 자수 프리뷰 (M-03)</text>
  <text x="600" y="678" class="action-desc">국/영문 리추얼 안내 카드 무료 동봉 확정</text>

  <line x1="600" y1="690" x2="600" y2="725" class="flow-line" />
  <rect x="475" y="725" width="250" height="50" class="action-node" />
  <text x="600" y="746" class="action-title">5. 견적 확인: 실시간 견적서 PDF (M-04)</text>
  <text x="600" y="763" class="action-desc">법인 직인 날인 공식 견적서 1초 출력 (P-07)</text>

  <line x1="600" y1="775" x2="600" y2="810" class="flow-line" />
  <rect x="475" y="810" width="250" height="50" class="system-node" />
  <text x="600" y="831" class="system-text">6. 결제 &amp; 세금계산서 원클릭 신청 (P-10)</text>
  <text x="600" y="848" class="action-desc">사업자번호 실시간 검증 &amp; 무비닐 벌크 포장</text>

  <line x1="600" y1="860" x2="600" y2="895" class="flow-line" />
  <rect x="475" y="895" width="250" height="40" class="start-end" />
  <text x="600" y="920" class="start-end-text">종료: 발주 완료 &amp; 3~6개월 정기구독 (P-11)</text>

</svg>
