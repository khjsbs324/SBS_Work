    <text x="860" y="744" font-size="11" fill="#6B7280">(연결: SCR-09)</text>

    <rect x="1105" y="660" width="230" height="100" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-dasharray="4 4" stroke-width="1.5" />
    <text x="1120" y="685" font-size="13" font-weight="700" fill="#B45309">MOD-05: KATRI 탈취 성적서</text>
