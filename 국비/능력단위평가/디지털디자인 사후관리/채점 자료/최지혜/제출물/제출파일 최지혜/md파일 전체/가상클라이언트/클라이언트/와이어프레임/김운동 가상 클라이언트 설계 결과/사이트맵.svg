    <text x="40" y="455" font-size="10" fill="#64748B">롱타월+와입스+메쉬파우치</text>

    <rect x="30" y="485" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="40" y="506" font-size="12" font-weight="700" fill="#0F172A">SCR-04: 스포츠 슬림 롱타월</text>
    <text x="40" y="525" font-size="10" fill="#64748B">30x90cm &amp; 스냅 스트랩 옵션</text>
  </g>

