  <path d="M 590 180 L 590 210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 820 180 L 820 210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 1050 180 L 1050 210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
