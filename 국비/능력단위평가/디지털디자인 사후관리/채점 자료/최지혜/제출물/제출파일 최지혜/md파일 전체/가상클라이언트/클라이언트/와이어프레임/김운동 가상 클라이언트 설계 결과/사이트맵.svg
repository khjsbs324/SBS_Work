    <text x="340" y="744" font-size="11" fill="#6B7280">(연결: SCR-04)</text>

    <rect x="585" y="660" width="230" height="100" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-dasharray="4 4" stroke-width="1.5" />
    <text x="600" y="685" font-size="13" font-weight="700" fill="#B45309">MOD-03: 1장 체험팩 100% 환급</text>
    <text x="600" y="708" font-size="11" fill="#4B5563">· 3,000원 체험 1초 간편 신청</text>
    <text x="600" y="726" font-size="11" fill="#4B5563">· 본품 구매 시 100% 페이백 쿠폰</text>
