  <!-- Title Header -->
  <text x="700" y="45" font-size="24" font-weight="800" text-anchor="middle" fill="#0F172A">🗺️ 플로뜰리에 오하운 스포츠 센터 마스터 사이트맵 (Sitemap v1.0)</text>
  <text x="700" y="70" font-size="13" text-anchor="middle" fill="#64748B">20대 후반 애슬레저 유저(김운동) 15대 요구사항 100% 반영 정보 아키텍처</text>

