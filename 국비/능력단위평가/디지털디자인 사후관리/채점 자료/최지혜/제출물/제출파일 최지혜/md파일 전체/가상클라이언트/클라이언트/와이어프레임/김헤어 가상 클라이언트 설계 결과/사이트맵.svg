<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="100%" height="100%" style="background-color: #FAFDFD; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2522"/>
      <stop offset="100%" stop-color="#2D3A34"/>
    </linearGradient>
    <linearGradient id="grad-group" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2ECE4"/>
    </linearGradient>
    <marker id="sitemap-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8E949A"/>
    </marker>
  </defs>

  <!-- Title Header Banner -->
  <g transform="translate(60, 30)">
    <rect width="1320" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#box-shadow)"/>
    <text x="30" y="38" font-size="20" font-weight="bold" fill="#1E2522">🗺️ 플로뜰리에 HAIR (Flottelier Hair) 사이트맵 구조도</text>
    <text x="30" y="58" font-size="13" fill="#64748B">페르소나: 김헤어(백승현) | 원터치 루프 헤어 터번 &amp; 드라이 70% 단축 &amp; B2B 살롱 도매 플랫폼</text>
  </g>

  <!-- Root Node (SCR-01) -->
  <g transform="translate(540, 130)" filter="url(#box-shadow)">
    <rect width="360" height="54" rx="27" fill="url(#grad-root)" stroke="#111213" stroke-width="2"/>
    <text x="180" y="33" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✂️ HOME: 플로뜰리에 HAIR (SCR-01)</text>
  </g>

  <!-- Main Trunk Line -->
  <path d="M 720 184 L 720 220" stroke="#8E949A" stroke-width="2" fill="none"/>
  <path d="M 160 220 L 1280 220" stroke="#8E949A" stroke-width="2" fill="none"/>

  <!-- 1차 메뉴 그룹 (7대 영역) -->

  <!-- Column 1: SALON GEAR -->
  <path d="M 160 220 L 160 250" stroke="#8E949A" stroke-width="2" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(70, 250)" filter="url(#box-shadow)">
    <rect width="180" height="42" rx="8" fill="url(#grad-group)" stroke="#C47A5A" stroke-width="2"/>
    <text x="90" y="26" font-size="13" font-weight="bold" fill="#232527" text-anchor="middle">1. SALON GEAR</text>
  </g>
  <!-- SCR-02 -->
  <path d="M 160 292 L 160 320" stroke="#8E949A" stroke-width="1.5" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(60, 320)" filter="url(#box-shadow)">
    <rect width="200" height="68" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="100" y="24" font-size="12" font-weight="bold" fill="#232527" text-anchor="middle">SCR-02: 루프 헤어 터번</text>
    <text x="100" y="42" font-size="10" fill="#64748B" text-anchor="middle">40x100cm / 단추 고정</text>
    <text x="100" y="56" font-size="10" fill="#C47A5A" text-anchor="middle">+ MODAL-01 3초 착용법</text>
  </g>
