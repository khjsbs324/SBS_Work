  <!-- SCR-04 -->
  <path d="M 345 292 L 345 320" stroke="#8E949A" stroke-width="1.5" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(245, 320)" filter="url(#box-shadow)">
