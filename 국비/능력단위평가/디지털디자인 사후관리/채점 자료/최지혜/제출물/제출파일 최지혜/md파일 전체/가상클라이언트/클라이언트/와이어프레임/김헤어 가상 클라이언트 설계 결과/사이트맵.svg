    <text x="100" y="22" font-size="12" font-weight="bold" fill="#1A365D" text-anchor="middle">SCR-09: B2B 장바구니</text>
    <text x="100" y="38" font-size="10" fill="#64748B" text-anchor="middle">도매 번들 + 로고 시안</text>
  </g>
  <!-- SCR-10 -->
  <path d="M 1280 368 L 1280 395" stroke="#8E949A" stroke-width="1.5" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(1180, 395)" filter="url(#box-shadow)">
    <rect width="200" height="48" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="100" y="22" font-size="12" font-weight="bold" fill="#1A365D" text-anchor="middle">SCR-10: B2B 결제</text>
    <text x="100" y="38" font-size="10" fill="#64748B" text-anchor="middle">세금계산서 / 법인결제</text>
  </g>
  <!-- SCR-11 -->
  <path d="M 1280 443 L 1280 470" stroke="#8E949A" stroke-width="1.5" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(1180, 470)" filter="url(#box-shadow)">
    <rect width="200" height="48" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="100" y="22" font-size="12" font-weight="bold" fill="#14532D" text-anchor="middle">SCR-11: 발주 완료</text>
    <text x="100" y="38" font-size="10" fill="#16A34A" text-anchor="middle">D-Day 납품 확약서 발급</text>
  </g>

  <!-- Bottom Global Footer Note -->
  <g transform="translate(60, 560)">
    <rect width="1320" height="60" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="30" y="26" font-size="12" font-weight="bold" fill="#334155">💡 살롱 B2B 특화 기능 안내</text>
    <text x="30" y="44" font-size="11" fill="#64748B">GNB 헤더: 세금계산서 즉시 발행 띠배너, 대량 도매 계산기, 견적함 | 플로팅: B2B 도매센터(SCR-05), 살롱 로고 자수(SCR-04), 3천원 체험팩(SCR-08) | 푸터: 더마테스트 성적서</text>
  </g>
</svg>
