    <text x="100" y="24" font-size="12" font-weight="bold" fill="#232527" text-anchor="middle">SCR-08: 1장 안심 체험팩</text>
    <text x="100" y="42" font-size="10" fill="#64748B" text-anchor="middle">3,000원 배송비 체험</text>
    <text x="100" y="56" font-size="10" fill="#16A34A" text-anchor="middle">도매 주문 시 100% 환급</text>
  </g>

  <!-- Column 7: ORDER -->
  <path d="M 1280 220 L 1280 250" stroke="#8E949A" stroke-width="2" marker-end="url(#sitemap-arrow)" fill="none"/>
  <g transform="translate(1190, 250)" filter="url(#box-shadow)">
