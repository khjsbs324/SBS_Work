  <text x="282" y="418" class="page-title">5만원대 프리미엄 팩</text>
  <text x="282" y="435" class="page-desc">세안 3장+바스 1장+CEO 감사카드</text>

  <line x1="370" y1="455" x2="370" y2="490" class="line" />
  <rect x="270" y="490" width="200" height="75" class="page-node" />
  <text x="282" y="510" class="page-code">P-04 VIP 패키지</text>
  <text x="282" y="528" class="page-title">10만원대 VIP 프레스티지</text>
  <text x="282" y="545" class="page-desc">풀세트 + 한지 지함 + 소창 보자기</text>

  <!-- COLUMN 3 SUBPAGES -->
  <line x1="600" y1="230" x2="600" y2="270" class="line" />
  <rect x="500" y="270" width="200" height="75" class="page-node" />
  <text x="512" y="290" class="page-code">P-05 자수 센터</text>
  <text x="512" y="308" class="page-title">기업 로고 자수 스튜디오</text>
  <text x="512" y="325" class="page-desc">AI/PNG 로고 업로드 &amp; 금/은사 렌더링</text>

  <line x1="600" y1="345" x2="600" y2="380" class="line" />
  <rect x="500" y="380" width="200" height="75" class="page-node" />
