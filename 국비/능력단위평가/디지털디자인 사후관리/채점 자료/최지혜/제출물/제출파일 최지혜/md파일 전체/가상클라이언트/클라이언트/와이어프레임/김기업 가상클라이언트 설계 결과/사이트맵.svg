  <text x="512" y="435" class="page-desc">대표이사 인사말 템플릿 &amp; 콩기름 인쇄</text>

  <!-- COLUMN 4 SUBPAGES -->
  <line x1="830" y1="230" x2="830" y2="270" class="line" />
  <rect x="730" y="270" width="200" height="75" class="page-node" />
  <text x="742" y="290" class="page-code">P-07 엑셀 배송</text>
  <text x="742" y="308" class="page-title">엑셀 일괄 배송 센터</text>
  <text x="742" y="325" class="page-desc">수백 명 주소록 1초 업로드 직배송</text>

  <line x1="830" y1="345" x2="830" y2="380" class="line" />
  <rect x="730" y="380" width="200" height="75" class="page-node" />
  <text x="742" y="400" class="page-code">P-08 납기 보증</text>
  <text x="742" y="418" class="page-title">납기일 엄수 보증관</text>
  <text x="742" y="435" class="page-desc">D-Day 납품 확약서 발급 (지연 100% 보상)</text>

  <line x1="830" y1="455" x2="830" y2="490" class="line" />
  <rect x="730" y="490" width="200" height="75" class="page-node" />
  <text x="742" y="510" class="page-code">P-09 배송 추적</text>
  <text x="742" y="528" class="page-title">배송 트래킹 대시보드</text>
  <text x="742" y="545" class="page-desc">수백 개 송장 실시간 수령 현황</text>

  <!-- COLUMN 5 SUBPAGES -->
  <line x1="1060" y1="230" x2="1060" y2="270" class="line" />
  <rect x="960" y="270" width="200" height="75" class="page-node" />
  <text x="972" y="290" class="page-code">P-10 견적 &amp; 세무</text>
  <text x="972" y="308" class="page-title">실시간 견적 &amp; 세금계산서</text>
  <text x="972" y="325" class="page-desc">직인 날인 공식 견적서 PDF 1초 출력</text>

  <line x1="1060" y1="345" x2="1060" y2="380" class="line" />
  <rect x="960" y="380" width="200" height="75" class="page-node" />
  <text x="972" y="400" class="page-code">P-11 ESG 실증</text>
  <text x="972" y="418" class="page-title">ESG 탄소/플라스틱 리포트</text>
  <text x="972" y="435" class="page-desc">플라스틱 120g 절감 인증서 무료 동봉</text>

  <!-- MODALS SECTION -->
  <rect x="40" y="600" width="1120" height="130" fill="#FFFDF8" stroke="#E2D9CC" rx="8" />
  <text x="60" y="630" font-family="'Noto Sans KR', sans-serif" font-weight="700" font-size="14px" fill="#92400E">💡 4대 레이어드 모달 시스템 (Modal Overlays)</text>

  <rect x="60" y="648" width="260" height="65" class="modal-node" />
  <text x="75" y="670" class="modal-text">MODAL M-01 : 엑셀 일괄 파서 모달</text>
  <text x="75" y="692" font-family="'Noto Sans KR', sans-serif" font-size="10px" fill="#585D62">드래그앤드롭 주소록 1초 파싱 &amp; 오류 검증</text>

  <rect x="340" y="648" width="260" height="65" class="modal-node" />
  <text x="355" y="670" class="modal-text">MODAL M-03 : Canvas 로고 자수기</text>
  <text x="355" y="692" font-family="'Noto Sans KR', sans-serif" font-size="10px" fill="#585D62">금사/은사 정밀 자수 실시간 합성 렌더링</text>

  <rect x="620" y="648" width="260" height="65" class="modal-node" />
  <text x="635" y="670" class="modal-text">MODAL M-04 : 실시간 견적서 PDF 출력</text>
  <text x="635" y="692" font-family="'Noto Sans KR', sans-serif" font-size="10px" fill="#585D62">법인 직인 날인 공식 B2B 견적서 1초 다운로드</text>

  <rect x="900" y="648" width="260" height="65" class="modal-node" />
  <text x="915" y="670" class="modal-text">MODAL M-02 : KC 4無 성적서 200% 확대</text>
  <text x="915" y="692" font-family="'Noto Sans KR', sans-serif" font-size="10px" fill="#585D62">100회 세탁 KATRI 무형광 성적서 뷰어</text>

  <!-- EXCEPTION SECTION -->
  <rect x="40" y="750" width="1120" height="100" fill="#FFF8F8" stroke="#F8D7DA" rx="8" />
  <text x="60" y="775" font-family="'Noto Sans KR', sans-serif" font-weight="700" font-size="13px" fill="#991B1B">⚠️ 예외 처리 페이지 (Exception Pages - 가정)</text>

  <rect x="60" y="790" width="340" height="45" class="ex-node" />
  <text x="75" y="817" class="ex-text">EX-01 : 엑셀 주소록 형식/헤더 오류 피드백</text>

  <rect x="430" y="790" width="340" height="45" class="ex-node" />
  <text x="445" y="817" class="ex-text">EX-02 : 1,000세트 이상 초대형 특판 납기 조율</text>

  <rect x="800" y="790" width="340" height="45" class="ex-node" />
  <text x="815" y="817" class="ex-text">EX-03 : 404 Not Found 복구 페이지</text>

</svg>
