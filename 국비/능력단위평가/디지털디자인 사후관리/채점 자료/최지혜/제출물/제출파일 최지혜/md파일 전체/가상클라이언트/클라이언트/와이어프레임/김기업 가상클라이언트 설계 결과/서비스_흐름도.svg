<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAFDFD; }
      .title { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 22px; fill: #1A365D; }
      .subtitle { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 13px; fill: #585D62; }
      .start-end { fill: #1A365D; stroke: #0F294A; stroke-width: 2px; rx: 20px; }
      .start-end-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
      .action-node { fill: #EBF3FA; stroke: #2B6CB0; stroke-width: 1.5px; rx: 6px; }
      .action-title { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 12px; fill: #1A365D; text-anchor: middle; }
      .action-desc { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 10px; fill: #4B5563; text-anchor: middle; }
      .decision-node { fill: #FFF6ED; stroke: #D97706; stroke-width: 1.5px; }
      .decision-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #92400E; text-anchor: middle; }
      .system-node { fill: #E8F3F1; stroke: #4A7C72; stroke-width: 1.5px; rx: 4px; }
      .system-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #1A3B34; text-anchor: middle; }
      .error-node { fill: #FEE2E2; stroke: #EF4444; stroke-width: 1.5px; rx: 6px; stroke-dasharray: 3 3; }
      .error-text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-weight: 700; font-size: 11px; fill: #991B1B; text-anchor: middle; }
      .flow-line { stroke: #2B6CB0; stroke-width: 1.5px; fill: none; marker-end: url(#arrow-blue); }
      .branch-line { stroke: #D97706; stroke-width: 1.2px; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrow-orange); }
      .branch-label { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size: 10px; fill: #D97706; font-weight: 600; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B6CB0" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="960" class="bg" />

  <!-- Title Header -->
  <text x="50" y="45" class="title">🔄 플로뜰리에 (Flottelier) - 김기업 B2B 서비스 흐름도 (Service Flowchart)</text>
  <text x="50" y="70" class="subtitle">예산별 선택 ➔ 로고 금/은사 자수 ➔ 엑셀 일괄 배송 ➔ 직인 견적서 PDF ➔ 세금계산서 ➔ D-Day 확약서</text>

  <!-- Flow Steps -->

  <!-- 0. START -->
  <rect x="475" y="100" width="250" height="40" class="start-end" />
  <text x="600" y="125" class="start-end-text">시작: 기업 담당자 B2B 플랫폼 접속 (P-01)</text>

  <!-- 1. BROWSE -->
  <line x1="600" y1="140" x2="600" y2="175" class="flow-line" />
  <rect x="475" y="175" width="250" height="50" class="action-node" />
  <text x="600" y="196" class="action-title">1. 탐색: 3/5/10만원대 기프트 팩 (P-02~04)</text>
  <text x="600" y="213" class="action-desc">수량별 대량 할인율(25~40%) 실시간 확인</text>

  <!-- DECISION 1: SAMPLE -->
  <line x1="600" y1="225" x2="600" y2="260" class="flow-line" />
  <polygon points="600,260 720,295 600,330 480,295" class="decision-node" />
  <text x="600" y="292" class="decision-text">경영진 대면 보고용</text>
  <text x="600" y="306" class="decision-text">무료 샘플 필요?</text>

  <!-- Branch: Sample Path -->
  <line x1="480" y1="295" x2="260" y2="295" class="branch-line" />
  <text x="320" y="285" class="branch-label">샘플 먼저 신청</text>
  <rect x="80" y="270" width="180" height="50" class="action-node" />
  <text x="170" y="291" class="action-title">기업 무료 샘플 신청</text>
  <text x="170" y="308" class="action-desc">24H 긴급 발송 (P-12)</text>

  <line x1="170" y1="320" x2="170" y2="355" class="branch-line" />
  <rect x="80" y="355" width="180" height="50" class="system-node" />
  <text x="170" y="376" class="system-text">실물 패키지 퀵 수령</text>
  <text x="170" y="393" class="action-desc">임원 품의 통과 후 본품 재진입</text>
  <line x1="260" y1="380" x2="475" y2="380" class="branch-line" />

  <!-- 2. SELECT GIFT -->
  <line x1="600" y1="330" x2="600" y2="365" class="flow-line" />
  <text x="605" y="350" class="branch-label">본품 즉시 발주</text>
  <rect x="475" y="365" width="250" height="50" class="action-node" />
  <text x="600" y="386" class="action-title">2. 선택: 5만원대 프리미엄 팩 (P-03)</text>
  <text x="600" y="403" class="action-desc">수량 200세트 입력 &amp; 35% 할인 확정</text>

  <!-- 3. CI EMBROIDERY & CEO CARD -->
  <line x1="600" y1="415" x2="600" y2="450" class="flow-line" />
  <rect x="475" y="450" width="250" height="50" class="action-node" />
  <text x="600" y="471" class="action-title">3. 커스텀: 로고 자수 &amp; CEO 카드 (P-05~06)</text>
  <text x="600" y="488" class="action-desc">AI 로고 업로드 + 금/은사 Canvas 렌더링 (M-03)</text>

  <!-- 4. EXCEL DELIVERY -->
  <line x1="600" y1="500" x2="600" y2="535" class="flow-line" />
  <rect x="475" y="535" width="250" height="50" class="system-node" />
  <text x="600" y="556" class="system-text">4. 엑셀 주소록 1초 일괄 업로드 (P-07 / M-01)</text>
  <text x="600" y="573" class="action-desc">200명 주소 파싱 &amp; 수백 개 송장 자동 분기</text>

  <!-- DECISION 2: EXCEL VALIDATION -->
  <line x1="600" y1="585" x2="600" y2="615" class="flow-line" />
  <polygon points="600,615 720,645 600,675 480,645" class="decision-node" />
  <text x="600" y="642" class="decision-text">엑셀 주소 데이터</text>
  <text x="600" y="656" class="decision-text">유효성 검증</text>

  <!-- Branch: Excel Error -->
  <line x1="720" y1="645" x2="880" y2="645" class="branch-line" />
  <text x="740" y="635" class="branch-label">오류 행 감지</text>
  <rect x="880" y="620" width="220" height="50" class="error-node" />
  <text x="990" y="641" class="error-text">EX-01 엑셀 오류 안내</text>
  <text x="990" y="658" class="action-desc">화면 내 인라인 즉시 수정</text>
  <line x1="990" y1="620" x2="990" y2="560" class="branch-line" />
  <line x1="990" y1="560" x2="725" y2="560" class="branch-line" />

  <!-- 5. QUOTE PDF -->
  <line x1="600" y1="675" x2="600" y2="705" class="flow-line" />
  <text x="605" y="695" class="branch-label">검증 완료</text>
  <rect x="475" y="705" width="250" height="50" class="action-node" />
  <text x="600" y="726" class="action-title">5. 품의: 직인 견적서 PDF 1초 출력 (M-04)</text>
  <text x="600" y="743" class="action-desc">법인 직인 날인 공식 B2B 견적서 다운로드</text>

  <!-- 6. CHECKOUT & TAX -->
  <line x1="600" y1="755" x2="600" y2="785" class="flow-line" />
  <rect x="475" y="785" width="250" height="50" class="system-node" />
  <text x="600" y="806" class="system-text">6. 결제: 사업자 세금계산서 &amp; 법인 결제 (P-10)</text>
  <text x="600" y="823" class="action-desc">국세청 사업자 실시간 검증 &amp; 전자세금계산서 예약</text>

  <!-- 7. COMPLETE & TRACKING -->
  <line x1="600" y1="835" x2="600" y2="865" class="flow-line" />
  <rect x="475" y="865" width="250" height="50" class="action-node" />
  <text x="600" y="886" class="action-title">7. D-Day 확약서 &amp; ESG 탄소 리포트 (P-08/11)</text>
  <text x="600" y="903" class="action-desc">실시간 배송 트래킹 대시보드 활성화 (P-09)</text>

  <!-- 8. END -->
  <line x1="600" y1="915" x2="600" y2="940" class="flow-line" />
  <rect x="475" y="940" width="250" height="30" class="start-end" />
  <text x="600" y="960" class="start-end-text">종료: 전 임직원 100% 무비닐 ESG 선물 전달 완료</text>

</svg>
